<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Title I Program Requirements Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>

:root{
  /* Workspace: a form on the left, the real documents on the right as paper. GRPS blue for structure, orange for action, gold for "needs attention". */
  --ink:#15293b;
  --blue:#005696;
  --blue-soft:#e7f0f8;
  --orange:#c85a0b;
  --orange-bright:#f57b20;
  --gold:#f0b310;
  --desk:#eef0ee;
  --paper:#ffffff;
  --panel:#fbfbf9;
  --line:#dcdfdc;
  --muted:#5a6570;
  --good:#1d7a4c; --good-bg:#e6f4ec;
  --todo:#8a5a00; --todo-bg:#fff4d9;
  --stop:#a3330c; --stop-bg:#fde9df;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-doc:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* top bar */
.bar{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar-in{display:flex;align-items:center;gap:14px;padding:10px 20px;max-width:1440px;margin:0 auto;flex-wrap:wrap}
.bar img{height:38px;width:auto;display:block}
.bar .ttl{font-family:var(--font-display);font-size:19px;font-weight:700}
.bar .ttl small{display:block;font-family:var(--font-body);font-size:13px;font-weight:500;color:var(--muted)}
.bar .sp{flex:1}
.bar .home{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border:1px solid var(--line);border-radius:999px;color:var(--ink,#15293B);text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap}.bar .home:hover,.bar .home:focus-visible{background:#E7F0F8;border-color:#005696;color:#005696}@media print{.bar .home{display:none}}@media (max-width:700px){.bar .home{padding:8px}.bar .home span{display:none}}
.saved{font-size:13px;color:var(--muted)}
.btn{border:0;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer;font-size:15px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.main{background:var(--orange);color:#fff}
.btn.main:hover{background:#ad4d08}
.btn.line{background:var(--paper);border:1.5px solid #c7d3dd;color:var(--blue)}
.btn.line:hover{border-color:var(--blue)}
.btn.text{background:none;color:var(--blue);padding:6px 8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{font-size:13.5px;padding:6px 10px}

/* mobile switcher */
.switch{display:none;gap:6px;padding:8px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.switch button{flex:1;border:1.5px solid var(--line);background:var(--panel);border-radius:99px;padding:7px 8px;font-weight:600;font-size:14px;cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}

.work{display:grid;grid-template-columns:minmax(340px,430px) 1fr;gap:0;max-width:1440px;margin:0 auto;min-height:calc(100% - 60px)}
.build{background:var(--panel);border-right:1px solid var(--line);padding:18px 18px 80px}
.view{padding:18px 24px 80px;display:grid;gap:18px;align-content:start;min-width:0}

/* intro */
.intro{display:grid;gap:8px;margin-bottom:14px}
.intro h1{font-size:24px}
.intro p{color:var(--muted);font-size:15px}

/* accordion sections */
.sec{border:1px solid var(--line);background:var(--paper);border-radius:12px;margin-bottom:10px;overflow:hidden}
.sec>button.head{width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;background:none;border:0;cursor:pointer;text-align:left}
.sec .num{flex:0 0 26px;height:26px;border-radius:99px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--blue-soft);color:var(--blue)}
.sec .num.ok{background:var(--good);color:#fff}
.sec .head b{font-size:16px;font-weight:700}
.sec .head small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.sec .head .chev{margin-left:auto;color:var(--blue);font-size:18px;transition:transform .15s}
.sec.open .head .chev{transform:rotate(90deg)}
.sec .body{display:none;padding:2px 14px 16px;gap:14px}
.sec.open .body{display:grid;grid-template-columns:minmax(0,1fr)}
.field{min-width:0}input,select,textarea{min-width:0}

.field{display:grid;gap:5px}
.field>label,.field>.lbl{font-weight:600;font-size:14.5px}
.hint{font-size:13px;color:var(--muted)}
input[type=text],input[type=date],input[type=time],select,textarea{width:100%;padding:9px 11px;border:1.5px solid #c9cfd3;border-radius:9px;background:#fff;font-size:15.5px}
textarea{resize:vertical;min-height:70px;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.row3{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 11px;font-size:14px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.bad[aria-pressed="true"]{background:var(--stop);border-color:var(--stop)}
.acts{display:grid;gap:6px}
.actopt{display:flex;gap:10px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;cursor:pointer}
.actopt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.actopt b{display:block;font-size:14.5px}
.actopt span{font-size:13px;color:var(--muted)}
.inline-note{font-size:13.5px;padding:8px 10px;border-radius:8px;background:var(--todo-bg);color:#6b4600}
.inline-note.stop{background:var(--stop-bg);color:#7e2708}
.inline-note.ok{background:var(--good-bg);color:#145a37}

/* readiness */
.ready{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.ring{width:92px;height:92px;position:relative}
.ring svg{display:block}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1}
.ring .lbl small{display:block;font-family:var(--font-body);font-size:11px;font-weight:600;color:var(--muted);margin-top:2px}
.ready h2{font-size:19px;margin-bottom:4px}
.ready .sub{color:var(--muted);font-size:14px;margin-bottom:10px}
.checks{display:grid;gap:6px}
.ck{border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;font-size:14.5px}
.ck.todo{background:transparent;border-left:4px solid var(--gold);border-radius:0 8px 8px 0}
.ck.stop{background:var(--stop-bg);border-left:4px solid var(--stop);border-radius:0 8px 8px 0}
.ck.ok{background:transparent;color:var(--muted);padding:3px 10px}
.ck .why summary{cursor:pointer;color:var(--blue);font-weight:600;font-size:13px}
.ck .why>div{margin-top:4px}
.intro .links{display:flex;gap:4px;margin-left:-8px}
hr.split{border:0;border-top:2px dashed #cfd5d9;margin:34px 0}
.res-sec .num{background:#eef0ee;color:var(--muted);font-style:italic}
.ready{align-items:center}
.sec{margin-bottom:8px}
.ck .dot{width:18px;height:18px;border-radius:99px;margin-top:2px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}
.ck.todo .dot{background:var(--gold);color:#4d3600}
.ck.stop .dot{background:var(--stop)}
.ck.ok .dot{background:var(--good)}
.ck .t b{font-weight:700}
.ck .why{font-size:13.5px;margin-top:4px;color:#3b4650}
.ck .why .lvl{font-size:11px;font-weight:800;padding:1px 6px;border-radius:99px;margin-right:6px;text-transform:uppercase;letter-spacing:.03em}
.lvl.law{background:#d9e8f5;color:var(--blue)}
.lvl.grps{background:#ffe1c7;color:#8a3b07}
.lvl.practice{background:#e7e7e2;color:#4b4f53}
.ck .acts2{display:flex;gap:2px}
.more-ok{font-size:13.5px;color:var(--muted);background:none;border:0;cursor:pointer;padding:4px 10px;text-align:left}

/* packet */
.packet{display:grid;gap:10px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px;font-weight:600;font-size:14.5px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--orange-bright)}
.tabtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabtools .note{font-size:13.5px;color:var(--muted);flex:1;min-width:200px}
.sheet{background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(21,41,59,.08);border-radius:4px;padding:40px 48px;font-family:var(--font-doc);font-size:15.5px;line-height:1.5;max-width:860px;width:100%;overflow-x:auto}
.sheet h3{font-family:var(--font-display);font-size:22px;color:var(--blue);margin-bottom:2px}
.sheet h4{font-family:var(--font-display);font-size:16px;margin:16px 0 6px}
.sheet .meta{font-family:var(--font-body);font-size:14px;color:var(--muted);margin-bottom:14px}
.sheet table{border-collapse:collapse;width:100%;font-family:var(--font-body);font-size:14px}
.sheet th,.sheet td{border:1px solid #b9c0c6;padding:7px 8px;vertical-align:top;text-align:left}
.sheet th{background:#f1f4f6;font-weight:700}
.sheet td.tm{white-space:nowrap;font-variant-numeric:tabular-nums;width:110px}
.sheet td.blank{height:34px}
.sheet ul{margin:6px 0 0;padding-left:20px}
.sheet .logo{height:42px;float:right;margin:-6px 0 0 14px}
.sheet .flyer{text-align:center;display:grid;gap:10px;font-family:var(--font-body)}
.sheet .flyer .big{font-family:var(--font-display);font-size:34px;color:var(--blue);line-height:1.1}
.sheet .flyer .when{font-size:19px;font-weight:700}
.sheet .flyer ul{text-align:left;display:inline-block;margin:0 auto}
.fill{background:#fff4d9;border-bottom:1.5px dashed #c79400;padding:0 3px}
.sheet .small{font-family:var(--font-body);font-size:13px;color:var(--muted)}
.tp{display:grid;gap:14px;font-family:var(--font-body)}
.tp .item{display:grid;gap:6px}
.tp .item label{font-weight:700;font-size:14.5px}
.tp .item .who{font-size:12.5px;color:var(--muted);font-weight:600}
.tp textarea{font-family:var(--font-doc);font-size:15.5px}
.tp .ai{display:flex;gap:6px;align-items:center}
.ev{display:grid;gap:6px;font-family:var(--font-body)}
.ev label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.ev label.done{background:var(--good-bg);border-color:#b9dfc9}
.ev input{width:19px;height:19px;margin-top:2px;accent-color:var(--good)}
.ev small{display:block;color:var(--muted);font-size:12.5px}
.aibox{border:1.5px solid #c7d3dd;border-radius:10px;padding:12px 14px;background:#f8fbfd;display:grid;gap:8px;font-family:var(--font-body)}
.aibox pre{white-space:pre-wrap;font-family:var(--font-doc);font-size:15px;margin:0}
.res{display:grid;gap:8px;font-family:var(--font-body)}
.res a{font-weight:600}
.res div{border-top:1px solid var(--line);padding-top:8px;font-size:14px}
.res div p{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14.5px;z-index:50;box-shadow:0 8px 20px rgba(0,0,0,.2)}

@media (max-width:900px){
  .switch{display:flex}
  .work{grid-template-columns:1fr}
  .build{border-right:0}
  .work[data-pane="build"] .view{display:none}
  .work[data-pane="packet"] .build{display:none}
  .sheet{padding:24px 18px}
  .bar .saved{display:none}
}
@media (max-width:520px){
  .row2,.row3{grid-template-columns:1fr}
  .ready{grid-template-columns:1fr}
  .bar-in{padding:8px 14px}
  .bar .ttl small{display:none}
}
@media print{
  .bar,.switch,.build,.ready,.tabs,.tabtools{display:none!important}
  .work{display:block}.view{padding:0}.sheet{box-shadow:none;max-width:none}
}

.promises{display:grid;gap:6px}
.promise{display:flex;gap:8px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;cursor:pointer;font-size:14.5px;line-height:1.4;text-align:left}
.promise[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.promise .box{flex:0 0 18px;height:18px;border-radius:5px;border:2px solid #9aa5ae;margin-top:1px;display:grid;place-items:center;font-size:12px;color:#fff}
.promise[aria-pressed="true"] .box{background:var(--blue);border-color:var(--blue)}
.custom{display:flex;gap:6px;align-items:center;font-size:14.5px;padding:6px 10px;border:1.5px dashed #c7d3dd;border-radius:10px;background:#fff}
.custom span{flex:1}.custom button{border:0;background:none;color:var(--stop);font-weight:700;cursor:pointer}
.addrow{display:flex;gap:6px}.addrow input{flex:1}
.assure{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-size:14.5px;line-height:1.4}
.assure input{width:20px;height:20px;margin-top:1px;accent-color:var(--good);flex:0 0 auto}
.assure.on{border-color:#b9dfc9;background:var(--good-bg)}
.cites{font-size:12px;color:var(--muted);font-weight:600}
.crit{display:grid;gap:8px}
.critrow{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px;background:#fff}
.critrow input,.critrow textarea{font-size:14.5px}
.critrow textarea{min-height:52px}
.pdrow{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px;background:#fff}
.reqtag{display:inline-block;font-size:11.5px;font-weight:800;padding:1px 7px;border-radius:99px;background:var(--blue-soft);color:var(--blue);margin-right:6px}
.wkb{display:inline-flex;align-items:center;gap:8px;background:#e7f0f8;border:2px solid #005696;border-radius:999px;padding:4px 5px 4px 12px;font-size:14px;color:#15293b;white-space:nowrap;margin-right:12px;max-width:44vw}
.wkb b{font-size:15px;overflow:hidden;text-overflow:ellipsis}.wkb .wn{overflow:hidden;text-overflow:ellipsis}.wkb button{border:1.5px solid #c7d3dd;background:#fff;color:#005696;font-weight:700;font-size:13px;border-radius:999px;padding:4px 11px;cursor:pointer;font-family:inherit}
.wkb.none{background:#fff7ef;border-color:#c85a0b}.wkb.none button{color:#c85a0b}
@media(max-width:760px){.wkb .wl{display:none}.wkb{max-width:calc(100vw - 32px);margin-right:6px}}
</style>
</head>

const blank=()=>({school:'',schoolCode:'',schoolOther:false,model:'Schoolwide',year:'2026–27',r5_hasK:true,r5_hasHS:false,r3_crit:JSON.parse(JSON.stringify(CRIT_DEFAULT)),r7_pd:[{obj:'',aud:'',when:''}],open:'r0',tab:'template',showAll:false,evidence:{}});
let S=blank();
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(blank(),JSON.parse(r));}catch(e){}
if(Array.isArray(S.r3_crit)&&S.r3_crit.length===6&&S.r3_crit.every((r,i)=>r.src===CRIT_OLD_SRC[i])&&S.r3_crit[4].exit===CRIT_OLD_EXIT8){S.r3_crit=JSON.parse(JSON.stringify(CRIT_DEFAULT));}
let saveT;function wk(){const el=document.getElementById('wkb');if(!el)return;const nm=S.school||'';el.className='wkb'+(nm?'':' none');
 el.innerHTML=nm?`<span aria-hidden="true">📍</span><span class="wn"><span class="wl">Working on </span><b>${esc(nm)}</b></span><button type="button" data-wkchg="1" aria-label="Change school (now ${esc(nm)})">Change</button>`:`<span aria-hidden="true">📍</span><span class="wn"><b>No school chosen</b></span><button type="button" data-wkchg="1">Choose</button>`}
document.addEventListener('click',e=>{if(!e.target.closest('[data-wkchg]'))return;S.open='r0';setPane('build');render();setTimeout(()=>{const s=document.getElementById('i_schoolPick');if(s){s.scrollIntoView({block:'center'});s.focus();}},60)});
function save(){wk();clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){$('saved').textContent='Not saved: this browser blocks storage';}},250);}
window.addEventListener('pagehide',()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const ph=(v,l)=>v?esc(v):`<span class="fill">${esc(l)}</span>`;
const schoolRec=()=>SCHOOLS.find(x=>x.c===S.schoolCode);
function fmtDate(v){if(!v)return'';const [y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});}
const isTA=()=>S.model==='Targeted assistance';

function checks(){
 const L=REQS.map(r=>({id:r.id,state:r.done(S)?'ok':'todo',level:'law',title:`${r.n}. ${r.title}`,fix:r.fix,why:`Required in the Title I program template for ${isTA()?'targeted assistance':'schoolwide'} schools (ESSA ${r.cites}). MDE may ask for the completed template and attachments during monitoring.`,sec:r.id}));
 const reviewed=S.r9_date?((Date.now()-new Date(S.r9_date).getTime())/864e5<=366):false;
 L.push({id:'fresh',state:reviewed?'ok':'todo',level:'grps',title:'Reviewed within the last year',fix:S.r9_date?'The last review date is more than a year ago. Schedule this year’s review.':'Add the date the program was last reviewed (requirement 9).',why:'The program must be reviewed at least once a year. GRPS evaluates programs each spring and plans the next year from that evaluation.',sec:'r9'});
 return L;
}

function schoolBlock(){const f=schoolRec();return `<div class="field"><label for="i_schoolPick">School</label><select id="i_schoolPick" data-school="1"><option value="">Choose your school…</option>${SCHOOLS.filter(x=>!x.sample||S.schoolCode===x.c).map(x=>`<option value="${x.c}" ${S.schoolCode===x.c?'selected':''}>${esc(x.n)}</option>`).join('')}<option value="other" ${S.schoolOther?'selected':''}>Another school or program (type it)</option></select>${S.schoolOther?`<input type="text" id="i_school" data-k="school" value="${esc(S.school)}" placeholder="School or program name" aria-label="School or program name">`:''}
 ${f?(f.p==='NT'?`<p class="inline-note">Listed as not Title I eligible on the 2026–27 Title I Sites List.</p>`:f.p?`<span class="hint">${f.p==='SW'?'Schoolwide':'Targeted assistance'} program (2026–27 Title I Sites List).</span>`:`<span class="hint">Not on the 2026–27 Title I Sites List. Confirm with the Title I office.</span>`):''}</div>
 ${f&&f.p?'':`<div class="field"><label for="i_model">Title I program</label><select id="i_model" data-k="model">${['Schoolwide','Targeted assistance'].map(o=>`<option ${S.model===o?'selected':''}>${o}</option>`).join('')}</select></div>`}
 <div class="field"><label for="i_year">School year</label><input type="text" id="i_year" data-k="year" value="${esc(S.year)}"></div>
 <label class="toggle"><input type="checkbox" data-k="r5_hasK" ${S.r5_hasK?'checked':''}> School serves kindergarten or preschool</label>
 <label class="toggle"><input type="checkbox" data-k="r5_hasHS" ${S.r5_hasHS?'checked':''}> School serves high school grades</label>`;}
function fieldHtml(f){
 if(f.showIf&&!f.showIf(S))return'';
 const id='f_'+f.k;
 if(f.type==='assure')return `<label class="assure ${S[f.k]?'on':''}"><input type="checkbox" id="${id}" data-k="${f.k}" ${S[f.k]?'checked':''}><span>${esc(f.label)}</span></label>`;
 if(f.type==='date')return `<div class="field"><label for="${id}">${esc(f.label)}</label><input type="date" id="${id}" data-k="${f.k}" value="${esc(S[f.k]||'')}"></div>`;
 if(f.type==='text')return `<div class="field"><label for="${id}">${esc(f.label)}</label><input type="text" id="${id}" data-k="${f.k}" value="${esc(S[f.k]||'')}" placeholder="${esc(f.ph||'')}"></div>`;
 if(f.type==='area')return `<div class="field"><label for="${id}">${esc(f.label)}</label><textarea id="${id}" data-k="${f.k}" placeholder="${esc(f.ph||'')}">${esc(S[f.k]||'')}</textarea></div>`;
 if(f.type==='chips'){const sel=S[f.k]||[];const x=S[f.k+'_x']||[];return `<div class="field"><span class="lbl">${esc(f.label)}</span><div class="promises">${f.opts.map(o=>`<button class="promise" data-pick="${f.k}" data-v="${esc(o)}" aria-pressed="${sel.includes(o)}"><span class="box">${sel.includes(o)?'✓':''}</span><span>${esc(o)}</span></button>`).join('')}${f.custom?x.map((t,i)=>`<div class="custom"><span>${esc(t)}</span><button data-delx="${f.k}_x" data-i="${i}" aria-label="Remove">×</button></div>`).join('')+`<div class="addrow"><input type="text" id="add_${f.k}_x" placeholder="Add your own" aria-label="Add your own: ${esc(f.label)}"><button class="btn line sm" data-addx="${f.k}_x">Add</button></div>`:''}</div></div>`;}
 if(f.type==='criteria')return `<div class="field"><span class="lbl">${esc(f.label)}</span><span class="hint">GRPS handbook criteria, updated to Michigan’s 2026–27 state tests and College Board’s current benchmarks. The Title I office should confirm the cut scores. Then edit them for your school. <a href="https://docs.google.com/document/d/1KRMe3LFONk7fchXZBQtZRxKqABA2EnOB3ogu_efkBhU/edit" target="_blank" rel="noopener">District identification procedure</a>.</span><div class="crit">${(S.r3_crit||[]).map((r,i)=>`<div class="critrow"><input type="text" data-crit="${i}" data-f="src" value="${esc(r.src)}" aria-label="Data source ${i+1}"><textarea data-crit="${i}" data-f="entry" aria-label="Entry criteria ${i+1}" placeholder="Entry criteria">${esc(r.entry)}</textarea><textarea data-crit="${i}" data-f="exit" aria-label="Exit criteria ${i+1}" placeholder="Exit criteria">${esc(r.exit)}</textarea><div style="text-align:right"><button class="btn text sm" data-delcrit="${i}">Remove</button></div></div>`).join('')}</div><div class="addrow"><button class="btn line sm" data-act="addcrit">Add a data source</button><button class="btn text sm" data-act="resetcrit">Reset to GRPS criteria</button></div></div>`;
 if(f.type==='pd')return `<div class="field"><span class="lbl">${esc(f.label)}</span><span class="hint">Sustained learning tied to common objectives, not one-time events.</span>${(S.r7_pd||[]).map((r,i)=>`<div class="pdrow"><input type="text" data-pd="${i}" data-f="obj" value="${esc(r.obj)}" placeholder="Learning objective" aria-label="Objective ${i+1}"><div class="row2"><input type="text" data-pd="${i}" data-f="aud" value="${esc(r.aud)}" placeholder="Audience" aria-label="Audience ${i+1}"><input type="text" data-pd="${i}" data-f="when" value="${esc(r.when)}" placeholder="When" aria-label="Timing ${i+1}"></div>${S.r7_pd.length>1?`<div style="text-align:right"><button class="btn text sm" data-delpd="${i}">Remove</button></div>`:''}</div>`).join('')}<button class="btn line sm" data-act="addpd">Add a session or series</button></div>`;
 return '';
}
function renderBuild(C){
 const intro=`<div class="intro"><h1>Complete your Title I program template</h1><p>Answer each requirement for your school. The completed template, entry and exit protocol, and evidence list build as you go.</p><p class="links"><button class="btn text sm" data-act="example">See an example</button><button class="btn text sm" data-act="new">Start over</button></p></div>`;
 const head=`<div class="sec ${S.open==='r0'?'open':''}" id="sec_r0"><button class="head" data-sec="r0" aria-expanded="${S.open==='r0'}"><span class="num ${S.school?'ok':''}">${S.school?'✓':'•'}</span><span><b>Your school</b><small>School, program type and grades</small></span><span class="chev">›</span></button><div class="body">${S.open==='r0'?schoolBlock():''}</div></div>`;
 const secs=REQS.map(r=>{const ok=r.done(S);return `<div class="sec ${S.open===r.id?'open':''}" id="sec_${r.id}"><button class="head" data-sec="${r.id}" aria-expanded="${S.open===r.id}"><span class="num ${ok?'ok':''}">${ok?'✓':r.n}</span><span><b>${esc(r.title)}</b><small>Requirement ${r.n}</small></span><span class="chev">›</span></button><div class="body">${S.open===r.id?`<p class="cites">ESSA ${esc(r.cites)}</p>${r.intro?`<p class="hint">${esc(r.intro)}</p>`:''}${r.fields.map(fieldHtml).join('')}`:''}</div></div>`;}).join('');

/* ================= DOCUMENTS ================= */
function ring(n,tot){const r=38,c=2*Math.PI*r,p=n/tot;return `<div class="ring"><svg width="92" height="92" viewBox="0 0 92 92" aria-hidden="true"><circle cx="46" cy="46" r="${r}" fill="none" stroke="#e3e6e3" stroke-width="9"/><circle cx="46" cy="46" r="${r}" fill="none" stroke="${n===tot?'#1d7a4c':'#005696'}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 46 46)"/></svg><div class="lbl"><span>${n}/${tot}<small>ready</small></span></div></div>`;}
function renderReady(C){
 const ok=C.filter(c=>c.state==='ok');const open=C.filter(c=>c.state!=='ok');
 const lvl={law:'Federal law',grps:'GRPS',practice:'Good practice'};
 const ck=c=>`<div class="ck ${c.state}" id="ck_${c.id}"><span class="dot">${c.state==='ok'?'✓':''}</span><div class="t"><b>${esc(c.title)}</b>${c.state!=='ok'?`<div>${esc(c.fix)}</div><details class="why"><summary>Why this matters</summary><div><span class="lvl ${c.level}">${lvl[c.level]}</span>${esc(c.why)}</div></details>`:''}</div>${c.state!=='ok'?`<button class="btn text sm" data-fix="${c.sec}">Fix</button>`:''}</div>`;
 const list=S.showAll?[...open,...ok]:open.slice(0,1);
 return `<div class="ready">${ring(ok.length,C.length)}<div><h2>${open.length?(S.showAll?'Readiness check':'Next up'):'Ready for review'}</h2>${open.length?'':`<p class="sub">Every requirement is answered. Download the template and keep it with its attachments.</p>`}<div class="checks">${list.map(ck).join('')}</div>${(open.length>1||S.showAll)?`<button class="more-ok" data-act="toggleAll">${S.showAll?'Show less':'See all '+open.length+' to finish'}</button>`:''}</div></div>`;
}
function answerList(f){
 if(f.showIf&&!f.showIf(S))return null;
 if(f.type==='assure')return {label:f.label,val:S[f.k]?'Yes':'Not yet confirmed',assure:true};
 if(f.type==='date')return {label:f.label,val:S[f.k]?fmtDate(S[f.k]):''};
 if(f.type==='text'||f.type==='area')return {label:f.label,val:(S[f.k]||'').trim()};
 if(f.type==='chips')return {label:f.label,list:[...(S[f.k]||[]),...(S[f.k+'_x']||[])]};
 if(f.type==='criteria')return {label:'Entry and exit criteria',crit:true};
 if(f.type==='pd')return {label:'Professional learning plan',pd:true};
}
function critTable(){return `<table><thead><tr><th style="width:24%">Data source</th><th>Entry (eligible for services)</th><th>Exit</th></tr></thead><tbody>${(S.r3_crit||[]).map(r=>`<tr><td><b>${esc(r.src)}</b></td><td>${esc(r.entry)}</td><td>${esc(r.exit)}</td></tr>`).join('')}</tbody></table>`;}
function pdTable(){const rows=(S.r7_pd||[]).filter(r=>r.obj||r.aud||r.when);return `<table><thead><tr><th>Learning objective</th><th>Audience</th><th>When</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td>${esc(r.obj)}</td><td>${esc(r.aud)}</td><td>${esc(r.when)}</td></tr>`).join(''):'<tr><td colspan="3"><span class="fill">Add professional learning</span></td></tr>'}</tbody></table>`;}
function docTemplate(){return `<img class="logo" src="${LOGO}" alt="GRPS"><h3>Title I ${esc(S.model==='Targeted assistance'?'Targeted Assistance':'Schoolwide')} Program Requirements</h3><div class="meta">${ph(S.school,'School name')} · ${esc(S.year)} · Aligned to ESEA sections 1112, 1114, 1115, 1116, 2102 and 8101</div>`+
 REQS.map(r=>`<h4><span class="reqtag">${r.n}</span>${esc(r.title)}</h4><p class="small">ESSA ${esc(r.cites)}</p>`+r.fields.map(answerList).filter(Boolean).map(a=>{
  if(a.crit)return `<p><b>${esc(a.label)}</b></p>${critTable()}`;
  if(a.pd)return `<p><b>${esc(a.label)}</b></p>${pdTable()}`;
  if(a.list)return `<p><b>${esc(a.label)}:</b></p>${a.list.length?`<ul>${a.list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p><span class="fill">To be completed</span></p>'}`;
  if(a.assure)return `<p>${esc(a.label)} <b>${a.val==='Yes'?'Yes':'<span class="fill">Not yet confirmed</span>'}</b></p>`;
  return `<p><b>${esc(a.label)}:</b> ${a.val?esc(a.val):'<span class="fill">To be completed</span>'}</p>`;
 }).join('')).join('')+`<p class="small" style="margin-top:14px">Keep the completed template and attachments in the school’s Title I folder. MDE may request them during program monitoring.</p>`;}
function docProtocol(){return `<img class="logo" src="${LOGO}" alt="GRPS"><h3>Title I Entry and Exit Protocol</h3><div class="meta">${ph(S.school,'School name')} · ${esc(S.year)} · ${esc(S.model)}</div>
 <p style="margin-bottom:8px">${isTA()?'Title I services go to the scholars with the greatest need first. Scholars are identified using the criteria below and ranked from lowest to highest.':'All scholars benefit from the schoolwide program. Scholars failing or most at risk of failing to meet state standards receive additional support, identified with the criteria below.'}</p>
 <p><b>How scholars are identified:</b> ${[...(S.r3_id||[]),...(S.r3_id_x||[])].map(esc).join('; ')||'<span class="fill">identification process</span>'}.</p>
 <p><b>Who takes part:</b> ${ph(S.r3_who,'participants')}.</p>
 <p><b>Categorically eligible scholars</b> (homeless, foster care, migrant, neglected or delinquent, recent Head Start or Title I preschool) ${S.r3_cat?'are included.':'<span class="fill">confirm they are included</span>'}</p>
 <div style="margin:10px 0">${critTable()}</div>
 <p><b>Progress monitoring:</b> ${ph(S.r3_pm,'who, how, which assessments')}.</p>
 <p><b>Review cycle:</b> ${ph(S.r3_freq,'how often')}.</p>
 <p class="small" style="margin-top:8px">GRPS: generate the ranked Title I eligibility report after each MAP window. If a scholar with a lower score is not receiving services, record the reason. Keep completed reports on file for state and federal review. District procedure: <a href="https://docs.google.com/document/d/1KRMe3LFONk7fchXZBQtZRxKqABA2EnOB3ogu_efkBhU/edit" target="_blank" rel="noopener">GRPS Written Procedure for Identification of Title I, Part A Scholars</a>.</p>`;}
function docEvidence(){const n=EVID.filter(e=>S.evidence[e.id]).length;return `<img class="logo" src="${LOGO}" alt="GRPS"><h3>Attachments and Evidence</h3><div class="meta">${ph(S.school,'School name')} · ${esc(S.year)} · ${n} of ${EVID.length} collected</div><div class="ev">${EVID.map(e=>`<label class="${S.evidence[e.id]?'done':''}"><input type="checkbox" data-ev="${e.id}" ${S.evidence[e.id]?'checked':''}><span><b>${esc(e.t)}</b><small>${esc(e.d)}</small></span></label>`).join('')}</div>`;}
const TABS=[['template','Program template'],['protocol','Entry and exit protocol'],['evidence','Attachments']];
const DOCS={template:docTemplate,protocol:docProtocol,evidence:docEvidence};
function renderView(C){if(!DOCS[S.tab])S.tab='template';
 $('view').innerHTML=renderReady(C)+`<div class="packet"><div class="tabs" role="tablist" aria-label="Documents">${TABS.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}</button>`).join('')}</div><div class="tabtools"><span class="note"></span><button class="btn line sm" data-act="copy">Copy this page</button>${window.top===window?'<button class="btn line sm" data-act="print">Print</button>':''}</div><div class="sheet" id="sheet">${DOCS[S.tab]()}</div></div>`;}
function render(){const C=checks();renderBuild(C);renderView(C);save();}
function refreshView(){const C=checks();
 REQS.forEach(r=>{const n=document.querySelector('#sec_'+r.id+' .num');if(n){const ok=r.done(S);n.classList.toggle('ok',ok);n.textContent=ok?'✓':r.n;}});
 const y=window.scrollY;renderView(C);window.scrollTo(0,y);save();}
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600);}
function setPane(p){$('work').dataset.pane=p;document.querySelectorAll('.switch button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.pane===p));window.scrollTo(0,0);}

/* ================= EVENTS ================= */
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.k){const k=t.dataset.k;S[k]=t.type==='checkbox'?t.checked:t.value;if(t.type==='checkbox'||t.tagName==='SELECT'){const y=window.scrollY;render();window.scrollTo(0,y);return;}refreshView();return;}
 if(t.dataset.crit!==undefined){S.r3_crit[+t.dataset.crit][t.dataset.f]=t.value;refreshView();return;}
 if(t.dataset.pd!==undefined){S.r7_pd[+t.dataset.pd][t.dataset.f]=t.value;refreshView();return;}
 if(t.dataset.ev){S.evidence[t.dataset.ev]=t.checked;refreshView();return;}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.school){const v=t.value;if(v==='other'){S.schoolOther=true;S.schoolCode='';S.school='';}else{S.schoolOther=false;S.schoolCode=v;const f=SCHOOLS.find(x=>x.c===v);S.school=f?f.n:'';if(f&&f.p==='SW')S.model='Schoolwide';if(f&&f.p==='TA')S.model='Targeted assistance';}render();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('add_')){e.preventDefault();addCustom(e.target.id.slice(4));}});
function addCustom(k){const el=$('add_'+k);const v=(el&&el.value||'').trim();if(!v)return;(S[k]=S[k]||[]).push(v);render();const n=$('add_'+k);if(n)n.focus();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.sec){S.open=S.open===b.dataset.sec?'':b.dataset.sec;render();return;}
 if(b.dataset.fix){S.open=b.dataset.fix;setPane('build');render();const el=$('sec_'+S.open);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return;}
 if(b.dataset.pick){const k=b.dataset.pick,v=b.dataset.v;const a=S[k]||[];S[k]=a.includes(v)?a.filter(x=>x!==v):[...a,v];const y=window.scrollY;render();window.scrollTo(0,y);return;}
 if(b.dataset.addx){addCustom(b.dataset.addx);return;}
 if(b.dataset.delx){S[b.dataset.delx].splice(+b.dataset.i,1);render();return;}
 if(b.dataset.delcrit!==undefined){S.r3_crit.splice(+b.dataset.delcrit,1);render();return;}
 if(b.dataset.delpd!==undefined){S.r7_pd.splice(+b.dataset.delpd,1);render();return;}
 if(b.dataset.tab){S.tab=b.dataset.tab;refreshView();return;}
 if(b.dataset.pane){setPane(b.dataset.pane);return;}
 const a=b.dataset.act;if(!a)return;
 if(a==='addcrit'){S.r3_crit.push({src:'',entry:'',exit:''});render();return;}
 if(a==='resetcrit'){S.r3_crit=JSON.parse(JSON.stringify(CRIT_DEFAULT));render();toast('GRPS criteria restored.');return;}
 if(a==='addpd'){S.r7_pd.push({obj:'',aud:'',when:''});render();return;}
 if(a==='toggleAll'){S.showAll=!S.showAll;refreshView();return;}
 if(a==='example'){S=example();render();toast('Example loaded. Start over any time.');return;}
 if(a==='new'){if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='Tap again to clear';setTimeout(()=>{b.dataset.confirm='';b.textContent='Start over';},3000);return;}S=blank();render();toast('Cleared.');return;}
 if(a==='copy'){const el=$('sheet');const fb=()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Selected. Press Ctrl+C or Cmd+C to copy.');};try{navigator.clipboard.writeText(el.innerText).then(()=>toast('Copied.'),fb);}catch(err){fb();}return;}
 if(a==='print'){try{window.print();}catch(err){}return;}
 if(a==='download'){download(b);return;}
});
function example(){const x=blank();const y=new Date();const iso=new Date(y.getFullYear(),y.getMonth()-2,15).toISOString().slice(0,10);
 Object.assign(x,{school:'Example Elementary',schoolOther:true,model:'Schoolwide',r5_hasK:true,
 r1_assure:true,r1_date:iso,r1_data:['Academic achievement (state and local)','Attendance and chronic absenteeism','Caregiver, scholar and staff surveys'],r1_needs:'Reading in grades 3–5; root causes: inconsistent small-group instruction and chronic absenteeism above 30%.',
 r2_assure:true,r2_acad:['MTSS framework','Literacy continuum'],r2_non:['PBIS','Restorative practices'],r2_ec:true,
 r3_id:['Universal screening each assessment window','Ranked Title I eligibility report after each MAP window','Student Success Team (SST) review'],r3_who:'Classroom teachers, reading interventionist, paraprofessionals, principal, caregivers',r3_cat:true,r3_pm:'Interventionist monitors weekly; data team reviews every six weeks',r3_freq:'After each MAP window (fall, winter, spring)',
 r4_assure:true,r4_svc:['Math and reading intervention course','Instructional literacy paraprofessional'],r4_ext:['Extended Day academic program','Summer school'],r4_beh:'PBIS Tiers I–III with Student Success Team; restorative practices to reduce exclusionary discipline; coordinated with IDEA services.',
 r5_coord:['Title I staff join grade-level PLCs','Shared data meetings each assessment window'],r5_k:['Kindergarten visits and orientations','GSRP teams meet with kindergarten teachers to share developmental profiles'],r5_span:['Visits and orientations','Data sharing with sending and receiving schools'],r5_assure1:true,r5_assure2:true,
 r6_para:true,r6_teach:true,r6_rtk:true,
 r7_pd:[{obj:'Small-group reading instruction using the literacy continuum',aud:'K–5 teachers and interventionists',when:'Monthly, September–May'},{obj:'Two-way communication with caregivers',aud:'All staff',when:'August and January'}],r7_ind:'Two-year induction; mentors assigned by the principal by grade level; monthly mentor meetings; coordinated with GRPS new teacher program.',r7_assure:true,
 r8_plan:true,r8_compact:true,r9_who:['Teachers','Principals and other school leaders','Paraprofessionals','Specialized instructional support personnel','Parents and families','Community members'],r9_annual:true,r9_date:iso,r9_eval:true,open:'r0'});return x;}

/* ================= DOCX ================= */

function xe(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function run(t,o={}){return `<w:r><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/>${o.b?'<w:b/>':''}${o.i?'<w:i/>':''}${o.color?`<w:color w:val="${o.color}"/>`:''}<w:sz w:val="${o.sz||22}"/></w:rPr><w:t xml:space="preserve">${xe(t)}</w:t></w:r>`;}
function para(t,o={}){const runs=Array.isArray(t)?t.map(r=>typeof r==='string'?run(r,o):run(r.t,Object.assign({},o,r))).join(''):run(t,o);return `<w:p><w:pPr>${o.pb?'<w:pageBreakBefore/>':''}${o.center?'<w:jc w:val="center"/>':''}<w:spacing w:before="${o.before||0}" w:after="${o.after??120}"/>${o.bullet?'<w:ind w:left="360" w:hanging="240"/>':''}</w:pPr>${o.bullet?run('• ',o):''}${runs}</w:p>`;}
function h1(t,pb=true){return para(t,{b:true,sz:34,color:'005696',after:60,pb});}
function h2(t){return para(t,{b:true,sz:26,color:'15293B',before:200,after:80});}
function meta(){const [a,b]=segTimes();return para([S.school||'[School]',' · ',fmtDate(S.s1date)||'[Date]',' · ',a&&b?fmtTime(a)+'–'+fmtTime(b):'[Time]',' · ',S.place||'[Location]'],{sz:20,color:'5A6570',after:200});}
function cell(t,o={}){const paras=(Array.isArray(t)?t:[t]).map(x=>para((x&&typeof x==='object')?[x]:x,{sz:o.sz||20,b:o.b,after:40})).join('');return `<w:tc><w:tcPr>${o.w?`<w:tcW w:w="${o.w}" w:type="dxa"/>`:''}${o.shade?'<w:shd w:val="clear" w:color="auto" w:fill="F1F4F6"/>':''}</w:tcPr>${paras||'<w:p/>'}</w:tc>`;}
function table(head,rows,widths,rowH){const tr=(cells,hd)=>`<w:tr>${rowH&&!hd?`<w:trPr><w:trHeight w:val="${rowH}"/></w:trPr>`:''}${cells.map((c,i)=>cell(c,{b:hd,shade:hd,w:widths&&widths[i]})).join('')}</w:tr>`;
  return `<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>${['top','left','bottom','right','insideH','insideV'].map(s=>`<w:${s} w:val="single" w:sz="4" w:color="B9C0C6"/>`).join('')}</w:tblBorders><w:tblCellMar><w:left w:w="90" w:type="dxa"/><w:right w:w="90" w:type="dxa"/></w:tblCellMar></w:tblPr>${head?tr(head,true):''}${rows.map(r=>tr(r)).join('')}</w:tbl>`+para('',{after:80});}
const PB='<w:p><w:r><w:br w:type="page"/></w:r></w:p>';

async function buildDocx(){
  if(!window.JSZip)throw new Error('nozip');
  const z=new JSZip();
  z.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  z.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  z.file('word/document.xml',buildDocXml());
  return z.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
function buildDocXml(){
 const out=[];const C=checks();const open=C.filter(c=>c.state!=='ok');
 out.push(h1(`Title I ${S.model==='Targeted assistance'?'Targeted Assistance':'Schoolwide'} Program Requirements`,false),para([S.school||'[School]',' · ',S.year,' · District: ',DISTRICT.name,' (',DISTRICT.code,')',S.schoolCode?' · CEPI building code: '+S.schoolCode:''],{sz:20,color:'5A6570',after:200}));
 REQS.forEach(r=>{out.push(h2(`Requirement ${r.n}: ${r.title}`),para('ESSA '+r.cites,{sz:18,color:'5A6570',after:80}));
  r.fields.map(answerList).filter(Boolean).forEach(a=>{
   if(a.crit){out.push(para(a.label,{b:true,after:40}),table(['Data source','Entry (eligible for services)','Exit'],(S.r3_crit||[]).map(c=>[[{t:c.src,b:true}],c.entry,c.exit]),[2400,3700,3500]));}
   else if(a.pd){out.push(para(a.label,{b:true,after:40}),table(['Learning objective','Audience','When'],(S.r7_pd||[]).filter(r=>r.obj||r.aud||r.when).map(r=>[r.obj,r.aud,r.when]),[4600,2700,2300]));}
   else if(a.list){out.push(para(a.label+':',{b:true,after:40}));(a.list.length?a.list:['[To be completed]']).forEach(t=>out.push(para(t,{bullet:true,after:40,sz:21})));}
   else if(a.assure)out.push(para([a.label+' ',{t:a.val==='Yes'?'Yes':'[Not yet confirmed]',b:true}],{after:80,sz:21}));
   else out.push(para([{t:a.label+': ',b:true},a.val||'[To be completed]'],{after:80,sz:21}));
  });});
 out.push(h1('Title I Entry and Exit Protocol'),para([S.school||'[School]',' · ',S.year,' · ',S.model],{sz:20,color:'5A6570',after:160}));
 out.push(para(isTA()?'Title I services go to the scholars with the greatest need first. Scholars are identified using the criteria below and ranked from lowest to highest.':'All scholars benefit from the schoolwide program. Scholars failing or most at risk of failing to meet state standards receive additional support, identified with the criteria below.'));
 out.push(para([{t:'How scholars are identified: ',b:true},[...(S.r3_id||[]),...(S.r3_id_x||[])].join('; ')||'[identification process]']));
 out.push(para([{t:'Who takes part: ',b:true},S.r3_who||'[participants]']));
 out.push(para([{t:'Categorically eligible scholars: ',b:true},S.r3_cat?'Included (homeless, foster care, migrant, neglected or delinquent, recent Head Start or Title I preschool).':'[Confirm they are included]']));
 out.push(table(['Data source','Entry (eligible for services)','Exit'],(S.r3_crit||[]).map(c=>[[{t:c.src,b:true}],c.entry,c.exit]),[2400,3700,3500]));
 out.push(para([{t:'Progress monitoring: ',b:true},S.r3_pm||'[who, how, which assessments]']),para([{t:'Review cycle: ',b:true},S.r3_freq||'[how often]']));
 out.push(para('Generate the ranked Title I eligibility report after each MAP window. If a scholar with a lower score is not receiving services, record the reason. Keep completed reports on file for state and federal review.',{sz:19,i:true}));
 out.push(h1('Attachments and Evidence'));
 out.push(table(['✓','Record','What to include'],EVID.map(e=>[S.evidence[e.id]?'☑':'☐',[{t:e.t,b:true}],e.d]),[600,3600,5400]));
 if(open.length){out.push(h2('Still to finish'));open.forEach(c=>out.push(para(c.title+': '+c.fix,{bullet:true,sz:20,after:40})));}
 return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${out.join('')}<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1080" w:right="1080" w:bottom="1080" w:left="1080" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>`;
}
let DL=null;
async function download(btn){
 const name=(S.schoolCode?S.schoolCode+'_':'')+'Title_I_Program_Requirements'+(S.school?'_'+S.school.replace(/[^A-Za-z0-9]+/g,'_').replace(/_+$/,''):'')+'.docx';
 btn.disabled=true;const old=btn.textContent;btn.textContent='Preparing…';
 try{const blob=await buildDocx();
  if(DL){try{await DL.save({filename:name,data:blob});toast('Saved.');}catch(err){toast(err&&err.code==='declined'?'Download cancelled.':'Download is not available here. Use Copy this page instead.');}}
  else if(window.top===window){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Downloaded.');}
  else toast('Download is not available in this view. Use Copy this page instead.');
 }catch(err){toast('Could not build the file. Use Copy this page instead.');}
 finally{btn.disabled=false;btn.textContent=old;}
}
render();
if(window.claude&&typeof window.claude.use==='function'){window.claude.use('downloads').then(x=>{DL=x;}).catch(()=>{});}
})();
</script>
