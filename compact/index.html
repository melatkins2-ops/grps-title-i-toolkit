<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Title I Parent Compact and Title I Parent Policy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>

:root{
  /* Workspace: a form on the left, the real documents on the right as paper. GRPS blue for structure, orange for action, gold for "needs attention". */
  --ink:#15293b;
  --blue:#005696;
  --blue-soft:#e7f0f8;
  --orange:#c85a0b;
  --orange-bright:#f57b20;
  --gold:#f0b310;
  --desk:#eef0ee;
  --paper:#ffffff;
  --panel:#fbfbf9;
  --line:#dcdfdc;
  --muted:#5a6570;
  --good:#1d7a4c; --good-bg:#e6f4ec;
  --todo:#8a5a00; --todo-bg:#fff4d9;
  --stop:#a3330c; --stop-bg:#fde9df;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-doc:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* top bar */
.bar{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar-in{display:flex;align-items:center;gap:14px;padding:10px 20px;max-width:1440px;margin:0 auto;flex-wrap:wrap}
.bar img{height:38px;width:auto;display:block}
.bar .ttl{font-family:var(--font-display);font-size:19px;font-weight:700}
.bar .ttl small{display:block;font-family:var(--font-body);font-size:13px;font-weight:500;color:var(--muted)}
.bar .sp{flex:1}
.bar .home{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border:1px solid var(--line);border-radius:999px;color:var(--ink,#15293B);text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap}.bar .home:hover,.bar .home:focus-visible{background:#E7F0F8;border-color:#005696;color:#005696}@media print{.bar .home{display:none}}@media (max-width:700px){.bar .home{padding:8px}.bar .home span{display:none}}
.saved{font-size:13px;color:var(--muted)}
.btn{border:0;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer;font-size:15px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.main{background:var(--orange);color:#fff}
.btn.main:hover{background:#ad4d08}
.btn.line{background:var(--paper);border:1.5px solid #c7d3dd;color:var(--blue)}
.btn.line:hover{border-color:var(--blue)}
.btn.text{background:none;color:var(--blue);padding:6px 8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{font-size:13.5px;padding:6px 10px}

/* mobile switcher */
.switch{display:none;gap:6px;padding:8px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.switch button{flex:1;border:1.5px solid var(--line);background:var(--panel);border-radius:99px;padding:7px 8px;font-weight:600;font-size:14px;cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}

.work{display:grid;grid-template-columns:minmax(340px,430px) 1fr;gap:0;max-width:1440px;margin:0 auto;min-height:calc(100% - 60px)}
.build{background:var(--panel);border-right:1px solid var(--line);padding:18px 18px 80px}
.view{padding:18px 24px 80px;display:grid;gap:18px;align-content:start;min-width:0}

/* intro */
.intro{display:grid;gap:8px;margin-bottom:14px}
.intro h1{font-size:24px}
.intro p{color:var(--muted);font-size:15px}

/* accordion sections */
.sec{border:1px solid var(--line);background:var(--paper);border-radius:12px;margin-bottom:10px;overflow:hidden}
.sec>button.head{width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;background:none;border:0;cursor:pointer;text-align:left}
.sec .num{flex:0 0 26px;height:26px;border-radius:99px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--blue-soft);color:var(--blue)}
.sec .num.ok{background:var(--good);color:#fff}
.sec .head b{font-size:16px;font-weight:700}
.sec .head small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.sec .head .chev{margin-left:auto;color:var(--blue);font-size:18px;transition:transform .15s}
.sec.open .head .chev{transform:rotate(90deg)}
.sec .body{display:none;padding:2px 14px 16px;gap:14px}
.sec.open .body{display:grid;grid-template-columns:minmax(0,1fr)}
.field{min-width:0}input,select,textarea{min-width:0}

.field{display:grid;gap:5px}
.field>label,.field>.lbl{font-weight:600;font-size:14.5px}
.hint{font-size:13px;color:var(--muted)}
input[type=text],input[type=date],input[type=time],select,textarea{width:100%;padding:9px 11px;border:1.5px solid #c9cfd3;border-radius:9px;background:#fff;font-size:15.5px}
textarea{resize:vertical;min-height:70px;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.row3{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 11px;font-size:14px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.bad[aria-pressed="true"]{background:var(--stop);border-color:var(--stop)}
.acts{display:grid;gap:6px}
.actopt{display:flex;gap:10px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;cursor:pointer}
.actopt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.actopt b{display:block;font-size:14.5px}
.actopt span{font-size:13px;color:var(--muted)}
.inline-note{font-size:13.5px;padding:8px 10px;border-radius:8px;background:var(--todo-bg);color:#6b4600}
.inline-note.stop{background:var(--stop-bg);color:#7e2708}
.inline-note.ok{background:var(--good-bg);color:#145a37}

/* readiness */
.ready{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.ring{width:92px;height:92px;position:relative}
.ring svg{display:block}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1}
.ring .lbl small{display:block;font-family:var(--font-body);font-size:11px;font-weight:600;color:var(--muted);margin-top:2px}
.ready h2{font-size:19px;margin-bottom:4px}
.ready .sub{color:var(--muted);font-size:14px;margin-bottom:10px}
.checks{display:grid;gap:6px}
.ck{border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;font-size:14.5px}
.ck.todo{background:transparent;border-left:4px solid var(--gold);border-radius:0 8px 8px 0}
.ck.stop{background:var(--stop-bg);border-left:4px solid var(--stop);border-radius:0 8px 8px 0}
.ck.ok{background:transparent;color:var(--muted);padding:3px 10px}
.ck .why summary{cursor:pointer;color:var(--blue);font-weight:600;font-size:13px}
.ck .why>div{margin-top:4px}
.intro .links{display:flex;gap:4px;margin-left:-8px}
hr.split{border:0;border-top:2px dashed #cfd5d9;margin:34px 0}
.res-sec .num{background:#eef0ee;color:var(--muted);font-style:italic}
.ready{align-items:center}
.sec{margin-bottom:8px}
.ck .dot{width:18px;height:18px;border-radius:99px;margin-top:2px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}
.ck.todo .dot{background:var(--gold);color:#4d3600}
.ck.stop .dot{background:var(--stop)}
.ck.ok .dot{background:var(--good)}
.ck .t b{font-weight:700}
.ck .why{font-size:13.5px;margin-top:4px;color:#3b4650}
.ck .why .lvl{font-size:11px;font-weight:800;padding:1px 6px;border-radius:99px;margin-right:6px;text-transform:uppercase;letter-spacing:.03em}
.lvl.law{background:#d9e8f5;color:var(--blue)}
.lvl.grps{background:#ffe1c7;color:#8a3b07}
.lvl.practice{background:#e7e7e2;color:#4b4f53}
.ck .acts2{display:flex;gap:2px}
.more-ok{font-size:13.5px;color:var(--muted);background:none;border:0;cursor:pointer;padding:4px 10px;text-align:left}

/* packet */
.packet{display:grid;gap:10px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px;font-weight:600;font-size:14.5px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--orange-bright)}
.tabtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabtools .note{font-size:13.5px;color:var(--muted);flex:1;min-width:200px}
.sheet{background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(21,41,59,.08);border-radius:4px;padding:40px 48px;font-family:var(--font-doc);font-size:15.5px;line-height:1.5;max-width:860px;width:100%;overflow-x:auto}
.sheet h3{font-family:var(--font-display);font-size:22px;color:var(--blue);margin-bottom:2px}
.sheet h4{font-family:var(--font-display);font-size:16px;margin:16px 0 6px}
.sheet .meta{font-family:var(--font-body);font-size:14px;color:var(--muted);margin-bottom:14px}
.sheet table{border-collapse:collapse;width:100%;font-family:var(--font-body);font-size:14px}
.sheet th,.sheet td{border:1px solid #b9c0c6;padding:7px 8px;vertical-align:top;text-align:left}
.sheet th{background:#f1f4f6;font-weight:700}
.sheet td.tm{white-space:nowrap;font-variant-numeric:tabular-nums;width:110px}
.sheet td.blank{height:34px}
.sheet ul{margin:6px 0 0;padding-left:20px}
.sheet .logo{height:42px;float:right;margin:-6px 0 0 14px}
.sheet .flyer{text-align:center;display:grid;gap:10px;font-family:var(--font-body)}
.sheet .flyer .big{font-family:var(--font-display);font-size:34px;color:var(--blue);line-height:1.1}
.sheet .flyer .when{font-size:19px;font-weight:700}
.sheet .flyer ul{text-align:left;display:inline-block;margin:0 auto}
.fill{background:#fff4d9;border-bottom:1.5px dashed #c79400;padding:0 3px}
.sheet .small{font-family:var(--font-body);font-size:13px;color:var(--muted)}
.tp{display:grid;gap:14px;font-family:var(--font-body)}
.tp .item{display:grid;gap:6px}
.tp .item label{font-weight:700;font-size:14.5px}
.tp .item .who{font-size:12.5px;color:var(--muted);font-weight:600}
.tp textarea{font-family:var(--font-doc);font-size:15.5px}
.tp .ai{display:flex;gap:6px;align-items:center}
.ev{display:grid;gap:6px;font-family:var(--font-body)}
.ev label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.ev label.done{background:var(--good-bg);border-color:#b9dfc9}
.ev input{width:19px;height:19px;margin-top:2px;accent-color:var(--good)}
.ev small{display:block;color:var(--muted);font-size:12.5px}
.aibox{border:1.5px solid #c7d3dd;border-radius:10px;padding:12px 14px;background:#f8fbfd;display:grid;gap:8px;font-family:var(--font-body)}
.aibox pre{white-space:pre-wrap;font-family:var(--font-doc);font-size:15px;margin:0}
.res{display:grid;gap:8px;font-family:var(--font-body)}
.res a{font-weight:600}
.res div{border-top:1px solid var(--line);padding-top:8px;font-size:14px}
.res div p{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14.5px;z-index:50;box-shadow:0 8px 20px rgba(0,0,0,.2)}

@media (max-width:900px){
  .switch{display:flex}
  .work{grid-template-columns:1fr}
  .build{border-right:0}
  .work[data-pane="build"] .view{display:none}
  .work[data-pane="packet"] .build{display:none}
  .sheet{padding:24px 18px}
  .bar .saved{display:none}
}
@media (max-width:520px){
  .row2,.row3{grid-template-columns:1fr}
  .ready{grid-template-columns:1fr}
  .bar-in{padding:8px 14px}
  .bar .ttl small{display:none}
}
@media print{
  .bar,.switch,.build,.ready,.tabs,.tabtools{display:none!important}
  .work{display:block}.view{padding:0}.sheet{box-shadow:none;max-width:none}
}

/* compact builder additions */
.promises{display:grid;gap:6px}
.promise{display:flex;gap:8px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;cursor:pointer;font-size:14.5px;line-height:1.4;text-align:left}
.promise[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.promise .box{flex:0 0 18px;height:18px;border-radius:5px;border:2px solid #9aa5ae;margin-top:1px;display:grid;place-items:center;font-size:12px;color:#fff}
.promise[aria-pressed="true"] .box{background:var(--blue);border-color:var(--blue)}
.addrow{display:flex;gap:6px}
.addrow input{flex:1}
.custom{display:flex;gap:6px;align-items:center;font-size:14.5px;padding:6px 10px;border:1.5px dashed #c7d3dd;border-radius:10px;background:#fff}
.custom span{flex:1}
.custom button{border:0;background:none;color:var(--stop);font-weight:700;cursor:pointer}
.planrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px;background:#fff}
.planrow .cite{font-size:12px;font-weight:800;color:var(--blue);letter-spacing:.02em}
.planrow .req{font-size:14px;color:#3b4650}
.planrow.done{border-color:#b9dfc9}
.loglist{display:grid;gap:8px}
.logitem{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px;background:#fff}
.logitem .row2 input,.logitem .row2 select{font-size:14.5px}
.compact-doc .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.compact-doc .box2{border:1px solid #c9d1d7;border-radius:6px;padding:10px 12px}
.compact-doc .box2 h4{margin:0 0 6px;color:var(--blue)}
.compact-doc ul{margin:4px 0 0}
.sig{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:22px;font-family:var(--font-body);font-size:13px}
.sig div{border-top:1px solid #5a6570;padding-top:4px}
.modes{display:flex;gap:6px;margin:4px 0 12px}
.modes button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px;font-weight:700;font-size:14px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
@media (max-width:640px){.compact-doc .cols{grid-template-columns:1fr}.sig{grid-template-columns:1fr}}
.exbox{background:#E7F0F8;border-left:4px solid #005696;border-radius:10px;padding:12px 14px;margin:12px 0}.exbox p{margin:4px 0 10px;font-size:14px;line-height:1.5}
</style>
</head>

const blank=()=>({mode:'compact',school:'',schoolCode:'',schoolOther:false,year:'2026–27',grades:'Elementary',
 goals:'',curriculum:'',conf:CONF_DEFAULT,confWhen:'',reports:[],access:[],volunteer:[],
 caregiver:[],caregiverX:[],scholar:[],scholarX:[],
 channels:[],langs:'',translated:false,
 devEvents:[],devWhen:'',devHow:'',distribute:'',confDiscuss:true,
 log:[],plan:{},planX:{},evidence:{},open:'c1',tab:'compact',showAll:false});
let S=blank();
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(blank(),JSON.parse(r));}catch(e){}
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){$('saved').textContent='Not saved: this browser blocks storage';}},250);}
window.addEventListener('pagehide',()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const lc=x=>{x=String(x);return /^[A-Z][a-z]/.test(x)&&!/^(Title|School Improvement|Parent University|PALs|Kent|Coffee)/.test(x)?x[0].toLowerCase()+x.slice(1):x;};
const ph=(v,l)=>v?esc(v):`<span class="fill">${esc(l)}</span>`;
const schoolRec=()=>SCHOOLS.find(x=>x.c===S.schoolCode);
const isElem=()=>S.grades!=='Middle or high school';
const cg=()=>[...S.caregiver,...S.caregiverX];
const sc=()=>[...S.scholar,...S.scholarX];
function planText(id){const sel=S.plan[id]||[];const x=(S.planX[id]||'').trim();return [...sel,...(x?[x]:[])];}

/* ================= READINESS ================= */
function checks(){
 const L=[];const add=(id,ok,level,title,fix,why,sec,mode)=>L.push({id,state:ok===true?'ok':ok==='stop'?'stop':'todo',level,title,fix,why,sec,mode});
 add('goals',!!S.goals.trim(),'law','The compact states school goals for scholars','Add one to three goals from your school improvement plan, in plain words.','The compact explains district and school goals for scholars to meet the state standards (MDE compact checklist, §1116(d)).','c1','compact');
 add('curr',S.curriculum.trim().length>20,'law','The school promises high-quality curriculum and instruction','Describe, in a sentence or two, how the school provides strong teaching and a supportive place to learn.','Required in every compact (§1116(d)(1)). The GRPS signature template leaves this out, so add it here.','c2','compact');
 add('conf',!!(S.conf.trim()&&S.confWhen.trim()),'law','Conferences are scheduled',isElem()?'Add when conferences happen. Elementary schools must discuss the compact at conferences at least once a year.':'Add when conferences happen.','Elementary schools hold parent-teacher conferences at least annually, where the compact is discussed for each child (§1116(d)(2)(A)).','c2','compact');
 add('reports',S.reports.length>0,'law','Caregivers get frequent progress reports','Choose how and when caregivers hear about progress.','Required in the compact (§1116(d)(2)(B)).','c2','compact');
 add('access',S.access.length>0,'law','Caregivers can reach staff','Choose how caregivers can reach teachers and staff.','Caregivers get reasonable access to staff (§1116(d)(2)(C)).','c2','compact');
 add('vol',S.volunteer.length>0,'law','Caregivers can volunteer, take part and observe','Choose at least one way caregivers can volunteer, take part or observe.','Required in the compact (§1116(d)(2)(C)).','c2','compact');
 add('cg',cg().length>=2,'law','Caregiver promises are listed','Choose at least two things caregivers will do.','The compact describes specific ways caregivers support learning (§1116(d)(1)).','c3','compact');
 add('sc',sc().length>=1,'law','Scholar promises are listed','Choose what scholars will do, in words that fit their grade.','MDE’s compact checklist expects specific scholar responsibilities.','c3','compact');
 add('comm',S.channels.length>=2&&(S.langs.trim()?S.translated:true),'law','Two-way communication, in caregivers’ languages',S.channels.length<2?'Choose at least two ways school and caregivers talk with each other.':'Confirm the compact is translated into the languages you listed.','The compact ensures regular, two-way, meaningful communication in a language caregivers understand (§1116(d)(2)(D), (f)).','c4','compact');
 add('dev',S.devEvents.length>0&&!!S.devWhen.trim(),'law','Caregivers helped write it','Choose how caregivers helped develop or revise the compact, and when.','The compact must be developed jointly with caregivers. A signature alone does not show joint development (§1116(d)).','c5','compact');
 const responded=S.log.filter(x=>x.text&&x.decision&&x.told).length;
 add('loop',responded>0,'practice','Caregivers hear what changed',S.log.length?'For at least one suggestion, record the decision and how caregivers were told.':'Log caregivers’ suggestions and what the school did with them.','This log is your evidence of joint development and two-way communication in an MDE review.','c5','compact');
 const req=PLAN.length;const done=PLAN.filter(p=>planText(p.id).length).length;
 add('plan',done===req,'law','Every family engagement plan requirement is answered',`${req-done} of ${req} plan requirements still need an answer.`,'The school plan describes how it carries out each part of §1116 (MDE ESSA-aligned plan template).','p','plan');
 return L;
}

const SECS=[
 {id:'c1',t:'Your school and goals',sub:'School, year and goals for scholars'},
 {id:'c2',t:'What the school promises',sub:'Teaching, conferences, reports, access'},
 {id:'c3',t:'What caregivers and scholars promise',sub:'Pick from the GRPS list or add your own'},
 {id:'c4',t:'Talking with each other',sub:'Two-way communication and languages'},
 {id:'c5',t:'Writing it with caregivers',sub:'How caregivers shaped it, and what changed'}
];
function secIds(id){return {c1:['goals'],c2:['curr','conf','reports','access','vol'],c3:['cg','sc'],c4:['comm'],c5:['dev','loop']}[id]||[];}
const inp=(k,type='text',attrs='')=>`<input type="${type}" id="i_${k}" data-k="${k}" value="${esc(S[k])}" ${attrs}>`;
const area=(k,attrs='')=>`<textarea id="i_${k}" data-k="${k}" ${attrs}>${esc(S[k])}</textarea>`;
const picks=(k,opts)=>`<div class="promises">${opts.map(o=>`<button class="promise" data-pick="${k}" data-v="${esc(o)}" aria-pressed="${S[k].includes(o)}"><span class="box">${S[k].includes(o)?'✓':''}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
const customs=(k,label)=>`${S[k].map((t,i)=>`<div class="custom"><span>${esc(t)}</span><button data-delx="${k}" data-i="${i}" aria-label="Remove">×</button></div>`).join('')}<div class="addrow"><input type="text" id="add_${k}" placeholder="${label}" aria-label="${label}"><button class="btn line sm" data-addx="${k}">Add</button></div>`;
function schoolField(){const f=schoolRec();return `<div class="field"><label for="i_schoolPick">School</label><select id="i_schoolPick" data-school="1"><option value="">Choose your school…</option>${SCHOOLS.map(x=>`<option value="${x.c}" ${S.schoolCode===x.c?'selected':''}>${esc(x.n)}</option>`).join('')}<option value="other" ${S.schoolOther?'selected':''}>Another school or program (type it)</option></select>${S.schoolOther?inp('school','text','placeholder="School or program name" aria-label="School or program name"'):''}
 ${f?(f.p==='NT'?`<p class="inline-note">Listed as not Title I eligible on the 2026–27 Title I Sites List. A Title I compact and plan may not be required.</p>`:f.p?`<span class="hint">${f.p==='SW'?'Schoolwide':'Targeted assistance'} program (2026–27 Title I Sites List).${f.p==='TA'?' The compact covers caregivers of scholars receiving Title I services.':''}</span>`:`<span class="hint">Not on the 2026–27 Title I Sites List. Confirm with the Title I office.</span>`):''}</div>`;}
function secBody(id){
 if(id==='c1')return schoolField()+`
  <div class="row2"><div class="field"><label for="i_year">School year</label>${inp('year')}</div>
  <div class="field"><label for="i_grades">Grades</label><select id="i_grades" data-k="grades">${['Elementary','Middle or high school','K–8 or other'].map(o=>`<option ${S.grades===o?'selected':''}>${o}</option>`).join('')}</select></div></div>
  <div class="field"><label for="i_goals">Our goals for scholars this year</label><span class="hint">One to three goals from your school improvement plan, in words caregivers use.</span>${area('goals','placeholder="Example: More scholars reading on grade level by spring. Every scholar attends at least 90% of school days."')}</div>`;
 if(id==='c2')return `
  <div class="field"><label for="i_curriculum">How we provide strong teaching and a good place to learn</label>${area('curriculum','placeholder="Example: Teachers use GRPS curriculum aligned to Michigan standards, small-group reading support every day, and a safe, welcoming classroom."')}</div>
  <div class="field"><span class="lbl">Parent-teacher conferences</span><div class="row2">${inp('conf','text','aria-label="Conference description"')}${inp('confWhen','text','placeholder="When (e.g., October and March)" aria-label="When conferences happen"')}</div>${isElem()?`<label class="toggle"><input type="checkbox" data-k="confDiscuss" ${S.confDiscuss?'checked':''}> Teachers discuss the compact with each family at fall conferences</label>`:''}</div>
  <div class="field"><span class="lbl">How caregivers hear about progress</span>${picks('reports',REPORTS)}</div>
  <div class="field"><span class="lbl">How caregivers can reach staff</span>${picks('access',ACCESS)}</div>
  <div class="field"><span class="lbl">How caregivers can volunteer, take part and observe</span>${picks('volunteer',VOLUNTEER)}</div>`;
 if(id==='c3')return `
  <div class="field"><span class="lbl">Caregivers will</span><span class="hint">Starts from the GRPS compact template. Keep promises realistic; caregivers should help choose them.</span>${picks('caregiver',CAREGIVER)}${customs('caregiverX','Add a caregiver promise')}</div>
  <div class="field"><span class="lbl">Scholars will</span>${picks('scholar',SCHOLAR)}${customs('scholarX','Add a scholar promise')}</div>`;
 if(id==='c4')return `
  <div class="field"><span class="lbl">Ways school and caregivers talk with each other</span><div class="chips">${CHANNELS.map(c=>`<button class="chip" data-chip="channels" data-v="${esc(c)}" aria-pressed="${S.channels.includes(c)}">${esc(c)}</button>`).join('')}</div></div>
  <div class="field"><label for="i_langs">Languages caregivers need besides English</label>${inp('langs','text','placeholder="For example: Spanish, Swahili"')}</div>
  ${S.langs.trim()?`<label class="toggle"><input type="checkbox" data-k="translated" ${S.translated?'checked':''}> The compact is translated into these languages</label>`:''}`;
 if(id==='c5'){return `
  <div class="field"><span class="lbl">How caregivers helped write or revise it</span><div class="chips">${DEV_EVENTS.map(c=>`<button class="chip" data-chip="devEvents" data-v="${esc(c)}" aria-pressed="${S.devEvents.includes(c)}">${esc(c)}</button>`).join('')}</div></div>
  <div class="field"><label for="i_devWhen">When</label>${inp('devWhen','text','placeholder="For example: September 24 annual meeting; October SIT meeting"')}</div>
  <div class="field"><label for="i_distribute">How the compact reaches every family</label>${inp('distribute','text','placeholder="For example: sent home in the fall, discussed at conferences, posted online"')}</div>
  <div class="field"><span class="lbl">Caregiver suggestions and what you did</span><span class="hint">Record ideas from the annual meeting, surveys or conferences. This is your proof that caregivers shaped the compact.</span>
   <div class="loglist">${S.log.map((x,i)=>`<div class="logitem"><input type="text" data-log="${i}" data-f="text" value="${esc(x.text)}" placeholder="What caregivers suggested" aria-label="Suggestion ${i+1}">
    <div class="row2"><select data-log="${i}" data-f="decision" aria-label="Decision for suggestion ${i+1}"><option value="">Decision…</option>${['Added to the compact','Changed the wording','Will review further','Not adopted, with a reason'].map(o=>`<option ${x.decision===o?'selected':''}>${o}</option>`).join('')}</select><input type="text" data-log="${i}" data-f="told" value="${esc(x.told)}" placeholder="How caregivers were told" aria-label="How caregivers were told about suggestion ${i+1}"></div>
    <div style="text-align:right"><button class="btn text sm" data-dellog="${i}">Remove</button></div></div>`).join('')}</div>

function planBody(){const done=PLAN.filter(p=>planText(p.id).length).length;
 return `<p class="hint" style="margin-bottom:8px">Based on the MDE ESSA-aligned Parent and Family Engagement Plan template used by GRPS. ${done} of ${PLAN.length} answered. Choose what your school does, then add your own details.</p>`+

function renderBuild(C){
 const modes=`<div class="modes" role="group" aria-label="Document"><button data-mode="compact" aria-pressed="${S.mode==='compact'}">School-Parent Compact</button><button data-mode="plan" aria-pressed="${S.mode==='plan'}">Family Engagement Plan</button></div>`;
 const intro=`<div class="intro"><h1>${S.mode==='compact'?'Build your school-parent compact':'Build your family engagement plan'}</h1><p>${S.mode==='compact'?'The compact is a shared set of promises. Write it with caregivers, then use it at fall conferences.':'The plan describes how your school carries out each family engagement requirement.'}</p><p class="links"><button class="btn text sm" data-act="example">See an example</button><button class="btn text sm" data-act="new">Start over</button></p></div>`;
 let body;
 if(S.mode==='compact')body=SECS.map((s,i)=>{const ok=secIds(s.id).every(k=>C.find(c=>c.id===k).state==='ok');return `<div class="sec ${S.open===s.id?'open':''}" id="sec_${s.id}"><button class="head" data-sec="${s.id}" aria-expanded="${S.open===s.id}"><span class="num ${ok?'ok':''}">${ok?'✓':i+1}</span><span><b>${s.t}</b><small>${s.sub}</small></span><span class="chev">›</span></button><div class="body">${S.open===s.id?secBody(s.id):''}</div></div>`;}).join('');
 else body=(S.schoolCode||S.school?'':`<p class="inline-note" style="margin-bottom:8px">Choose your school under School-Parent Compact first.</p>`)+planBody();
 $('build').innerHTML=intro+modes+body;
}

/* ================= DOCUMENTS ================= */
function ring(n,tot){const r=38,c=2*Math.PI*r,p=n/tot;return `<div class="ring"><svg width="92" height="92" viewBox="0 0 92 92" aria-hidden="true"><circle cx="46" cy="46" r="${r}" fill="none" stroke="#e3e6e3" stroke-width="9"/><circle cx="46" cy="46" r="${r}" fill="none" stroke="${n===tot?'#1d7a4c':'#005696'}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 46 46)"/></svg><div class="lbl"><span>${n}/${tot}<small>ready</small></span></div></div>`;}
function renderReady(C){
 const ok=C.filter(c=>c.state==='ok');const open=[...C.filter(c=>c.state==='stop'),...C.filter(c=>c.state==='todo')];
 const lvl={law:'Federal law',grps:'GRPS',practice:'Good practice'};
 const ck=c=>`<div class="ck ${c.state}" id="ck_${c.id}"><span class="dot">${c.state==='ok'?'✓':c.state==='stop'?'!':''}</span><div class="t"><b>${esc(c.title)}</b>${c.state!=='ok'?`<div>${esc(c.fix)}</div><details class="why"><summary>Why this matters</summary><div><span class="lvl ${c.level}">${lvl[c.level]}</span>${esc(c.why)}</div></details>`:''}</div>${c.state!=='ok'?`<button class="btn text sm" data-fix="${c.sec}" data-fixmode="${c.mode}">Fix</button>`:''}</div>`;
 const list=S.showAll?[...open,...ok]:open.slice(0,1);
 return `<div class="ready">${ring(ok.length,C.length)}<div><h2>${open.length?(S.showAll?'Readiness check':'Next up'):'Ready to share with caregivers'}</h2>${open.length?'':`<p class="sub">Every check passes. Download the compact and plan when you are ready.</p>`}<div class="checks">${list.map(ck).join('')}</div>${(open.length>1||S.showAll)?`<button class="more-ok" data-act="toggleAll">${S.showAll?'Show less':'See all '+open.length+' to finish'}</button>`:''}</div></div>`;
}
const li=a=>a.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p><span class="fill">Choose at least one</span></p>';
function docCompact(){const name=S.school||'';return `<div class="compact-doc"><img class="logo" src="${LOGO}" alt="GRPS"><h3>School-Parent Compact</h3><div class="meta">${ph(name,'School name')} · ${esc(S.year)}</div>
 <p>${ph(name,'School name')} and the caregivers of scholars ${schoolRec()&&schoolRec().p==='TA'?'receiving Title I services':'at our school'} agree that this compact describes how caregivers, the whole school staff and scholars share responsibility for learning, and how we will work together so scholars meet Michigan’s high standards.</p>
 <h4>Our goals for scholars</h4>${S.goals.trim()?`<p>${esc(S.goals)}</p>`:'<p><span class="fill">Add your goals</span></p>'}
 <h4>The school will</h4><ul><li>${S.curriculum.trim()?esc(S.curriculum):'<span class="fill">Describe strong teaching and a supportive place to learn</span>'}</li>
 <li>Hold ${esc(lc(S.conf||'parent-teacher conferences'))}${S.confWhen?' ('+esc(S.confWhen)+')':''}${isElem()&&S.confDiscuss?', where we will discuss this compact and your scholar’s progress':''}.</li>
 <li>Keep you informed about progress through: ${S.reports.length?esc(S.reports.map(lc).join('; ')):'<span class="fill">progress reports</span>'}.</li>
 <li>Make staff easy to reach: ${S.access.length?esc(S.access.map(lc).join('; ')):'<span class="fill">access to staff</span>'}.</li>
 <li>Welcome you to take part: ${S.volunteer.length?esc(S.volunteer.map(lc).join('; ')):'<span class="fill">volunteer and observe</span>'}.</li>

  z.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');

async function aiRun(btn,kind){

 btn.disabled=true;box.innerHTML=`<div class="aibox" style="margin-top:12px"><b>${kind==='translate'?'Translating…':'Rewriting…'}</b><pre id="aiOut">Thinking…</pre></div>`;
 try{const {text}=await AI(prompt,{onText:({text})=>{const o=$('aiOut');if(o)o.textContent=text;}});
  box.innerHTML=`<div class="aibox" style="margin-top:12px"><b>${kind==='translate'?'Draft translation':'Family-friendly draft'}</b><pre id="aiOut">${esc(text)}</pre><p class="small">${kind==='translate'?'Machine translation. Have a qualified GRPS interpreter or translator review it before it goes home.':'Review it with caregivers before you use it.'}</p><div><button class="btn line sm" id="aiCopy">Copy</button></div></div>`;
  $('aiCopy').onclick=()=>{try{navigator.clipboard.writeText(text).then(()=>toast('Copied.'));}catch(e){}};}
 catch(err){box.innerHTML=`<div class="aibox" style="margin-top:12px">${err&&err.code==='not_granted'?'Not allowed in this view.':'Could not finish right now. Try again in a moment.'}</div>`;if(err&&['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(err.code)){AI=null;lightAI();}}
 finally{btn.disabled=false;}
