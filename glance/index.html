<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Title I at a glance · Title I Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#15293b;--blue:#005696;--soft:#e7f0f8;--orange:#e8730f;--odk:#c85a0b;--good:#1d7a4c;--muted:#5a6570;--line:#dde3e8;--bg:#fbf8f4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,sans-serif}
h1,h2,.h{font-family:'Bricolage Grotesque',Figtree,sans-serif;line-height:1.15;margin:0}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header img{height:38px}.home{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px}
.wrap{max-width:1240px;margin:0 auto;padding:26px 22px 60px}
.k{font-size:12px;font-weight:800;letter-spacing:.07em;color:var(--muted);text-transform:uppercase}
.card{background:#fff;border-radius:18px;padding:18px 20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:18px 0}
.tile{border-left:6px solid var(--blue)}.tile b{font-family:'Bricolage Grotesque';font-size:32px;display:block}.tile .d{font-size:13px;color:#33414d}.tile .s{font-size:11.5px;color:#8a939b;margin-top:2px}
.tile.off{border-left-color:#c7d3dd;color:#8a939b}.tile.off b{font-size:18px;margin:8px 0 2px}
.two{display:grid;grid-template-columns:1fr 1.2fr;gap:18px;align-items:start}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 6px;font-weight:800;white-space:nowrap}
td{padding:9px 6px;border-top:1px solid #eef0ee;vertical-align:middle}th button{all:unset;cursor:pointer}th button:hover{color:var(--ink)}
.sup{font-size:11px;font-weight:800;color:var(--odk);margin-left:4px}
.bars{display:flex;flex-direction:column;gap:3px;width:150px}.bars span{height:11px;border-radius:3px;background:var(--blue);display:block}.bars .p{background:repeating-linear-gradient(135deg,#005696 0 5px,#7fa9cc 5px 8px)}
.chg{font-size:12.5px;font-weight:700}.up{color:#a5321f}.dn{color:var(--good)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.f{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink)}.f[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.note{font-size:12.5px;color:var(--muted)}
.soon{display:inline-block;font-size:11px;font-weight:800;background:#eef0ee;color:#5a6570;padding:3px 8px;border-radius:999px}
.know{border:2px solid var(--orange)}.know ol{margin:8px 0 0;padding-left:20px}.know li{margin:4px 0}
.btn{display:inline-flex;gap:6px;align-items:center;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;color:#fff;background:var(--odk);cursor:pointer}
@media(max-width:900px){.two{grid-template-columns:1fr}.hide-s{display:none}}
@media print{header,.noprint{display:none!important}body{background:#fff}.card{border:1px solid #ddd}}
</style></head><body>
