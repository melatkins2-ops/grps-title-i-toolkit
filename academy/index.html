 remove before the next event."}, "res": [["ESSA Section 1116", "https://oese.ed.gov/offices/office-of-formula-grants/school-support-and-accountability/essa-legislation-table-contents/title-i-part-a/"]], "confirm": ["Name of the GRPS district parent and family engagement policy and link", "How schools receive their family engagement allocation"], "video": [["👪", "Family engagement is the law", "Section 1116 is written into every Title I program."], ["🕕", "Flexible meetings", "Different times, child care, transportation and home visits."], ["🗳️", "Real decisions", "Families help plan, review and improve the program."], ["🌐", "In a language families understand", "Translation, interpreters and formats families can use."], ["💵", "Funding", "At least 1% of the district’s Title I goes to family engagement, 90% of it to schools."], ["✅", "Your turn", "Match practices to the law and respond to a family."]], "sub": "What Section 1116 asks of every Title I school", "roles": ["Principal", "Support staff", "Office staff"]}, {"id": 8, "s": "fam", "t": "The compact and the parent policy", "mins": 30, "goal": "Build a compact and a parent policy with families, and use them all year, not just file them.", "can": ["I can name what a school-parent compact must include.", "I can write promises that are specific and tied to our goal.", "I can describe how the parent policy is built and shared."], "why": {"story": "At conferences, a <b>GRPS Sample School<\/b> teacher hands a family the compact. The father reads it and asks, “What does ‘support my child’s learning’ mean for me on Tuesday night?”", "p": ["A compact only matters if the promises are specific enough to act on and tied to what the school is working on. A parent policy only matters if families help write it."]}, "rule": {"p": ["Each Title I school develops, jointly with families, a written parent policy and a school-parent compact (Section 1116(b) and (d))."], "points": [["School’s promise", "Provide high-quality curriculum and instruction in a supportive learning environment."], ["Family’s promise", "Support learning: for example, monitoring attendance and homework, volunteering, and taking part in decisions."], ["Communication", "Conferences at least once a year in elementary schools, where the compact is discussed; frequent progress reports; reasonable access to staff; chances to volunteer and observe; two-way communication in a language families understand."], ["Parent policy", "Describes how the school carries out the family engagement requirements; developed jointly, shared with all families, updated regularly."]], "cites": [["ESSA Section 1116(b) and (d)", "https://oese.ed.gov/offices/office-of-formula-grants/school-support-and-accountability/essa-legislation-table-contents/title-i-part-a/"]]}, "grps": {"intro": "At GRPS:", "steps": [["Build with families", "Use the tool’s suggestions, then change them with caregivers."], ["Tie to the plan", "The tool suggests promises based on your needs assessment priority."], ["Use at fall conferences", "GRPS shares the compact at parent-teacher conferences each fall; teachers go over it with each family."], ["Revise in spring", "Caregivers review and revise both documents every year."]], "note": ""}, "watch": [["Vague promises.", "“Read with my child 20 minutes, 4 nights a week” beats “support learning.”"], ["A compact with no link to the plan.", "If the priority is attendance, the compact should say something about attendance."], ["Written by staff, signed by families.", "Families help write it."]], "practice": [{"type": "sort", "q": "Strong promise or needs work?", "buckets": ["Strong", "Needs work"], "items": [["We will text families within two days of a second absence and help solve what’s in the way.", 0, "Specific, doable, tied to attendance."], ["Parents will support their child’s education.", 1, "Too vague to act on."], ["I will read with my child for 20 minutes at least four nights a week.", 0, "Specific and measurable."], ["Scholars will try their best.", 1, "Vague. What does it look like?"], ["Teachers will send a progress note home every three weeks in the family’s language.", 0, "Specific, frequent, accessible."], ["The school will be welcoming.", 1, "How? Make it concrete."]]}, {"type": "order", "q": "Put the compact process in order.", "items": ["Invite caregivers to help", "Look at the school’s plan priority", "Draft promises together", "Translate it into families’ languages", "Share it at fall conferences", "Use it in conversations all year", "Revise it with caregivers in spring"]}, {"type": "build", "q": "Write three promises for GRPS Sample School, whose priority is attendance.", "key": "compact8", "fields": [["The school will…", "text families within two days of a second absence…"], ["Families will…", "let the school know when something keeps my child home…"], ["Scholars will…", "come to school on time every day and ask for help when I’ve missed work…"]], "rubric": ["Each promise is specific enough to act on", "Promises connect to the attendance priority", "Families would agree they’re realistic", "Written in plain language"]}, {"type": "scenario", "q": "The parent policy was last updated three years ago. What should happen?", "opts": [["Update the date and reprint.", 0, "Families need to help review and update it."], ["Review it with caregivers, update what the school actually does, and share it with every family.", 1, "Right. Jointly developed, updated and distributed."], ["It’s fine as is.", 0, "It should be updated regularly to meet changing needs."]]}, {"type": "respond", "q": "Your school’s priority is reading. Rewrite this family promise so a family could act on it tomorrow: “Parents will support their child’s learning.”", "respond": {"model": "“I will read with my child, or listen to my child read, for 20 minutes at least four nights a week, and ask one question about the story.”", "look": ["Specific action", "How often or how long", "Tied to the reading priority", "Something a family would agree is realistic"]}}], "doit": {"text": "Open the <b>Title I Parent Compact and Title I Parent Policy<\/b> tool. Choose your school, look at the suggested promises, and edit one with a caregiver.", "tool": ["Title I Parent Compact and Title I Parent Policy", "../compact/"], "tasks": ["Choose your school", "Review suggested promises", "Edit one with a caregiver"]}, "quiz": [["When must elementary schools discuss the compact with families?", ["At parent-teacher conferences, at least once a year", "Only at enrollment", "Never"], 0, "Section 1116(d)(2)(A)."], ["Who develops the compact?", ["Staff, then families sign", "The school and families, jointly", "The district"], 1, "Jointly developed."], ["Which is the strongest family promise?", ["Support learning", "Read together 20 minutes four nights a week", "Be involved"], 1, "Specific and measurable."], ["The parent policy describes:", ["How the school carries out family engagement requirements", "The discipline code", "The budget"], 0, "Section 1116(b)."], ["How should promises relate to the plan?", ["They should connect to the school’s priority", "They’re unrelated", "Only the school’s promises connect"], 0, "The compact should reflect what the school is working on."]], "reflect": {"prompt": "Which promise in your school’s compact would a family find hardest to act on?", "plan": "How will you rewrite it with families?"}, "facil": {"mins": 30, "open": "Read your current compact aloud. Ask: “Could a family act on this tomorrow?”", "discuss": ["Which promises are vague?", "Does it connect to our priority?", "How do teachers use it at conferences?"], "act": "Do the sort, then rewrite two promises.", "close": "Plan when caregivers will review the draft."}, "res": [["ESSA Section 1116", "https://oese.ed.gov/offices/office-of-formula-grants/school-support-and-accountability/essa-legislation-table-contents/title-i-part-a/"]], "confirm": ["Due dates for the compact and parent policy"], "video": [["📝", "The compact", "A promise among the school, families and scholars."], ["🏫", "The school’s promise", "High-quality teaching, conferences, progress reports and access to staff."], ["🏠", "The family’s promise", "Specific things families agree to do, written with families."], ["🎯", "Tie it to the plan", "If the priority is attendance, the promises talk about attendance."], ["🗓️", "Use it all year", "Go over it at fall conferences; revise it each spring."], ["✅", "Your turn", "Sort strong promises, order the process and rewrite a vague one."]], "sub": "Writing them with families, using them all year", "roles": ["Principal", "Support staff", "Teacher"]}, {"id": 9, "s": "fam", "t": "The annual Title I meeting", "mins": 25, "goal": "Plan, hold and document an annual Title I meeting that families can attend and understand.", "can": ["I can list what the annual meeting must cover.", "I can plan the steps in the right order.", "I can keep the evidence a reviewer will ask for."], "why": {"story": "<b>GRPS Sample School<\/b> combined the Title I meeting with Open House. Ten minutes in a noisy gym, no sign-in sheet, no agenda. When the reviewer asked for evidence, there wasn’t any.", "p": ["The annual meeting is often a family’s first introduction to Title I. It also produces the evidence reviewers ask for first."]}, "rule": {"p": ["Each Title I school convenes an annual meeting, at a convenient time, to which all families of participating scholars are invited and encouraged to attend (Section 1116(c)(1))."], "points": [["Explain the program", "That the school takes part in Title I and what that means."], ["Explain the requirements", "What Title I requires, including the plan, compact and policy."], ["Explain families’ rights", "Families’ right to be involved, and how."], ["Make it reachable", "A convenient time, more than one option, and a language families understand."]], "cites": [["ESSA Section 1116(c)", "https://oese.ed.gov/offices/office-of-formula-grants/school-support-and-accountability/essa-legislation-table-contents/title-i-part-a/"]]}, "grps": {"intro": "GRPS practice:", "steps": [["Own time and agenda", "Even during Open House, the Title I meeting has its own time, agenda and sign-in sheet (two separate sign-ins), with scholar names and the parent’s name."], ["Flyer 72 hours ahead", "Post it with the location, date, time and agenda; photograph where it’s posted."], ["Sign-in and evaluations", "Dated and labeled; families sign in person."], ["Every fall", "Hold it early in the year. Cover: what Title I is and looks like here; key terms (schoolwide, targeted, Michigan’s accountability system); curriculum and assessments; funding; the parent policy and family engagement set-aside; the compact; the school report card; improvement status; staff qualifications; and the notices families will get."], ["Evidence folder", "Invitations (flyers, robo-call script, a photo of the marquee), a sign-in labeled “Title I Annual Meeting,” agenda and slides, expense records, minutes with family questions, a photo of families at the meeting, the parent policy, the compact and evaluations. File within a week."]], "note": "Source: GRPS Title I Handbook, pp. 14 and 19."}, "watch": [["A few minutes inside Open House.", "Give it its own time and agenda."], ["One time only.", "Offer another time or way to take part."], ["No proof.", "Keep the flyer, sign-in, evaluations and minutes together."]], "practice": [{"type": "order", "q": "Put the annual meeting steps in order.", "items": ["Choose a date and time with families in mind", "Build the agenda and slides in the Meeting Builder", "Translate and send invitations about two weeks ahead", "Post the flyer at least 72 hours ahead, and photograph it", "Hold the meeting: sign-in, present, take questions", "Collect family evaluations", "Offer another time or share the slides with families who couldn’t come", "File the evidence within a week"]}, {"type": "scenario", "q": "Only eight families came. What’s the best next step?", "opts": [["Nothing. The meeting is done.", 0, "The requirement is to invite and encourage all families; offering another option helps more families take part."], ["Offer a second session at another time, share the slides and a short video, and ask families what would help next time.", 1, "Right. Another option plus feedback."], ["Count it as fine because there was a sign-in sheet.", 0, "Evidence matters, but so does reaching families."]]}, {"type": "sort", "q": "Which belongs in the meeting’s evidence folder?", "buckets": ["Keep", "Not needed"], "items": [["Flyer with the date it was posted", 0, "Proves notice."], ["Sign-in sheet, dated and labeled", 0, "Proves attendance."], ["Family evaluations", 0, "Shows feedback."], ["Slides or agenda", 0, "Shows what was covered."], ["Itemized receipts for family refreshments", 0, "GRPS asks you to keep a record of meeting expenses."], ["Minutes that include families’ questions and suggestions", 0, "GRPS Handbook p. 19."], ["A photo of families at the meeting", 0, "GRPS suggests it as extra evidence the meeting happened."], ["A flyer that calls it a “celebration”", 1, "Per MDE, don’t use the word “celebration” in the event description."]]}, {"type": "respond", "q": "A parent texts: “What is this Title I meeting and why should I come?” Write your text back (keep it short).", "respond": {"model": "“Hi! It’s a 45-minute meeting about the extra help our school gets from Title I and how you can have a say in it. We’ll share our reading goal and ask for your ideas. Thursday 5:30, child care and snacks provided, Spanish interpreter there. Can’t make it? Reply and we’ll find another time.”", "look": ["Short and friendly", "Says what families get out of it", "Includes time and supports (child care, language)", "Offers another option"]}}], "doit": {"text": "Open the <b>Title I Annual Meeting Builder<\/b>. Build the agenda for your school (or GRPS Sample School) and look at the family slide.", "tool": ["Title I Annual Meeting Builder", "../meeting/"], "tasks": ["Choose your school", "Build the agenda", "Check the family slide"]}, "quiz": [["The annual meeting must explain:", ["Title I, its requirements and families’ right to be involved", "Only the budget", "The lunch menu"], 0, "Section 1116(c)(1)."], ["GRPS practice: post the flyer at least how far ahead?", ["24 hours", "72 hours", "Two weeks"], 1, "72 hours, with location, date, time and agenda."], ["During Open House, the Title I meeting needs:", ["Its own time and agenda", "Nothing extra", "Only a handout"], 0, "Separate time and agenda."], ["Families who can’t come should:", ["Be offered another time or way", "Read the website", "Be marked absent"], 0, "Flexible options."], ["When should GRPS schools hold the annual meeting?", ["Every fall, early in the year", "In June", "Only when families ask"], 0, "GRPS Handbook p. 19: annual meetings occur every fall."]], "reflect": {"prompt": "What would make your school’s annual meeting easier for families to attend?", "plan": "What will you change this year?"}, "facil": {"mins": 25, "open": "Show last year’s evidence folder (or what you can find).", "discuss": ["What’s missing?", "Who couldn’t come, and why?", "How did we explain families’ rights?"], "act": "Do the order activity together.", "close": "Assign owners for each step."}, "res": [["GRPS Title I Handbook (2022), pp. 14 and 19", "https://drive.google.com/file/d/114wsrM373kUmgkzSOmvaF8G16a--uXuy/view"], ["ESSA Section 1116(c)", "https://oese.ed.gov/offices/office-of-formula-grants/school-support-and-accountability/essa-legislation-table-contents/title-i-part-a/"]], "confirm": ["Due date for this year’s annual meeting evidence", "Where schools upload evidence"], "video": [["📣", "The annual Title I meeting", "Every fall, often a family’s first look at Title I."], ["🗒️", "What to share", "Title I, the plan, the compact, the parent policy, funding and families’ rights."], ["📌", "Notice", "Post the flyer at least 72 hours ahead with location, date, time and agenda."], ["✍️", "On the night", "Its own time and agenda, a labeled sign-in, and family evaluations."], ["🗂️", "Evidence", "File everything within a week."], ["✅", "Your turn", "Order the steps, answer a family and build the evidence folder."]], "sub": "Planning, holding and documenting it", "roles": ["Principal", "Support staff", "Office staff"]}, {"id": 10, "s": "serve", "t": "Identifying and serving scholars", "mins": 30, "goal": "Decide who gets extra help using clear criteria, track progress, and move scholars in and out on purpose.", "can": ["I can describe multiple, objective, educationally related criteria.", "I can use entry and exit criteria.", "I can name families’ rights about teacher qualifications."], "why": {"story": "A <b>GRPS Sample School<\/b> scholar has been in the same intervention group for three years. Nobody remembers why he joined, and his MAP scores have been above benchmark since last fall.", "p": ["Extra help works best when the right scholars get it, progress is checked, and scholars leave when they no longer need it."]}, "rule": {"p": ["Targeted assistance schools identify scholars using multiple, educationally related, objective criteria (Section 1115(c)). Schoolwide programs address the needs of scholars at risk of not meeting standards (Section 1114(b)(7))."], "points": [["Criteria", "Use more than one measure, all tied to learning, and not based on opinion alone."], ["Automatic eligibility", "Scholars experiencing homelessness, and certain others, are eligible in targeted assistance."], ["Progress and exit", "Review progress and revise; exit scholars who meet criteria."], ["Paraprofessionals", "Title I paraprofessionals who help with instruction meet qualification requirements and work under a teacher’s direct supervision."], ["Right to know (1112(e))", "Families can ask about teacher qualifications, and must be told if their child is taught for four or more weeks in a row by a teacher who doesn’t meet state certification."]], "cites": [["ESSA Sections 1112(e), 1114 and 1115", "https://oese.ed.gov/offices/office-of-formula-grants/school-support-and-accountability/essa-legislation-table-contents/title-i-part-a/"]]}, "grps": {"intro": "At GRPS:", "steps": [["Entry: NWEA MAP", "National percentile 1–24 gets highest priority; 25–40 may be served after every lower-scoring scholar is served."], ["Entry: other measures", "M-STEP ELA and math (grades 3–7): Not Proficient first, lowest scaled score first, then Partially Proficient. Grades 8–11: below the College Board benchmark (SAT grade 11: Reading and Writing 480, Math 530; PSAT 10: 430 and 480; PSAT 8/9: grade 8 390 and 430, grade 9 410 and 450). With no test scores, use classroom assessments, with documentation."], ["After each MAP window", "Run the Title I Eligibility report on OurSchoolData.org. It ranks scholars lowest to highest. If a lower-scoring scholar isn’t served, write down why. Keep the reports for audits."], ["Exit", "NWEA MAP at or above the 50th percentile for two or more testing windows in a row; M-STEP Proficient or Advanced in the subject where the scholar was served; or SAT/PSAT at or above the benchmark."], ["Staff roles", "Title I teachers hold the caseload and prescribe lessons. Paraprofessionals work under a teacher’s direct supervision, in close and frequent proximity; they have no caseload of their own, aren’t general classroom aides, and don’t give tests."]], "note": "Sources: the 2026–27 GRPS identification procedure, which updates the test criteria in the Title I Handbook (pp. 16–18)."}, "watch": [["Identifying by teacher opinion only.", "Use multiple measures."], ["Scholars stay in groups by habit.", "Check exit criteria every window."], ["Paraprofessionals teaching alone.", "They work under a teacher’s direct supervision."]], "practice": [{"type": "sort", "q": "Can this be one of the criteria?", "buckets": ["Yes", "No"], "items": [["NWEA MAP national percentile from the Title I Eligibility report", 0, "GRPS’s main entry measure."], ["A reading screener", 0, "Educationally related."], ["Free lunch status", 1, "Income isn’t an educational criterion for targeted assistance."], ["A teacher’s gut feeling alone", 1, "Not objective on its own."], ["Classroom assessment results", 0, "Educationally related."], ["Scholar experiencing homelessness", 0, "Automatically eligible in targeted assistance."]]}, {"type": "order", "q": "Put the identification cycle in order.", "items": ["The MAP window closes", "Run the Title I Eligibility report", "Rank scholars from lowest to highest", "Fill seats starting with the 1st–24th percentile", "Write down why if a lower-scoring scholar isn’t served", "Monitor progress in intervention", "Check exit criteria after the next window"]}, {"type": "scenario", "q": "One intervention seat opens. Three scholars aren’t served yet. Their NWEA MAP national percentiles are 18, 33 and 45. Who gets the seat?", "opts": [["The scholar at the 18th percentile.", 1, "Right. Percentiles 1–24 get highest priority. The scholar at 33 is next once every lower-scoring scholar is served."], ["The scholar at the 45th percentile, who is closest to benchmark.", 0, "GRPS serves the greatest need first. 45 is above the 25–40 range used for eligibility."], ["Whoever the teacher thinks will benefit most.", 0, "Use the rank-ordered Title I Eligibility report. If you skip a lower-scoring scholar, you must write down why."]]}, {"type": "scenario", "q": "Back to the scholar who’s been in the group three years. His MAP percentile was 55 and 58 in the last two testing windows. What’s right?", "opts": [["Keep him in; it can’t hurt.", 0, "Seats should go to scholars who need them."], ["He meets the GRPS exit criteria (50th percentile or higher, two testing windows in a row). Exit him and keep watching his progress.", 1, "Right. Use the exit criteria and keep monitoring."], ["Wait until the end of the year.", 0, "Check after each MAP window."]]}, {"type": "scenario", "q": "A long-term substitute without state certification has taught a class for five weeks. What must happen?", "opts": [["Nothing.", 0, "Families must be told after four or more weeks in a row."], ["Families get timely notice, as required by Section 1112(e).", 1, "Right."], ["Only the principal needs to know.", 0, "Notice goes to families."]]}, {"type": "scenario", "q": "A teacher is out and there’s no substitute. The principal wants to cancel the Title I reading group so the Title I teacher can cover the class. What does GRPS guidance say?", "opts": [["That’s fine in an emergency.", 0, "Title I classes may not be canceled so Title I staff can substitute."], ["Don’t cancel the Title I group. Title I staff may substitute only during non-teaching time, like planning periods, and only if similarly situated staff share that duty.", 1, "Right. GRPS Handbook p. 18."], ["Only if the paraprofessional runs the group alone.", 0, "Paraprofessionals must work under a teacher’s direct supervision."]]}, {"type": "scenario", "q": "The building assigns lunch duty to all paraprofessionals. Can a Title I-paid paraprofessional take a lunch duty shift?", "opts": [["Yes, if similarly situated staff not paid by Title I have the same duties.", 1, "Right. Title I staff may have non-instructional duties like cafeteria, recess or buses when similar non-Title I staff do too."], ["Never. Title I staff can’t do any non-instructional duty.", 0, "They can, on the same basis as similarly situated staff."], ["Yes, and they can take extra shifts so other staff don’t have to.", 0, "Title I staff can’t carry a bigger share than similar staff."]]}, {"type": "respond", "q": "A parent asks why her son was moved out of his Title I reading group. Write your answer.", "respond": {"model": "“Great news: his MAP reading scores have been above the 50th percentile two testing windows in a row, which is our exit point. That means he’s reading at grade level. We’ll keep checking his progress, and if he starts to slip, he can come right back. Here’s how you can keep the momentum going at home…”", "look": ["Leads with the good news", "Explains the exit criteria simply", "Says progress will still be watched", "Gives the family a next step"]}}], "doit": {"text": "Open the <b>Title I Program Requirements Guide<\/b> and read the requirements on identifying and serving scholars. Compare with your school’s current list or MTSS process.", "tool": ["Title I Program Requirements Guide", "../program/"], "tasks": ["Read the requirements", "Compare with your process", "Note one to fix"]}, "quiz": [["Targeted assistance criteria must be:", ["Multiple, educationally related and objective", "Based on income", "Based on teacher opinion"], 0, "Section 1115(c)."], ["On NWEA MAP, which national percentiles get highest priority for Title I help at GRPS?", ["1–24", "25–40", "41–50"], 0, "GRPS Handbook p. 16. 25–40 may be served after all lower scores."], ["Families must be notified when their child is taught for how long by a teacher not meeting state certification?", ["One day", "Four or more weeks in a row", "A full year"], 1, "Section 1112(e)(1)(B)(ii)."], ["Title I paraprofessionals who help with instruction:", ["Work under a teacher’s direct supervision", "Teach alone", "Only supervise lunch"], 0, "Federal rules."], ["GRPS NWEA MAP exit criteria:", ["Above the 25th percentile once", "At or above the 50th percentile for two or more testing windows in a row", "Teacher recommendation"], 1, "GRPS identification procedure (Handbook p. 17)."]], "reflect": {"prompt": "How does your school decide who gets extra help, and who leaves it?", "plan": "What will you check after the next MAP window?"}, "facil": {"mins": 30, "open": "Pick one intervention group. How did each scholar get there?", "discuss": ["Which criteria do we use?", "Who should have exited?", "Are families told about teacher qualifications?"], "act": "Do the criteria sort.", "close": "Set a date after the next MAP window to review lists."}, "res": [["GRPS identification procedure (2026–27)", "https://docs.google.com/document/d/1KRMe3LFONk7fchXZBQtZRxKqABA2EnOB3ogu_efkBhU/edit"], ["GRPS Title I Handbook (2022), pp. 16–18", "https://drive.google.com/file/d/114wsrM373kUmgkzSOmvaF8G16a--uXuy/view"], ["ESSA Sections 1112, 1114, 1115", "https://oese.ed.gov/offices/office-of-formula-grants/school-support-and-accountability/essa-legislation-table-contents/title-i-part-a/"]], "confirm": ["The Title I Eligibility report is still on OurSchoolData.org", "GRPS paraprofessional qualification process"], "video": [["🎯", "Who gets extra help?", "Serve the greatest need first, using clear criteria."], ["📊", "Entry", "NWEA MAP 1st–24th percentile first, then 25th–40th."], ["🗂️", "After each MAP window", "Run the Title I Eligibility report and rank scholars lowest to highest."], ["🚪", "Exit", "50th percentile or higher for two testing windows in a row."], ["👩‍🏫", "Staff roles", "Paraprofessionals work under a teacher’s direct supervision."], ["✅", "Your turn", "Fill a seat, order the cycle and talk with a parent."]], "sub": "Criteria, entry and exit, and families’ right to know", "roles": ["Principal", "Teacher"]}, {"id": 11, "s": "serve", "t": "Budget and set-asides", "mins": 30, "goal": "Build a Title I budget from your plan, protect the family engagement amount, and keep the records reviewers ask for.", "can": ["I can explain district set-asides and school allocations.", "I can check every budget line against the plan.", "I can name the records Title I spending needs."], "why": {"story": "<b>GRPS Sample School<\/b> has a draft Title I budget. Some lines tie to the plan. Some are there because they were there last year.", "p": ["A budget is your plan in dollars. Every line should trace back to a need and a strategy."]}, "rule": {"p": ["The district reserves required amounts before school allocations, then gives schools their share by poverty rank (Section 1113). Spending follows federal cost rules (2 CFR 200)."], "points": [["District set-asides", "Including homeless services, equitable services for private school scholars, and at least 1% for family engagement (90% of that to schools)."], ["School allocations", "Based on poverty rank and the number of low-income scholars."], ["Cost rules", "Allowable, reasonable, necessary, allocable; prior approval where required."], ["Time and effort", "Staff paid with federal funds document how their time is spent (2 CFR 200.430)."], ["Equipment and timing", "Track equipment; spend within the grant period."]], "cites": [["ESSA Sections 1113 and 1116(a)(3)", "https://oese.ed.gov/offices/office-of-formula-grants/school-support-and-accountability/essa-legislation-table-contents/title-i-part-a/"], ["2 CFR 200", "https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200"]]}, "grps": {"intro": "At GRPS:", "steps": [["Start from the plan", "Each line ties to a need and strategy."], ["Protect family engagement", "Spend your family engagement allocation on family engagement, with family input."], ["Prior approval", "Submit requests to the Title I office before purchasing."], ["How to buy", "All spending goes through the GRPS financial system. Use ePurchase for vendors with an EIN or W-9; use a Payment Request Form for those without. For parent events, attach the Pre-Authorization Form, agenda, sign-in sheets and surveys."], ["Deadlines", "March 31: supplies and materials purchase requests. July 8: consultant payments and conference requests. Late requests may be returned."], ["Keep records", "Time and effort (Personnel Activity Reports), activity logs, invoices, sign-ins."]], "note": "Source: GRPS Title I Handbook, pp. 6–7."}, "watch": [["Copying last year’s budget.", "Start from this year’s plan."], ["Family engagement funds used for other things.", "Keep them for families."], ["Missing time and effort records.", "Certify on schedule."]], "practice": [{"type": "budget", "q": "Budget lab: GRPS Sample School (practice numbers)"}, {"type": "order", "q": "Put the Title I budget cycle in order.", "items": ["Review the needs assessment and plan", "Draft budget lines tied to strategies", "Plan the family engagement amount with families", "Get prior approval", "Purchase before the deadlines", "Keep time and effort records (PARs)", "Review spending mid-year and adjust"]}, {"type": "scenario", "q": "It’s April 20. A teacher wants to order reading materials with leftover Title I money. What do you tell her?", "opts": [["Order them today.", 0, "GRPS’s deadline for supplies and materials purchase requests is March 31. Late requests may be returned."], ["The March 31 deadline for supply requests has passed. Talk to the Title I office, and plan earlier next year.", 1, "Right. Know the deadlines and plan purchases from the start of the year."], ["Buy them with a personal card and get reimbursed.", 0, "All expenditures go through the GRPS financial system, and GRPS pays the vendor."]]}, {"type": "respond", "q": "In June your principal says, “We have $40,000 left. Let’s buy tablets for every classroom.” Write what you’d say.", "respond": {"model": "“Before we buy, let’s check it against the plan. Tablets for every classroom look like something general funds would usually provide, and the supply deadline was March 31. Let’s call the Title I office about what can still be done this year, and build next year’s budget earlier so the money goes to our reading strategy.”", "look": ["Ties the decision to the plan", "Flags the supplant risk", "Mentions the deadline", "Suggests a next step with the Title I office"]}}], "doit": {"text": "Look at your school’s Title I budget (ask your principal or secretary). For three lines, write the need and strategy each one supports.", "tool": ["Comprehensive Needs Assessment", "../cna/"], "tasks": ["Get the budget", "Check three lines", "Note one to question"]}, "quiz": [["What happens before schools get Title I allocations?", ["The district reserves required set-asides", "Schools spend first", "Nothing"], 0, "Set-asides come first."], ["At least how much of the district’s family engagement reservation goes to schools?", ["50%", "90%", "100%"], 1, "Section 1116(a)(3)."], ["Staff paid with Title I need:", ["Time and effort records", "Nothing extra", "A second job"], 0, "2 CFR 200.430."], ["What is GRPS’s deadline for Title I supplies and materials purchase requests?", ["March 31", "June 30", "Any time before the money runs out"], 0, "GRPS Handbook p. 6. Consultant and conference requests are due July 8."], ["Each budget line should trace to:", ["A need and strategy in the plan", "Last year’s budget", "The principal’s wish list"], 0, "Budget follows the plan."]], "reflect": {"prompt": "Which line in your budget would be hardest to connect to your plan?", "plan": "What will you do about it?"}, "facil": {"mins": 35, "open": "Project the budget lab and do it together.", "discuss": ["Which of our lines don’t trace to the plan?", "How are family engagement funds decided?", "Are time and effort records current?"], "act": "Mark each of your real budget lines Keep, Cut or Ask.", "close": "List questions for the Title I office."}, "res": [["GRPS Title I Handbook (2022), pp. 6–7", "https://drive.google.com/file/d/114wsrM373kUmgkzSOmvaF8G16a--uXuy/view"], ["ESSA Section 1113", "https://oese.ed.gov/offices/office-of-formula-grants/school-support-and-accountability/essa-legislation-table-contents/title-i-part-a/"], ["2 CFR 200", "https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200"]], "confirm": ["This year’s purchase deadlines (Handbook shows March 31 and July 8)", "Time and effort (PAR) schedule"], "video": [["💰", "A budget is your plan in dollars", "Every line should trace to a need and a strategy."], ["🏦", "District first", "Set-asides come off the top, then schools get their share."], ["👪", "Protect family engagement", "Your family engagement amount is for families, decided with families."], ["📅", "Know the deadlines", "March 31 for supplies; July 8 for consultants and conferences."], ["🧾", "Keep the records", "Prior approvals, invoices and Personnel Activity Reports."], ["✅", "Your turn", "Build a budget, order the cycle and coach a principal."]], "sub": "Set-asides, school budgets and records", "roles": ["Principal"]}, {"id": 12, "s": "serve", "t": "Evidence and monitoring", "mins": 25, "goal": "Know what reviewers ask for, keep it organized all year, and use it to improve, not just to comply.", "can": ["I can list the evidence reviewers ask for.", "I can match evidence to requirements.", "I can set up a routine to keep it current."], "why": {"story": "The MDE review is in three weeks. <b>GRPS Sample School<\/b>’s evidence is spread across email, desk drawers and a laptop that left with a former staff member.", "p": ["Evidence shows that the work happened. Kept well, it also shows what’s working."]}, "rule": {"p": ["MDE monitors districts for Title I compliance; districts monitor schools. Reviewers ask for evidence of each requirement."], "points": [["MDE On-Site Review", "Reviewers use a study guide in four strands: teaching for learning (curriculum, instruction, assessment, data); leadership and decision-making; staff qualifications and professional learning; and school, family and community relations."], ["Plan", "Needs assessment, schoolwide plan, annual review."], ["Families", "Annual meeting packet, compact, parent policy, communication."], ["Scholars", "Identification lists and criteria (targeted assistance), progress data."], ["Money", "Budgets, prior approvals, invoices, Personnel Activity Reports (PARs) and activity logs, inventory."], ["Notices", "Right-to-know notices to families."]], "cites": [["GRPS Title I Handbook (2022), pp. 42–50: On-Site Review study guide", "https://drive.google.com/file/d/114wsrM373kUmgkzSOmvaF8G16a--uXuy/view"], ["MDE: Title I, Part A", "https://www.michigan.gov/mde/services/school-performance-supports/educational-supports/programs/title-i-part-a-improving-basic-programs"]]}, "grps": {"intro": "GRPS routine:", "steps": [["Within a week", "File meeting evidence."], ["Each marking period", "Update plan measures."], ["Spring", "Revise compact, policy and needs assessment with families."], ["One folder", "Keep evidence in the school’s Title I folder, not personal drives."]], "note": ""}, "watch": [["Evidence on personal drives.", "Use the shared folder."], ["Undated documents.", "Date and label everything."], ["Scrambling before a review.", "File as you go."]], "practice": [{"type": "sort", "q": "Match the evidence to the requirement.", "buckets": ["Annual meeting", "Compact", "Plan", "Money"], "items": [["Dated sign-in sheet", 0, "Shows attendance."], ["Conference log noting the compact was discussed", 1, "Shows use."], ["Needs assessment with data", 2, "Plan."], ["Personnel Activity Report (PAR)", 3, "Time and effort for staff paid with Title I."], ["School Improvement Team minutes showing parents took part", 2, "Shows stakeholders shaped the plan."], ["Flyer posted 72 hours ahead", 0, "Notice."], ["Prior approval form", 3, "Money."]]}, {"type": "order", "q": "Put the evidence routine for a family event in order.", "items": ["Post the flyer at least 72 hours ahead and photograph it", "Set out the dated, labeled sign-in sheet", "Follow the agenda and share the slides", "Collect family evaluations", "Write the minutes, including families’ questions", "Gather itemized receipts", "File everything in the school’s Title I folder within a week"]}, {"type": "scenario", "q": "The sign-in sheet from the annual meeting is missing. What now?", "opts": [["Recreate it from memory.", 0, "Never create evidence after the fact."], ["Gather what you do have (flyer, slides, evaluations, minutes), note what’s missing, and fix the process.", 1, "Right. Be honest and fix the system."], ["Ignore it.", 0, "Reviewers will ask."]]}, {"type": "respond", "q": "A new office assistant asks, “What do I need to save from tonight’s family math night?” Write your answer as a quick checklist message.", "respond": {"model": "“Thanks for asking! Please save: the flyer and a photo of where it was posted, the sign-in sheet (dated, labeled ‘Family Math Night,’ scholar names), the agenda, family evaluations, minutes with any questions families asked, and the receipts. Put it all in our Title I folder by next Thursday.”", "look": ["Lists the flyer and sign-in", "Includes evaluations and minutes", "Includes receipts", "Gives the place and the deadline"]}}], "doit": {"text": "Open the <b>Title I Program Requirements Guide<\/b>. For each requirement, check whether your school’s evidence is in the shared folder.", "tool": ["Title I Program Requirements Guide", "../program/"], "tasks": ["Check each requirement", "Find the evidence", "List gaps"]}, "quiz": [["Evidence should be kept:", ["In the school’s shared Title I folder", "On personal drives", "Only on paper at home"], 0, "Shared, organized."], ["Which is evidence for the annual meeting?", ["Dated sign-in sheet", "Staff coffee receipt", "Lunch menu"], 0, "Attendance proof."], ["If evidence is missing, you should:", ["Recreate it", "Note the gap and fix the process", "Ignore it"], 1, "Be honest."], ["When should meeting evidence be filed?", ["Within about a week", "Before the review", "Never"], 0, "File as you go."], ["Time and effort records are evidence for:", ["Money", "Families", "Plan"], 0, "Spending."]], "reflect": {"prompt": "What evidence would be hardest for your school to find today?", "plan": "What routine will you start?"}, "facil": {"mins": 25, "open": "Open the school’s Title I folder together.", "discuss": ["What’s here? What’s missing?", "Who files what?", "How could evidence help us improve?"], "act": "Do the matching sort, then a 10-minute folder check.", "close": "Assign owners for each evidence type."}, "res": [["GRPS Title I Handbook (2022), pp. 42–50", "https://drive.google.com/file/d/114wsrM373kUmgkzSOmvaF8G16a--uXuy/view"], ["MDE: Title I, Part A", "https://www.michigan.   c.onclick=()=>{if(c.dataset.dragged)return;const key=mid()+'|'+i;SEL[key]=SEL[key]===j?undefined:j;if(SEL[key]===undefined)delete SEL[key];rerenderAct(M(mid()),i,`[data-cd="${i}|${j}"]`);live(SEL[key]!=null?'Card selected. Choose a box.':'Card unselected')};
  let hot=null;dragify(c,{move:(x,y)=>{const t=document.elementFromPoint(x,y)?.closest('[data-bin]');if(hot&&hot!==t)hot.classList.remove('hot');if(t&&t.dataset.bin.startsWith(i+'|')){t.classList.add('hot');hot=t}else hot=null},
   drop:(x,y)=>{if(hot)hot.classList.remove('hot');const t=document.elementFromPoint(x,y)?.closest('[data-bin]');if(t&&t.dataset.bin.startsWith(i+'|'))placeCard(i,j,+t.dataset.bin.split('|')[1])}})});
 app.querySelectorAll('[data-place]').forEach(b=>b.onclick=e=>{e.stopPropagation();const [i,k]=b.dataset.place.split('|').map(Number);const j=SEL[mid()+'|'+i];if(j!=null)placeCard(i,j,k)});
 app.querySelectorAll('[data-ordrow]').forEach(row=>{const [i,pos]=row.dataset.ordrow.split('|').map(Number);let over=null;
  dragify(row,{start:()=>row.classList.add('drag'),move:(x,y)=>{const t=document.elementFromPoint(x,y)?.closest('[data-ordrow]');if(over&&over!==t)over.classList.remove('over');if(t&&t!==row&&t.dataset.ordrow.startsWith(i+'|')){t.classList.add('over');over=t}else over=null},
   drop:(x,y)=>{row.classList.remove('drag');if(over)over.classList.remove('over');const t=document.elementFromPoint(x,y)?.closest('[data-ordrow]');if(!t||t===row||!t.dataset.ordrow.startsWith(i+'|'))return;const to=+t.dataset.ordrow.split('|')[1];const m=M(mid());const v=ST(m.id).act[i];const o=v.o;const [it]=o.splice(pos,1);o.splice(to,0,it);v.chk=0;save();rerenderAct(m,i);live('Moved to position '+(to+1))}})});
 app.querySelectorAll('[data-rs]').forEach(t=>t.oninput=()=>{const i=+t.dataset.rs;const m=M(mid());const v=ST(m.id).act[i]||{};v.t=t.value;ST(m.id).act[i]=v;save();const b=document.querySelector(`[data-rsshow="${i}"]`);if(b)b.disabled=t.value.trim().length<20;const el=document.getElementById('act'+i);const ok=actDone(m,i);el.classList.toggle('ok',ok)});
 app.querySelectorAll('[data-rsshow]').forEach(b=>b.onclick=()=>{const i=+b.dataset.rsshow;const m=M(mid());const v=ST(m.id).act[i]||{};v.shown=v.shown?0:1;ST(m.id).act[i]=v;save();rerenderAct(m,i,`[data-rsshow="${i}"]`)});
 app.querySelectorAll('[data-rl]').forEach(c=>c.onchange=()=>{const [i,k]=c.dataset.rl.split('|').map(Number);const m=M(mid());const v=ST(m.id).act[i];v.l=v.l||[];v.l[k]=c.checked;save()});
 app.querySelectorAll('[data-vplay]').forEach(b=>b.onclick=()=>{const m=M(document.getElementById('vid').dataset.m);if(VID&&VID.playing){stopVid();b.textContent='▶ Play';return}const st=VID&&VID.m===m.id&&VID.i<m.video.length-1?VID.i:0;VID={m:m.id,i:st,playing:true};b.textContent='❚❚ Pause';showScene(st)});
 app.querySelectorAll('[data-vgo]').forEach(b=>b.onclick=()=>{const m=M(document.getElementById('vid').dataset.m);const was=VID&&VID.playing;stopVid();VID={m:m.id,i:+b.dataset.vgo,playing:was};showScene(+b.dataset.vgo)});
 app.querySelectorAll('[data-vnarr]').forEach(b=>b.onclick=()=>{S.narr=S.narr===false;save();b.setAttribute('aria-pressed',S.narr!==false);b.textContent=S.narr!==false?'🔊 Narration on':'🔇 Narration off';if(S.narr===false&&canSpeak)speechSynthesis.cancel()});
 app.querySelectorAll('[data-sochk]').forEach(b=>b.onclick=()=>{const i=+b.dataset.sochk;const m=M(mid());const v=ST(m.id).act[i];const a=m.practice[i];v.chk=1;const r=a.items.filter((x,j)=>v.p[j]===x[1]).length;v.ok=r===a.items.length?1:0;save();rerenderAct(m,i,'[data-sochk]');live(r+' of '+a.items.length+' right')});
 app.querySelectorAll('[data-om]').forEach(b=>b.onclick=()=>{const [i,pos,d]=b.dataset.om.split('|').map(Number);const m=M(mid());const v=ST(m.id).act[i];const o=v.o;[o[pos],o[pos+d]]=[o[pos+d],o[pos]];v.chk=0;save();rerenderAct(m,i,`[data-om="${i}|${pos+d}|${d}"]`)});
 app.querySelectorAll('[data-ochk]').forEach(b=>b.onclick=()=>{const i=+b.dataset.ochk;const m=M(mid());const v=ST(m.id).act[i];v.chk=1;const r=v.o.filter((j,p)=>j===p).length;v.ok=r===v.o.length?1:0;save();rerenderAct(m,i,'[data-ochk]');live(r+' of '+v.o.length+' in place')});
 app.querySelectorAll('[data-bf]').forEach(t=>t.oninput=()=>{const [i,j]=t.dataset.bf.split('|').map(Number);const m=M(mid());const v=ST(m.id).act[i]||{};v.f=v.f||[];v.f[j]=t.value;ST(m.id).act[i]=v;save();const el=document.getElementById('act'+i);const ok=actDone(m,i);el.classList.toggle('ok',ok);const tg=el.querySelector('.ah .tag');if(ok&&!tg)el.querySelector('.ah').insertAdjacentHTML('beforeend','<span class="tag d">✓ Complete</span>');if(!ok&&tg)tg.remove()});
 app.querySelectorAll('[data-br]').forEach(c=>c.onchange=()=>{const [i,j]=c.dataset.br.split('|').map(Number);const m=M(mid());const v=ST(m.id).act[i]||{};v.r=v.r||[];v.r[j]=c.checked;ST(m.id).act[i]=v;save()});
 app.querySelectorAll('[data-lab]').forEach(b=>b.onclick=()=>{const [i,q,j]=b.dataset.lab.split('|').map(Number);const m=M(mid());const v=ST(m.id).act[i]||{};v.a=v.a||{};v.a[q]=j;ST(m.id).act[i]=v;save();rerenderAct(m,i,`[data-lab="${i}|${q}|${j}"]`);
  const el=document.getElementById('act'+i);const okq=[...el.querySelectorAll('.fb.ok')].length;if(okq===LABN[m.practice[i].lab]){v.ok=1;save();rerenderAct(m,i,`[data-lab="${i}|${q}|${j}"]`)}});
 app.querySelectorAll('[data-bu]').forEach(b=>b.onclick=()=>{const [i,j,k]=b.dataset.bu.split('|').map(Number);const m=M(mid());const v=ST(m.id).act[i]||{};v.p=v.p||{};v.p[j]=k;ST(m.id).act[i]=v;save();rerenderAct(m,i,`[data-bu="${i}|${j}|${k}"]`)});
 app.querySelectorAll('[data-buchk]').forEach(b=>b.onclick=()=>{const i=+b.dataset.buchk;const m=M(mid());const v=ST(m.id).act[i];v.chk=1;const r=BUD.lines.filter((l,j)=>v.p[j]===l[3]).length;v.ok=r===BUD.lines.length?1:0;save();rerenderAct(m,i,'[data-buchk]');live(r+' of '+BUD.lines.length+' right')});
 app.querySelectorAll('[data-doit]').forEach(b=>b.onclick=()=>{const s=ST(mid());s.doit=s.doit?0:1;save();render()});
 app.querySelectorAll('[data-qz]').forEach(b=>b.onclick=()=>{const [i,j]=b.dataset.qz.split('|').map(Number);const q=ST(mid()).quiz;q.a=q.a||{};q.a[i]=j;save();const y=window.scrollY;render();window.scrollTo(0,y);document.querySelector(`[data-qz="${i}|${j}"]`)?.focus({preventScroll:true})});
 app.querySelectorAll('[data-qsub]').forEach(b=>b.onclick=()=>{const m=M(mid());const q=ST(m.id).quiz;q.sub=1;const r=m.quiz.filter((x,i)=>q.a[i]===x[2]).length;q.best=Math.max(q.best||0,r);if(r>=Math.ceil(m.quiz.length*.8))q.passed=1;save();render();document.querySelector('.score')?.scrollIntoView({block:'center'});live(r+' of '+m.quiz.length+(q.passed?', passed':''))});
 app.querySelectorAll('[data-refl]').forEach(t=>t.oninput=()=>{const m=M(mid());ST(m.id).refl[t.dataset.refl]=t.value;save();const ready=practiceDone(m)&&quizPassed(m)&&reflDone(m);const btn=app.querySelector('[data-finish]');if(!!btn!==ready&&practiceDone(m)&&quizPassed(m)){}});
 app.querySelectorAll('[data-finish]').forEach(b=>b.onclick=()=>{const m=M(mid());if(!reflDone(m)){const t=document.getElementById('ra');t.focus();t.style.borderColor='var(--bad)';live('Write your reflection first');return}checkDone(m);go('#/m/'+m.id+'/done')});
 app.querySelectorAll('[data-name]').forEach(t=>t.oninput=()=>{S.name=t.value;save()});
 app.querySelectorAll('[data-name]').forEach(t=>t.onchange=()=>{const y=window.scrollY;render();window.scrollTo(0,y)});
 app.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>{const blob=new Blob([JSON.stringify({app:'grps-title1-academy',v:1,saved:new Date().toISOString(),data:S},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='title-i-academy-progress.json';document.body.appendChild(a);a.click();a.remove()});
 app.querySelectorAll('[data-import]').forEach(inp=>inp.onchange=()=>{const f=inp.files[0];if(!f)return;f.text().then(t=>{const j=JSON.parse(t);if(j.app!=='grps-title1-academy'||!j.data)throw 0;S=j.data;S.m=S.m||{};save();document.getElementById('impmsg').innerHTML='<div class="fb ok"><b>✓ Loaded.</b> Your progress is here now. <a href="#/">Go to the Academy home</a>.</div>'}).catch(()=>{document.getElementById('impmsg').innerHTML='<div class="fb no">That file isn’t an Academy progress file.</div>'})});
}
function rerenderAct(m,i,focusSel){const el=document.getElementById('act'+i);const tmp=document.createElement('div');tmp.innerHTML=actView(m,m.practice[i],i);const n=tmp.firstElementChild;el.replaceWith(n);wire(n.parentNode===null?document:n);
 // re-wire only within new node
 if(focusSel){const f=n.querySelector(focusSel);if(f)f.focus({preventScroll:true})}
 const prog=document.querySelectorAll('.rail button')[4];if(prog)prog.classList.toggle('d',practiceDone(m))}
render();
</script></body></html>
