<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Professional Learning Title I Academy · GRPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#15293b;--ink2:#33414d;--blue:#005696;--soft:#e7f0f8;--orange:#f57b20;--odk:#c85a0b;--good:#1d7a4c;--goodbg:#f2faf5;--bad:#a5321f;--badbg:#fdf1ef;--muted:#5a6570;--line:#dde3e8;--bg:#fbf8f4;--navy:#15293b;
--found:#005696;--plan:#1d7a4c;--fam:#c85a0b;--serve:#8a6d00}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif}
h1,h2,h3,.h{font-family:'Bricolage Grotesque',Figtree,sans-serif;line-height:1.12;margin:0}
a{color:var(--blue)}button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:6px}[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;left:-9999px}
header.top{display:flex;align-items:center;gap:12px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top img{height:34px}.brand{font-weight:800;font-size:15px;text-decoration:none;color:var(--ink);line-height:1.15}.brand small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}.nav a{font-size:14px;font-weight:700;text-decoration:none;color:var(--ink);padding:7px 11px;border-radius:999px;border:1.5px solid var(--line);background:#fff}.nav a.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.home{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:7px 11px;text-decoration:none;color:var(--ink);font-weight:700;font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:26px 20px 70px}
.k{font-size:12px;font-weight:800;letter-spacing:.07em;color:var(--muted);text-transform:uppercase}
.lead{color:var(--ink2);font-size:17px;margin:8px 0 0;max-width:780px}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:11px;padding:11px 17px;font-weight:700;color:#fff;background:var(--blue);text-decoration:none;line-height:1.2}
.btn.or{background:var(--odk)}.btn.gd{background:var(--good)}.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid #c7d3dd}.btn.sm{padding:7px 12px;font-size:14px}.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:#fff;border-radius:18px;padding:20px 22px;box-shadow:0 1px 3px rgba(21,41,59,.06)}
.hero{background:var(--navy);color:#fff;border-radius:24px;padding:34px 36px;display:grid;grid-template-columns:1.35fr 1fr;gap:28px;align-items:center;position:relative;overflow:hidden}
.hero h1{font-size:clamp(32px,4.4vw,50px);font-weight:800}.hero h1 .pre{display:block;font-size:.42em;letter-spacing:.09em;text-transform:uppercase;color:#ffc999;font-family:Figtree;font-weight:800;margin-bottom:8px}
.hero p{color:#d6dee6;font-size:17px;margin:12px 0 18px}
.hero .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hero .stat{background:rgba(255,255,255,.08);border-radius:14px;padding:14px 16px}.hero .stat b{display:block;font-family:'Bricolage Grotesque';font-size:30px}.hero .stat span{font-size:14px;color:#d6dee6}
.parts8{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.parts8 span{font-size:13px;background:rgba(255,255,255,.1);border-radius:999px;padding:4px 10px}
.sec{margin-top:34px}.sec>h2{font-size:28px;margin:4px 0 4px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:16px}
.rc{background:#fff;border-radius:18px;padding:18px;border-top:6px solid;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;box-shadow:0 1px 3px rgba(21,41,59,.06)}
.rc .em{font-size:28px}.rc b{font-family:'Bricolage Grotesque';font-size:21px}.rc p{margin:0;color:var(--ink2);font-size:14.5px;flex:1}.rc .meta{font-size:13px;color:var(--muted)}
.bar{display:flex;gap:3px}.bar span{flex:1;height:7px;border-radius:4px;background:var(--line)}.bar .d{background:var(--good)}.bar .p{background:var(--orange)}
.strands{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.strand .sh{font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px}
.mc{display:flex;flex-direction:column;gap:3px;background:#fff;border-radius:14px;padding:13px 15px;border-left:5px solid;margin-bottom:10px;text-decoration:none;color:inherit;box-shadow:0 1px 3px rgba(21,41,59,.06)}
.mc:hover{box-shadow:0 3px 12px rgba(21,41,59,.12)}.mc .row{display:flex;justify-content:space-between;gap:8px;align-items:center}.mc b{font-size:16px;line-height:1.25}.mc small{color:var(--ink2);font-size:13.5px}
.tag{font-size:12px;font-weight:800;border-radius:999px;padding:2px 8px;white-space:nowrap}.tag.d{background:var(--goodbg);color:var(--good)}.tag.p{background:#fff1e5;color:var(--odk)}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.how div{background:#fff;border-radius:14px;padding:14px}.how b{display:block}.how span{font-size:14px;color:var(--ink2)}
.resume{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fff7ef;border:2px solid #ffd7b5;border-radius:18px;padding:16px 20px;margin-top:18px}
/* module */
.mhead{border-radius:22px;color:#fff;padding:24px 28px}.mhead h1{font-size:clamp(28px,3.6vw,40px);font-weight:800;margin:6px 0}.mhead .meta{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.prog{display:flex;gap:5px;margin-top:14px}.prog button{flex:1;height:8px;border:0;border-radius:4px;background:rgba(255,255,255,.28);padding:0}.prog button.d{background:#fff}.prog button.on{background:#ffc999}
.mgrid{display:grid;grid-template-columns:250px 1fr;gap:22px;margin-top:20px;align-items:start}
.rail{position:sticky;top:76px;background:#fff;border-radius:16px;padding:10px}.rail button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 8px;border-radius:10px;font-size:14.5px;font-weight:600}
.rail button.on{background:var(--soft)}.rail .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--line);flex:none}.rail .d .n{background:var(--good);color:#fff}.rail .on .n{background:var(--orange);color:#fff}
.rail .f{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.pt{display:flex;flex-direction:column;gap:16px}.pt h2{font-size:28px}
.story{background:#fff7ef;border-left:5px solid var(--orange);border-radius:12px;padding:14px 18px;font-size:16.5px}
.pts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pts div{background:var(--bg);border-radius:12px;padding:12px 14px}.pts b{display:block;margin-bottom:2px}.pts span{font-size:14.5px;color:var(--ink2)}
.cite{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:14px}.cite a{margin-right:12px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.steps div{background:#fff;box-shadow:0 1px 3px rgba(21,41,59,.06);border-radius:12px;padding:12px 14px}.steps b{display:block}.steps span{font-size:14px;color:var(--ink2)}
.watch{display:flex;flex-direction:column;gap:10px}.watch div{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:#fff;border-radius:12px;padding:12px 14px;border:1.5px solid var(--line)}
.watch .x{color:var(--bad)}.watch .y{color:var(--good)}.watch b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;display:block}
.act{border:2px solid var(--line);border-radius:16px;padding:18px;background:#fff}.act.ok{border-color:var(--good)}
.act .ah{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.act .q{font-weight:700;font-size:17px;margin:6px 0 10px}
.opt{display:block;width:100%;text-align:left;padding:11px 14px;border-radius:11px;border:1.5px solid var(--line);background:#fff;margin:7px 0}
.opt:hover{border-color:#9fb6c9}.opt.right{border-color:var(--good);background:var(--goodbg)}.opt.wrong{border-color:var(--bad);background:var(--badbg)}.opt.sel{border-color:var(--blue);background:var(--soft)}
.fb{font-size:15px;margin-top:8px;padding:10px 12px;border-radius:10px}.fb.ok{background:var(--goodbg);color:#14553a}.fb.no{background:var(--badbg);color:#7d2416}
.si{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.si:first-of-type{border-top:0}
.si .bk{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.si .bk button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:700}
.si .bk button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}.si .why{grid-column:1/-1;font-size:14px;margin-top:-2px}.si.r .why{color:var(--good)}.si.w .why{color:var(--bad)}
.si.r>span:first-child::before{content:'✓ ';color:var(--good);font-weight:800}.si.w>span:first-child::before{content:'✗ ';color:var(--bad);font-weight:800}
.ord{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);margin:6px 0;background:#fff}.ord .num{font-weight:800;width:24px;color:var(--muted)}.ord span{flex:1}.ord button{border:1.5px solid var(--line);background:#fff;border-radius:8px;width:34px;height:30px}
.ord.r{border-color:var(--good);background:var(--goodbg)}.ord.w{border-color:var(--bad);background:var(--badbg)}
textarea,input[type=text],input[type=number]{font:inherit;width:100%;padding:10px 12px;border:1.5px solid #c7d3dd;border-radius:10px;background:#fff}textarea{min-height:72px;resize:vertical}
label.fl{display:block;font-weight:700;font-size:14.5px;margin:10px 0 4px}
.rub{display:flex;flex-direction:column;gap:6px;margin-top:10px;background:var(--bg);border-radius:12px;padding:12px 14px}.rub label{display:flex;gap:8px;align-items:flex-start;font-size:14.5px}
.chart{display:flex;flex-direction:column;gap:7px;margin:8px 0 6px}.cr{display:grid;grid-template-columns:200px 1fr 60px;gap:10px;align-items:center;font-size:14.5px}
.cr .track{height:20px;background:#eef1f4;border-radius:4px;position:relative}.cr .fill{display:block;height:100%;background:var(--blue);border-radius:0 4px 4px 0}.cr .ref{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.cr.all .fill{background:#7a8a99}.cr b{text-align:right}.legend{font-size:13px;color:var(--muted)}
.bud{width:100%;border-collapse:collapse;font-size:14.5px}.bud td,.bud th{padding:9px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}.bud th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bud td:last-child{min-width:240px}.bud .bk{flex-wrap:nowrap!important}.bud .amt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.bud .why{font-size:13.5px}.bud tr.r .why{color:var(--good)}.bud tr.w .why{color:var(--bad)}
.tot{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}.tot div{background:var(--bg);border-radius:12px;padding:10px 14px}.tot b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.conf{display:flex;flex-direction:column;gap:12px}.cf{background:var(--bg);border-radius:12px;padding:12px 14px}.cf .sc{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.cf .sc button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700}.cf .sc button[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
.navb{display:flex;justify-content:space-between;gap:10px;margin-top:8px;flex-wrap:wrap}
.quizq{padding:14px 0;border-top:1px solid var(--line)}.quizq:first-child{border-top:0}
.score{display:flex;gap:16px;align-items:center;padding:14px 18px;border-radius:14px}.score b{font-family:'Bricolage Grotesque';font-size:34px}
.badge{display:inline-grid;place-items:center;width:90px;height:90px;border-radius:50%;color:#fff;font-family:'Bricolage Grotesque';font-weight:800;font-size:30px;border:5px solid #fff;box-shadow:0 0 0 3px currentColor}
.grow{display:grid;grid-template-columns:1fr 90px 90px;gap:8px;font-size:14.5px;align-items:center}.grow .h{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.review{background:#fff8d6;border:2px dashed #c9a400;border-radius:14px;padding:12px 16px;font-size:14.5px}
.tbl{width:100%;border-collapse:collapse;font-size:15px}.tbl td,.tbl th{padding:10px 8px;border-top:1px solid var(--line);text-align:left}.tbl th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cert{background:#fff;border:3px solid var(--blue);border-radius:24px;padding:40px 28px;text-align:center;max-width:860px;margin:0 auto}.cert .t{font-family:'Bricolage Grotesque';font-size:38px;font-weight:800;margin:8px 0}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}.pill{background:var(--soft);color:var(--blue);font-weight:700;font-size:13px;padding:5px 11px;border-radius:999px}
.note{font-size:13.5px;color:var(--muted)}
.vid{background:#0f1f2e;border-radius:18px;overflow:hidden;color:#fff;box-shadow:0 4px 18px rgba(21,41,59,.18)}
.stage{aspect-ratio:16/9;max-height:430px;width:100%;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 78% 22%,var(--sc) 0,rgba(15,31,46,0) 55%),radial-gradient(circle at 15% 90%,rgba(245,123,32,.35) 0,rgba(15,31,46,0) 45%),#0f1f2e;padding:24px 40px;text-align:center}
.scene{display:flex;flex-direction:column;align-items:center;gap:10px}.scene .em{font-size:clamp(48px,7vw,78px);animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
.scene h3{font-size:clamp(22px,3.3vw,40px);font-weight:800;animation:rise .55s .12s both}.scene p{margin:0;max-width:660px;font-size:clamp(15px,1.8vw,19px);color:#d6dee6;animation:rise .55s .3s both}
.vtag{position:absolute;left:16px;top:12px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#ffc999}
.vnum{position:absolute;right:16px;top:12px;font-size:13px;color:#b8c4cf}
.vctl{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#0b1824;flex-wrap:wrap}.vctl button{border:0;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;background:#24384b;color:#fff}.vctl .vp{background:var(--orange)}
.vdots{display:flex;gap:6px;flex:1;min-width:120px}.vdots button{flex:1;height:7px;padding:0;border-radius:4px;background:#2d4458}.vdots button.d{background:#fff}.vdots button.on{background:#ffc999}
@keyframes pop{from{transform:scale(.3);opacity:0}}@keyframes rise{from{transform:translateY(18px);opacity:0}}
@media(prefers-reduced-motion:reduce){.scene .em,.scene h3,.scene p{animation:none}}
.board{display:flex;flex-direction:column;gap:12px}.tray{background:var(--bg);border:2px dashed #c7d3dd;border-radius:14px;padding:10px;min-height:64px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.tray .th,.bin .bh{width:100%;font-size:12.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.bins{display:grid;gap:10px}.bin{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;min-height:110px;display:flex;flex-direction:column;gap:7px;transition:border-color .15s,background .15s}
.bin .bh{color:var(--ink);font-size:13.5px;display:flex;justify-content:space-between;gap:6px;align-items:center}.bin .mv{border:0;background:var(--orange);color:#fff;border-radius:999px;font-size:12px;font-weight:800;padding:3px 9px}
.bin.hot,.tray.hot{border-color:var(--orange);background:#fff7ef}
.cd{display:block;text-align:left;border:1.5px solid #c7d3dd;background:#fff;border-radius:11px;padding:8px 11px;font-size:14px;line-height:1.35;cursor:grab;touch-action:none;user-select:none;box-shadow:0 1px 2px rgba(21,41,59,.08)}
.tray .cd{max-width:100%}.cd.sel{border-color:var(--orange);box-shadow:0 0 0 3px rgba(245,123,32,.3)}.cd.r{border-color:var(--good);background:var(--goodbg)}.cd.w{border-color:var(--bad);background:var(--badbg)}
.cd .why{display:block;font-size:12.5px;margin-top:4px}.cd.r .why{color:var(--good)}.cd.w .why{color:var(--bad)}
.dghost{position:fixed;z-index:99;pointer-events:none;opacity:.92;transform:rotate(-2deg);box-shadow:0 10px 24px rgba(21,41,59,.25)!important}
.ord{cursor:grab;touch-action:none;user-select:none}.ord .grip{color:#9aa8b4;font-size:18px;line-height:1;flex:none!important;width:16px}.ord .num{flex:none!important}@media(max-width:820px){.bins{grid-template-columns:1fr 1fr!important}}@media(max-width:480px){.bins{grid-template-columns:1fr!important}}.ord.drag{opacity:.35}.ord.over{box-shadow:0 -3px 0 var(--orange)}
.model{background:var(--goodbg);border-left:5px solid var(--good);border-radius:12px;padding:12px 16px;margin-top:10px}
.fg h3{font-size:20px;margin:16px 0 6px}.fg ol,.fg ul{margin:4px 0;padding-left:22px}.fg li{margin:4px 0}
@media(max-width:980px){.strands{grid-template-columns:1fr 1fr}.how{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}}
@media(max-width:820px){.mgrid{grid-template-columns:1fr}.rail{position:static;display:flex;overflow-x:auto;gap:4px}.rail button{white-space:nowrap;width:auto}.rail .lbl{display:none}.rail .f{display:none}.pts,.watch div{grid-template-columns:1fr}.cr{grid-template-columns:120px 1fr 52px}.si{grid-template-columns:1fr}.si .bk{justify-content:flex-start}.nav{display:none}}
@media(max-width:560px){.strands,.how{grid-template-columns:1fr}.hero{padding:24px}}

<script>
const MODS=[{"id": 1, "s": "found", "t": "Title I 101", "mins": 25, "goal": "Explain where Title I money comes from, who it serves and what it is for, in a way a family would understand.", "can": ["I can explain what Title I is for in one or two sentences.", "I can describe how Title I money gets from Washington to my school.", "I can name the rights Title I gives families."], "why": {"story": "It’s the first week of school at <b>GRPS Sample School<\/b>. A grandmother at the front desk points to the “Title I School” sign and asks, “Does that mean my grandson is in trouble?” The new office assistant isn’t sure what to say.", "p": ["Title I is the largest federal program in K–12 education. At GRPS it pays for people and programs in almost every school: interventionists, tutoring, extra learning time, professional learning and family engagement.", "When staff can explain Title I clearly, families stop seeing a label and start seeing a promise: extra help, a voice in how the school spends that money, and the right to know how their scholar is doing."]}, "rule": {"p": ["Title I, Part A of the Elementary and Secondary Education Act, now called the Every Student Succeeds Act (ESSA), exists to give every child a fair, equal and real chance at a high-quality education, and to close achievement gaps."], "points": [["Money follows poverty", "The federal government sends Title I money to states, and Michigan sends it to districts, mostly by formula based on the number of children from low-income families."], ["Districts rank schools", "GRPS ranks its schools by poverty and serves the highest-poverty schools first. Schools above 75% poverty must be served in rank order (Section 1113)."], ["Some money is set aside first", "Before schools get their share, the district sets aside money for required purposes, including scholars experiencing homelessness, equitable services for eligible private school scholars, and parent and family engagement."], ["Two ways to run it", "A school runs a schoolwide program (most GRPS Title I schools) or a targeted assistance program. Module 2 goes deeper."], ["Families have rights", "An annual meeting, a voice in planning, a school-parent compact, a parent policy, information in a language they understand, and the right to ask about their teacher’s qualifications (Sections 1112(e) and 1116)."]], "cites": [["ESSA Title I, Part A (Sections 1001, 1112, 1113, 1116)", "https://oese.ed.gov/offices/office-of-formula-grants/school-support-and-accountability/essa-legislation-table-contents/title-i-part-a/"], ["MDE: Title I, Part A", "https://www.michigan.gov/mde/services/school-performance-supports/educational-supports/programs/title-i-part-a-improving-basic-programs"]]}, "grps": {"intro": "How Title I reaches a GRPS classroom:", "steps": [["1 · Federal and state", "The U.S. Department of Education allocates Title I to Michigan; MDE calculates each district’s allocation."], ["2 · District", "GRPS sets aside required amounts, then gives each Title I school its allocation based on its poverty rank and enrollment."], ["3 · School plan", "Your school decides how to use its allocation through the needs assessment and plan, with families at the table."], ["4 · Scholars", "The money pays for the extra people, time and supports in your plan."]], "note": "Your school’s program type and allocation are on the Title I Sites List. Ask your principal or the Title I office for this year’s numbers."}, "watch": [["Calling Title I a “free lunch program.”", "Title I is about extra academic help. Lunch eligibility is used to count poverty, not to decide who gets help."], ["Saying Title I means a school is failing.", "Title I is based on poverty, not performance. Identification for improvement (CSI, ATS, TSI) is a separate process."], ["Treating Title I as the principal’s private budget.", "Families and staff help decide how it’s used, through the needs assessment and plan."]], "practice": [{"type": "scenario", "q": "Back to the front desk. The grandmother asks, “Does Title I mean my grandson is in trouble?” What’s the best answer?", "opts": [["“No. It means our school gets extra federal money to give scholars more help, and families get a say in how we use it.”", 1, "Exactly. Short, warm and accurate, and it invites her in."], ["“It means the school is low-performing, so we get extra money.”", 0, "Title I is based on poverty, not performance. This answer also makes the school sound like it’s failing."], ["“It’s a free lunch thing. You can ask the cafeteria.”", 0, "Lunch counts are used to measure poverty, but Title I is about extra academic help and family partnership."]]}, {"type": "order", "q": "Put Title I money’s path in order, from Washington to a GRPS scholar.", "items": ["Congress funds Title I, Part A", "The U.S. Department of Education allocates Title I to Michigan", "MDE calculates each district’s allocation", "GRPS reserves the required set-asides", "GRPS gives each Title I school its share by poverty rank", "The school plans how to use it, with families, in the needs assessment and plan", "Scholars get the extra help in the plan"]}, {"type": "sort", "q": "Fact or myth? Tap the right answer for each statement.", "buckets": ["Fact", "Myth"], "items": [["Title I money is based mostly on the number of children from low-income families.", 0, "Allocations follow poverty counts."], ["Only scholars who get free lunch can be helped with Title I.", 1, "In a schoolwide program every scholar can benefit. In targeted assistance, scholars are chosen by academic need, not income."], ["Families have the right to ask about their child’s teacher’s qualifications.", 0, "Section 1112(e) gives families this right, and schools must tell them about it."], ["Title I schools are schools that are failing.", 1, "Title I is about poverty. Improvement identification is a different system."], ["Some Title I money must be used for parent and family engagement.", 0, "Districts receiving more than $500,000 reserve at least 1% for family engagement, and most of it goes to schools."], ["The principal can spend Title I on anything the school needs.", 1, "Spending must follow the plan, federal cost rules and district approval."]]}, {"type": "respond", "q": "At Open House a parent asks, “What does Title I actually do for my daughter?” Write what you would say, in 2–4 sentences.", "respond": {"model": "“Our school gets extra federal money because many families in our neighborhood have lower incomes. We use it for things like extra small-group reading help and after-school tutoring. You also have a say: you’re invited to our Title I meeting, you help shape our school-parent compact, and you can ask about your daughter’s teachers’ qualifications any time.”", "look": ["Plain language, no acronyms", "Names something real Title I pays for at the school", "Invites the parent to take part", "Short enough to say in 30 seconds"]}}], "doit": {"text": "Open the toolkit home page and find your school on <b>Title I at a glance<\/b>. Write down two things: your program type (schoolwide or targeted) and whether you are a Partnership School.", "tool": ["Title I at a glance", "../glance/"], "tasks": ["Find your school", "Note your program type", "Note any Partnership designation"]}, "quiz": [["What is Title I, Part A mainly for?", ["Building repairs in high-poverty schools", "Extra help so scholars in high-poverty schools can meet challenging standards", "School lunch"], 1, "Title I adds academic support in schools with high concentrations of poverty."], ["How does GRPS decide which schools get Title I first?", ["By test scores, lowest first", "By poverty rank, highest first", "By enrollment, largest first"], 1, "Districts rank schools by poverty and serve the highest-poverty schools first (Section 1113)."], ["Which is something the district sets aside before schools get their share?", ["Parent and family engagement", "Athletics", "Building maintenance"], 0, "Family engagement is a required reservation for districts over $500,000. Homeless services and equitable services are others."], ["A parent asks about her child’s teacher’s qualifications. What’s right?", ["That is private", "She has the right to ask, and the school must answer", "Only the district can answer"], 1, "The parents’ right-to-know provision is Section 1112(e)."], ["Being a Title I school means:", ["The school is low-performing", "The school has a high share of children from low-income families", "The school is in its first year"], 1, "Title I eligibility is about poverty, not performance."]], "reflect": {"prompt": "How would you explain Title I to a family at your school in two sentences?", "plan": "What is one place you’ll use that explanation this month?"}, "facil": {"mins": 30, "open": "Ask the team: “If a family asked what the Title I sign means, what would you say?” Collect a few answers.", "discuss": ["Which myth have you heard most at our school?", "Who on our staff talks to families first, and do they have a clear answer?", "Where could we post a short explanation (newsletter, front office, website)?"], "act": "In pairs, write a two-sentence explanation for families. Pick one as a team and share it with support staff and the front office.", "close": "Everyone does the Fact or myth sort; compare results."}, "res": [["MDE: Title I, Part A", "https://www.michigan.gov/mde/services/school-performance-supports/educational-supports/programs/title-i-part-a-improving-basic-programs"], ["ESSA Title I, Part A text", "https://oese.ed.gov/offices/office-of-formula-grants/school-support-and-accountability/essa-legislation-table-contents/title-i-part-a/"]], "confirm": ["This year’s GRPS Title I allocation and Sites List link"], "video": [["💡", "Title I in 60 seconds", "The largest federal program in K–12 education, here at GRPS."], ["🏛️", "Money follows poverty", "Washington sends Title I to Michigan. MDE sends it to districts, mostly based on how many children come from low-income families."], ["🏫", "GRPS serves the highest-poverty schools first", "After required set-asides, each Title I school gets its share by poverty rank."], ["📚", "It pays for extra help", "Interventionists, tutoring, extra learning time, professional learning and family engagement."], ["🤝", "Families have a voice", "The annual meeting, the compact, the parent policy, and the right to ask about teacher qualifications."], ["✅", "Your turn", "Next: decide what to say to a family, put the money’s path in order, and sort fact from myth."]], "sub": "Where the money comes from, who it serves, and families’ rights", "roles": ["Principal", "Support staff", "Teacher", "Office staff"]}, {"id": 2, "s": "found", "t": "Schoolwide and targeted programs", "mins": 30, "goal": "Tell a schoolwide program from a targeted assistance program, and know what each one requires of your school.", "can": ["I can explain the difference between schoolwide and targeted assistance.", "I can name what a schoolwide plan must include.", "I can describe who a targeted assistance program serves."], "why": {"story": "A teacher moves from a schoolwide GRPS school to a targeted assistance school. On day one she plans small groups for every scholar below benchmark, using the Title I interventionist. Her new principal stops her: “Only identified scholars can get that help here.”", "p": ["The two models change who Title I can serve and what records your school keeps. Mixing them up is one of the most common Title I findings."]}, "rule": {"p": ["Section 1114 covers schoolwide programs; Section 1115 covers targeted assistance."], "points": [["Schoolwide (Section 1114)", "Allowed when at least 40% of scholars are from low-income families (or with a state waiver). Title I can upgrade the whole school’s program and serve every scholar. The school must have a plan based on a comprehensive needs assessment, built with families and staff, reviewed every year and revised as needed."], ["What the schoolwide plan must do", "Give every scholar a chance to meet standards, strengthen the academic program (more learning time, a well-rounded education), and address the needs of scholars at risk of not meeting standards, using strategies grounded in evidence."], ["Targeted assistance (Section 1115)", "Title I serves only scholars identified as failing, or most at risk of failing, to meet standards. They are chosen with multiple, educationally related, objective criteria. Some scholars are eligible automatically, such as those experiencing homelessness."], ["Targeted assistance must also", "Use effective methods that add to the regular program, give primary consideration to extra learning time (before and after school, summer), keep pulling scholars out of class to a minimum, review progress and revise, and keep records of who is served."]], "cites": [["ESSA Sections 1114 and 1115", "https://oese.ed.gov/offices/office-of-formula-grants/school-support-and-accountability/essa-legislation-table-contents/title-i-part-a/"], ["MDE: Title I, Part A", "https://www.michigan.gov/mde/services/school-performance-supports/educational-supports/programs/title-i-part-a-improving-basic-programs"]]}, "grps": {"intro": "At GRPS:", "steps": [["Most schools are schoolwide", "39 of GRPS’s 42 Title I schools run schoolwide programs; 3 run targeted assistance."], ["Schoolwide plan", "The Comprehensive Needs Assessment and your plan are the schoolwide plan’s backbone. Update them every year."], ["Targeted assistance lists", "Targeted assistance schools keep a list of identified scholars, the criteria used, and progress after each MAP window."], ["Know your model", "The Title I Program Requirements Guide shows the requirements for your school’s model."]], "note": ""}, "watch": [["In a targeted assistance school, using Title I staff for scholars who weren’t identified.", "Serve only identified scholars with Title I resources; serve others with general funds."], ["Treating the schoolwide plan as a once-a-year document.", "Review it during the year and revise it when the data says to."], ["Identifying scholars by teacher opinion alone.", "Use multiple, objective, educationally related criteria, written down."]], "practice": [{"type": "sort", "q": "Schoolwide, targeted assistance, or both? Tap the right answer for each.", "buckets": ["Schoolwide", "Targeted", "Both"], "items": [["Title I can pay for a reading coach who works with every teacher.", 0, "Schoolwide programs can upgrade the whole school."], ["Scholars are identified with multiple, objective, educationally related criteria.", 1, "Section 1115 requires this for targeted assistance."], ["Families must be involved in planning how Title I is used.", 2, "Family involvement applies to every Title I school (Section 1116)."], ["The school needs at least 40% low-income scholars (or a waiver).", 0, "That’s the schoolwide eligibility rule."], ["Federal, state and local funds can be consolidated to run the program.", 0, "Consolidation is a schoolwide flexibility."], ["The school must hold an annual Title I meeting.", 2, "Every Title I school holds one."]]}, {"type": "order", "q": "Put a schoolwide program’s yearly cycle in order.", "items": ["Confirm the school is eligible (40% or more low-income, or a waiver)", "Build a team with staff and families", "Do the comprehensive needs assessment", "Write the plan’s strategies and measures", "Carry out the plan", "Check measures during the year", "Review the plan with families and revise it for next year"]}, {"type": "scenario", "q": "You’re at one of GRPS’s targeted assistance schools. A scholar who wasn’t identified is struggling in math, and the Title I interventionist has an open seat. What should you do?", "opts": [["Add him to the Title I group right away.", 0, "In targeted assistance, Title I resources serve identified scholars only."], ["Check him against the identification criteria. If he qualifies, identify him; if not, support him with general resources.", 1, "Right. Use the criteria, and document the decision either way."], ["Wait until next year’s identification.", 0, "Identification can be reviewed during the year, for example after each MAP window. Don’t wait if the data shows need."]]}, {"type": "respond", "q": "You work in one of GRPS’s targeted assistance schools. A new teacher asks, “Why can’t the Title I interventionist just help my whole class?” Write your answer.", "respond": {"model": "“We’re a targeted assistance school, so Title I can only serve scholars who were identified using our criteria, like their MAP percentile. If someone in your class is struggling and isn’t on the list, let’s check them against the criteria after the next MAP window. If they qualify, they can be added. If not, we’ll find other support.”", "look": ["Names the model (targeted assistance)", "Explains that only identified scholars are served", "Offers a path for other struggling scholars", "Points to the criteria, not opinion"]}}], "doit": {"text": "Open the <b>Title I Program Requirements Guide<\/b>, choose your school, and read the requirements for your model. Note one requirement you’re not sure your school meets.", "tool": ["Title I Program Requirements Guide", "../program/"], "tasks": ["Choose your school", "Read your model’s requirements", "Note one to check"]}, "quiz": [["A school can run a schoolwide program when:", ["At least 40% of scholars are from low-income families, or it has a waiver", "It is identified for CSI", "The principal requests it"], 0, "Section 1114 sets the 40% threshold."], ["In a targeted assistance school, Title I serves:", ["Every scholar", "Scholars identified by multiple, objective criteria", "Scholars who get free lunch"], 1, "Section 1115 requires identification on educational criteria, not income."], ["Which must a schoolwide plan be based on?", ["A comprehensive needs assessment", "The previous principal’s plan", "State test scores only"], 0, "The schoolwide plan grows out of the needs assessment."], ["How often should a schoolwide plan be reviewed?", ["Every five years", "Every year, and revised as needed", "Only when the school is identified"], 1, "The plan is reviewed annually."], ["Which scholars are automatically eligible for targeted assistance?", ["Scholars experiencing homelessness", "Scholars in gifted programs", "Scholars new to the district"], 0, "Section 1115 makes homeless children eligible, among others."]], "reflect": {"prompt": "What is one way your school’s model (schoolwide or targeted) should shape how you plan extra help?", "plan": "Who will you check this with?"}, "facil": {"mins": 35, "open": "Show the team your school’s model on Title I at a glance. Ask: “What does this let us do, and what does it ask of us?”", "discuss": ["Where do we use Title I to lift the whole school (schoolwide) or serve identified scholars (targeted)?", "Do our records match our model?", "When did we last review the plan?"], "act": "Do the sort as a team, then list two places your practice should change.", "close": "Agree on a date to review the plan mid-year."}, "res": [["ESSA Sections 1114 and 1115", "https://oese.ed.gov/offices/office-of-formula-grants/school-support-and-accountability/essa-legislation-table-contents/title-i-part-a/"], ["MDE: Title I, Part A", "https://www.michigan.gov/mde/services/school-performance-supports/educational-supports/programs/title-i-part-a-improving-basic-programs"]], "confirm": ["Count of schoolwide and targeted assistance schools for this year", "GRPS targeted assistance identification criteria"], "video": [["🧭", "Two ways to run Title I", "Schoolwide and targeted assistance change who Title I can serve."], ["🏫", "Schoolwide", "At least 40% low-income scholars. Title I can lift the whole school, with a plan built from the needs assessment."], ["🎯", "Targeted assistance", "Title I serves only scholars identified with multiple, objective, educationally related criteria."], ["📋", "Both", "Family engagement, an annual meeting, a compact and a parent policy in every Title I school."], ["📊", "At GRPS", "39 schools are schoolwide and 3 are targeted assistance."], ["✅", "Your turn", "Sort the features, put the schoolwide cycle in order, and answer a teacher’s question."]], "sub": "Two ways to run Title I, and what each requires", "roles": ["Principal", "Teacher"]}, {"id": 3, "s": "found", "t": "Supplement, not supplant", "mins": 30, "goal": "Decide whether a cost fits Title I, explain why, and know when to ask the Title I office first.", "can": ["I can explain what supplement, not supplant means.", "I can use four questions to check a Title I cost.", "I can spot costs that need the Title I office’s approval."], "why": {"story": "It’s spring at <b>GRPS Sample School<\/b>. There’s $40,000 left in the Title I budget. Someone suggests replacing the school’s core math books. Someone else suggests a summer reading program for scholars below benchmark.", "p": ["Title I is meant to add to what scholars already get. When it replaces money the district would spend anyway, the district can be asked to pay it back, and scholars lose the extra help the law promised them.", "Getting this right protects your school’s budget and keeps the focus on scholars who need more."]}, "rule": {"p": ["Under ESSA, the district shows it meets supplement, not supplant by how it hands out state and local money: each Title I school must get all the state and local money it would get if it had no Title I. Federal cost rules still apply to every purchase."], "points": [["Section 1118(b)", "Title I adds to state and local funds; it does not replace them. The district proves this with a fair method for giving state and local money to schools."], ["Cost rules (2 CFR 200)", "Every Title I cost must be allowable, reasonable, necessary for the program, and charged to the right program."], ["Tied to the plan", "School costs should address a need in your needs assessment and a strategy in your plan."], ["Documented", "Keep the request, the approval and proof of what happened (agenda, invoice, sign-in, and time and effort records such as Personnel Activity Reports for staff)."]], "cites": [["ESSA Section 1118(b)", "https://oese.ed.gov/offices/office-of-formula-grants/school-support-and-accountability/essa-legislation-table-contents/title-i-part-a/"], ["U.S. Dept. of Education: Supplement not supplant guidance (2019)", "https://oese.ed.gov/files/2020/02/snsfinalguidance06192019.pdf"], ["Federal cost rules (2 CFR 200)", "https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200"]]}, "grps": {"intro": "Four questions before you spend Title I:", "steps": [["1 · Need", "Which need in our needs assessment does this address?"], ["2 · Extra", "Is this something every GRPS school already gets from general funds? If so, Title I can’t pay for it."], ["3 · Reasonable", "Is the cost reasonable and necessary for the program, and is there a plan to use it?"], ["4 · Approved and documented", "Did we submit the Title I rationale form and get prior approval, and will we keep the proof?"]], "note": "GRPS food limits for family engagement events (Title I Handbook p. 14, updated amounts): a snack up to <b>$5 per person<\/b> for events of one hour or less; a meal up to <b>$15 per person<\/b> for events longer than one hour. The per-person rate covers food, supplies and materials. Raffles, gift cards and honor roll are not allowable. The Handbook (p. 7) also lists as <b>not allowable<\/b>: athletic equipment, office supplies, fundraisers and employee rewards. Parent event requests go to TitleIParentEvent@grps.org. When in doubt, ask the Title I office before you buy."}, "watch": [["Paying for what every school gets, like core curriculum.", "Title I adds extra help on top of the core program."], ["Buying for all schools, then charging only Title I schools.", "If every school gets it, general funds pay for it everywhere."], ["Food over the GRPS limits, or raffles and gift cards.", "Snack up to $5 per person (one hour or less), meal up to $15 (longer), with prior approval. Raffles and gift cards aren’t allowed."], ["Spending to “use it up” in spring.", "Spend on what the plan needs. Talk to the Title I office about timing."]], "practice": [{"type": "scenario", "q": "Back to the $40,000. Which is the better use of Title I?", "opts": [["Replace the core math books.", 0, "Core curriculum is what every school gets from general funds. Paying for it with Title I supplants."], ["A summer reading program for scholars below benchmark, tied to the plan’s reading goal.", 1, "Right. It adds learning time beyond what the district provides and ties to a need in the plan."], ["Split it between both.", 0, "The core math books still supplant, even as part of a split."]]}, {"type": "order", "q": "Put the steps for a Title I purchase in order.", "items": ["Name the need in the needs assessment", "Tie it to a strategy in the plan", "Check the four questions", "Submit the rationale form for prior approval", "Buy through ePurchase or a Payment Request Form", "Receive it, label it and use it as planned", "Keep the proof: approval, invoice, sign-ins or agenda"]}, {"type": "sort", "q": "Likely fits, doesn’t fit, or ask the Title I office first?", "buckets": ["Likely fits", "Doesn’t fit", "Ask first"], "items": [["A reading interventionist for extra small-group help, tied to the plan’s reading goal", 0, "Extra help tied to a need in the plan."], ["The core reading program every GRPS school uses", 1, "General funds provide this everywhere."], ["A field trip for fun with no link to learning goals", 1, "Not necessary for the program’s purpose."], ["Cookies and juice at a one-hour family math night, $4 per person, with prior approval", 0, "Within the GRPS snack limit of $5 per person for events of one hour or less."], ["A $20-per-person dinner at a two-hour family night", 1, "Over the GRPS meal limit of $15 per person."], ["Gift cards or a raffle to encourage attendance", 1, "GRPS: raffles and gift cards are not allowable."], ["A new family event you’re not sure ties to your needs assessment", 2, "Check the tie to your plan with the Title I office before you request it."], ["Professional learning for teachers on small-group reading", 0, "Builds staff skill for a plan strategy."], ["Office supplies for the main office", 1, "The GRPS Handbook lists office supplies as not allowable."], ["Rewards or gifts for staff", 1, "The GRPS Handbook lists employee rewards as not allowable."], ["Summer learning for scholars below benchmark", 0, "Extra learning time tied to a need."]]}, {"type": "scenario", "q": "Your school plans a 90-minute family literacy night for about 40 families. What food can Title I pay for?", "opts": [["A meal up to $15 per person, approved ahead with the Title I rationale form, ordered for a realistic count.", 1, "Right. Over one hour, GRPS allows a meal up to $15 per person. The per-person rate includes supplies and materials, and don’t over-order."], ["Snacks only, up to $5 per person, because Title I never pays for meals.", 0, "Meals are allowed for events longer than one hour, up to $15 per person."], ["Pizza at $18 per person, since it’s a long event.", 0, "That’s over the GRPS meal limit of $15 per person."]]}, {"type": "respond", "q": "A colleague says, “Let’s raffle off gift cards with Title I money to boost attendance at family nights.” Write what you’d say back.", "respond": {"model": "“Good goal, but raffles and gift cards aren’t allowed under Title I at GRPS. What we can do is make the night easier to come to: pick a time families ask for, offer child care and interpreters, and serve a snack up to $5 a person if it’s an hour or less. Let’s tie it to our plan’s attendance or reading goal and send the rationale form for approval.”", "look": ["Says clearly that raffles and gift cards aren’t allowed", "Keeps the goal (more families)", "Offers allowed alternatives", "Mentions prior approval or the plan"]}}], "doit": {"text": "Open the <b>GRPS Sample School<\/b> plan in the Comprehensive Needs Assessment. Run its two strategies through the four questions. Then do the same for one Title I purchase at your school.", "tool": ["Comprehensive Needs Assessment", "../cna/?sample=1"], "tasks": ["Open the sample plan", "Check two strategies", "Check one purchase at your school"]}, "quiz": [["Under ESSA, how does the district mainly show it meets supplement, not supplant?", ["Each purchase has a form", "It gives state and local money to schools with a method that doesn’t take Title I into account", "Title I schools spend all their money by June"], 1, "Section 1118(b)(2) focuses on the district’s method for state and local funds."], ["Which is most likely to supplant?", ["After-school tutoring the district doesn’t fund anywhere", "The core curriculum every school gets", "A family reading night"], 1, "Core curriculum is funded with general money everywhere."], ["Which four words describe a cost that meets federal cost rules?", ["Cheap, fast, local, popular", "Allowable, reasonable, necessary, allocable", "New, shiny, durable, approved"], 1, "These come from 2 CFR 200."], ["A family engagement event runs two hours. What’s the most GRPS allows for a meal, per person?", ["$5", "$15", "$25"], 1, "Over one hour: a meal up to $15 per person (one hour or less: a snack up to $5). Prior approval is still required."], ["A Title I-paid staff member’s time and effort records should show:", ["Their schedule as planned", "What they actually did", "Only their name"], 1, "Records must reflect actual work."]], "reflect": {"prompt": "What is one Title I purchase or position at your school you’d want to double-check?", "plan": "What question will you ask, and who will you ask?"}, "facil": {"mins": 35, "open": "Read the $40,000 scenario aloud. Ask everyone to vote before discussing.", "discuss": ["What did we buy with Title I last year that every school gets anyway?", "Which of our costs would be hardest to explain to a reviewer?", "Where do our time and effort records match reality, and where don’t they?"], "act": "Do the sort in small groups, then compare. Discuss the “Ask first” items.", "close": "Name one purchase to check with the Title I office."}, "res": [["GRPS Title I Handbook (2022), pp. 6–7 and 14", "https://drive.google.com/file/d/114wsrM373kUmgkzSOmvaF8G16a--uXuy/view"], ["Supplement not supplant guidance (2019)", "https://oese.ed.gov/files/2020/02/snsfinalguidance06192019.pdf"], ["2 CFR 200 cost principles", "https://www.ecfr.gov/current/title-2/subtitle-A/chapter-II/part-200"], ["ESSA Section 1118", "https://oese.ed.gov/offices/office-of-formula-grants/school-support-and-accountability/essa-legislation-table-contents/title-i-part-a/"]], "confirm": ["Title I Handbook p. 14 still shows $4 and $9; the Academy uses the new $5 and $15", "A recent GRPS example (no names) to use in Why it matters"], "video": [["🧾", "Supplement, not supplant", "Title I adds to what scholars already get. It never replaces it."], ["⚖️", "The district’s part", "GRPS hands out state and local money fairly first, then Title I comes on top."], ["❓", "Your four questions", "Which need does it meet? Is it extra? Is it reasonable? Is it approved and documented?"], ["🍎", "Food at family events", "A snack up to $5 per person for an hour or less. A meal up to $15 for longer events."], ["🚫", "Never allowed", "Gift cards, raffles, honor roll, office supplies, fundraisers and staff rewards."], ["✅", "Your turn", "Decide on real purchases, put the buying steps in order, and coach a colleague."]], "sub": "What Title I can and can’t pay for", "roles": ["Principal"]}, {"id": 4, "s": "plan", "t": "The Comprehensive Needs Assessment", "mins": 40, "goal": "Use four types of data to find your school’s biggest needs, and write a clear need statement.", "can": ["I can name the four types of data in a needs assessment.", "I can find a pattern or gap in school data.", "I can write a need statement backed by data."], "why": {"story": "The <b>GRPS Sample School<\/b> team meets in September. Someone says, “We already know our problem: reading.” The data shows something they didn’t expect.", "p": ["A needs assessment keeps a school from spending a year solving the wrong problem. It is the first step of every Title I plan, and in a schoolwide program it is required.", "Looking at all four types of data, with families at the table, turns hunches into evidence."]}, "rule": {"p": ["A schoolwide plan must be based on a comprehensive needs assessment of the whole school, looking at academic achievement against state standards, especially for scholars at risk (Section 1114(b)(6)). Partnership Schools also use it to address identified groups and resource inequities."], "points": [["Demographic", "Who are our scholars? Enrollment, groups, attendance, mobility."], ["Achievement", "How are they doing? NWEA MAP, M-STEP, grades, graduation."], ["Process", "What are adults doing? Instruction, MTSS, PBIS, schedules, family engagement."], ["Perception", "What do people think? Surveys and focus groups of scholars, families and staff."]], "cites": [["ESSA Section 1114(b)", "https://oese.ed.gov/offices/office-of-formula-grants/school-support-and-accountability/essa-legislation-table-contents/title-i-part-a/"], ["MDE: Title I, Part A", "https://www.michigan.gov/mde/services/school-performance-supports/educational-supports/programs/title-i-part-a-improving-basic-programs"]]}, "grps": {"intro": "The GRPS process:", "steps": [["1 · Build the team", "Include teachers, support staff and caregivers, not just administrators."], ["2 · Look at all four", "Use the data already loaded for your school in the Comprehensive Needs Assessment."], ["3 · Find patterns", "Compare groups and grades with the whole school. Look for the biggest gaps."], ["4 · Name needs", "Write need statements with numbers, then choose one priority (two for Partnership Schools)."]], "note": "Your school’s attendance and test data load automatically in the tool."}, "watch": [["Deciding the problem before looking at the data.", "Look at all four types first, then decide."], ["Using only test scores.", "Process and perception data explain why the numbers look the way they do."], ["Need statements without numbers.", "“Attendance is low” becomes “41% of scholars with disabilities were chronically absent in MP1.”"]], "practice": [{"type": "sort", "q": "Which type of data is this?", "buckets": ["Demographic", "Achievement", "Process", "Perception"], "items": [["Enrollment by grade", 0, "Who our scholars are."], ["NWEA MAP reading: % meeting benchmark", 1, "How scholars are doing."], ["How many teachers use the small-group schedule", 2, "What adults are doing."], ["Spring caregiver survey results", 3, "What people think."], ["Chronic absence by scholar group", 0, "Attendance is demographic data in this framework."], ["Office referrals by location and time", 2, "Shows how a system (PBIS) is working."], ["M-STEP proficiency", 1, "An achievement measure."], ["Scholar focus group: “Do you feel welcome here?”", 3, "Perception."]]}, {"type": "order", "q": "Put the needs assessment steps in order.", "items": ["Build the team, including caregivers", "Gather all four types of data", "Look for patterns and gaps by group and grade", "Check what families, scholars and staff say", "Write need statements with numbers", "Choose the priority (two for Partnership Schools)"]}, {"type": "lab", "lab": "chronic", "q": "Data lab: GRPS Sample School, chronic absence in Marking Period 1"}, {"type": "build", "q": "Write a need statement for GRPS Sample School using the data lab.", "key": "need4", "fields": [["Need statement", "In MP1, __% of ____ were chronically absent, compared with __% of all scholars."]], "rubric": ["Names a group or grade", "Uses a number for the group", "Compares to all scholars", "Describes a need, not a solution"]}, {"type": "respond", "q": "At the first team meeting, someone says, “We already know reading is our problem. Let’s skip the data and pick a program.” Write how you’d respond.", "respond": {"model": "“Reading may well be it, but let’s spend 20 minutes on the data first so we don’t miss something. Last year the sample school found its biggest attendance gap was in kindergarten, which nobody expected. If reading still comes out on top, we’ll have numbers to show families and our CAIL why we chose it.”", "look": ["Respectful of the colleague", "Gives a reason to look at data first", "Keeps it quick and practical", "Connects data to explaining the choice"]}}], "doit": {"text": "Open the <b>Comprehensive Needs Assessment<\/b> for your school. Complete the attendance topic and write one need statement in the tool.", "tool": ["Comprehensive Needs Assessment", "../cna/"], "tasks": ["Open your school", "Review attendance by group", "Write one need statement"]}, "quiz": [["Which data tells you what adults are doing, like how MTSS is working?", ["Demographic", "Process", "Perception"], 1, "Process data describes systems and practices."], ["A schoolwide plan must be based on:", ["A comprehensive needs assessment", "The district strategic plan only", "Last year’s budget"], 0, "Section 1114(b)(6)."], ["Who should be on the needs assessment team?", ["Administrators only", "Staff and caregivers", "The Title I office only"], 1, "Families and staff help develop the plan."], ["Which is the strongest need statement?", ["Attendance is a problem.", "41% of scholars with disabilities were chronically absent in MP1, compared with 32% of all scholars.", "We need an attendance incentive program."], 1, "It names a group, uses numbers and compares. The third is a solution, not a need."], ["A Partnership School chooses how many priorities?", ["One", "Up to two", "Five"], 1, "GRPS: one priority, or two for Partnership Schools."]], "reflect": {"prompt": "What did the data show that you didn’t expect, at the sample school or your own?", "plan": "What data will you bring to your school’s next team meeting?"}, "facil": {"mins": 45, "open": "Before showing data, ask everyone to write what they think the school’s biggest need is. Collect them.", "discuss": ["What did the data confirm? What surprised us?", "Whose voice is missing from our data?", "Which group has the biggest gap?"], "act": "Do the data lab together on a screen. Then write need statements in pairs and compare.", "close": "Compare the final need statements with the guesses from the start."}, "res": [["ESSA Section 1114(b)", "https://oese.ed.gov/offices/office-of-formula-grants/school-support-and-accountability/essa-legislation-table-contents/title-i-part-a/"], ["MDE: Title I, Part A", "https://www.michigan.gov/mde/services/school-performance-supports/educational-supports/programs/title-i-part-a-improving-basic-programs"]], "confirm": ["Due dates for this year’s needs assessment"], "video": [["🔍", "The needs assessment", "Every Title I plan starts by looking hard at the data."], ["👥", "Who", "Teachers, support staff and caregivers, not just administrators."], ["🗂️", "Four types of data", "Demographic, achievement, process and perception."], ["📉", "Find the gaps", "Compare groups and grades with the whole school."], ["✍️", "Name the need", "With a number: “41% of scholars with disabilities were chronically absent in MP1.”"], ["✅", "Your turn", "Work with GRPS Sample School’s real data and write a need statement."]], "sub": "Four types of data, patterns and need statements", "roles": ["Principal", "Support staff", "Teacher"]}, {"id": 5, "s": "plan", "t": "A plan that works", "mins": 35, "goal": "Turn a need into a root cause, an If/Then/So That plan, and measures you can check during the year.", "can": ["I can find a root cause that adults can change.", "I can write an If/Then/So That statement.", "I can choose leading and lagging measures."], "why": {"story": "Last year <b>GRPS Sample School<\/b> bought an attendance incentive program. By May, chronic absence hadn’t moved. Nobody had asked why scholars were missing school.", "p": ["Plans fail when they jump from a need straight to a purchase. A root cause, a clear theory of action and measures checked each marking period are what make a plan work."]}, "rule": {"p": ["A schoolwide plan must use strategies based on evidence and be reviewed and revised based on results. Partnership School plans must include evidence-based interventions (Sections 1111(d) and 1114(b))."], "points": [["Root cause", "Something within the school’s control that explains the need. Ask “why?” until you reach an adult practice."], ["Evidence-based strategy", "ESSA defines four tiers of evidence. Strong, moderate or promising evidence is required for Partnership School plans."], ["If/Then/So That", "If adults do X, then scholars will Y, so that the goal Z is met."], ["Leading and lagging measures", "Leading measures change quickly and show whether the plan is happening. Lagging measures are the end results."]], "cites": [["ESSA Sections 1111(d), 1114(b) and 8101(21)", "https://oese.ed.gov/offices/office-of-formula-grants/school-support-and-accountability/essa-legislation-table-contents/title-i-part-a/"]]}, "grps": {"intro": "At GRPS:", "steps": [["1 · Root cause", "Use the “5 whys” with your team."], ["2 · Strategy", "Pick a strategy with evidence and a clear owner."], ["3 · If/Then/So That", "The CNA tool walks you through it."], ["4 · Check each marking period", "Compare your measures to where you started and your goal."], ["5 · Mid-year review", "GRPS reviews each program’s use of resources mid-year, with the budget cycle, using a logic model: inputs, activities, outputs and outcomes (at least three outcomes, one tied to a district strategic goal)."]], "note": "Your plan carries into the compact, the annual meeting and the at-a-glance page. Source: GRPS Title I Handbook, pp. 38–41."}, "watch": [["A root cause outside the school’s control (“families don’t care”).", "Look for what adults can change: routines, outreach, schedules."], ["A strategy with no owner or dates.", "Name who does what by when."], ["Only lagging measures.", "Add a measure you can check monthly."]], "practice": [{"type": "scenario", "q": "GRPS Sample School’s need: 41% of scholars with disabilities are chronically absent. Which root cause is most useful for planning?", "opts": [["Families of scholars with disabilities don’t value school.", 0, "This blames families and isn’t something the school controls."], ["We don’t reach out early when a scholar with an IEP starts missing days, and absence isn’t part of IEP meetings.", 1, "Right. This is an adult practice the school can change."], ["Scholars with disabilities get sick more.", 0, "This may be true for some, but it doesn’t point to an action the school can take."]]}, {"type": "order", "q": "Put the planning steps in order.", "items": ["Start from the need statement", "Find the root cause with the 5 whys", "Choose an evidence-based strategy with an owner", "Write the If/Then/So That", "Set leading and lagging measures", "Carry out the plan", "Check measures each marking period and adjust"]}, {"type": "sort", "q": "Leading or lagging measure?", "buckets": ["Leading", "Lagging"], "items": [["% of absent scholars contacted within 2 days", 0, "Shows if the plan is happening, weekly."], ["Chronic absence rate at the end of the year", 1, "An end result."], ["Number of IEP meetings that include an attendance plan", 0, "Tracks adult action."], ["M-STEP reading proficiency", 1, "End result, once a year."], ["MAP growth after the winter window", 1, "A mid-year result; still a result of the plan."], ["% of small groups held as scheduled", 0, "Tracks whether the strategy happens."]]}, {"type": "build", "q": "Write an If/Then/So That for GRPS Sample School (or your school).", "key": "itt5", "fields": [["If (adults will…)", "If support staff call families of scholars with IEPs within two days of a second absence…"], ["Then (scholars will…)", "then scholars with disabilities will attend more often…"], ["So that (goal with a number)", "so that chronic absence for scholars with disabilities drops from 41% to 30% by June."], ["Leading measure", "% of second absences with a call within two days, checked weekly"]], "rubric": ["“If” names an adult action", "“Then” names a change in scholars", "“So that” has a goal with a number and date", "The leading measure can be checked at least monthly"]}, {"type": "respond", "q": "A school’s goal reads: “Improve attendance.” Write feedback to help the team make it stronger.", "respond": {"model": "“Love the focus. To make it a goal we can check, add who, how much and by when, for example: ‘Cut chronic absence for scholars with disabilities from 41% to 30% by June.’ Then add a leading measure we can watch monthly, like the share of second absences followed by a call within two days.”", "look": ["Starts with something positive", "Asks for a group, a number and a date", "Gives a rewritten example", "Adds a leading measure"]}}], "doit": {"text": "In the <b>Comprehensive Needs Assessment<\/b>, open your plan and write or revise your If/Then/So That and measures.", "tool": ["Comprehensive Needs Assessment", "../cna/"], "tasks": ["Open your plan", "Write If/Then/So That", "Add a leading measure"]}, "quiz": [["A good root cause is:", ["Outside the school’s control", "Something adults at the school can change", "The same as the need"], 1, "Root causes point to action."], ["In If/Then/So That, the “If” describes:", ["What adults will do", "The goal", "The test score"], 0, "The If is the adult action."], ["Which is a leading measure?", ["End-of-year M-STEP results", "% of teachers using the new small-group schedule each week", "Graduation rate"], 1, "It changes quickly and tracks the plan."], ["Partnership School plans must include:", ["Evidence-based interventions", "A new curriculum", "Incentive programs"], 0, "Section 1111(d)."], ["How often should a GRPS team check plan measures?", ["Once in June", "At least each marking period", "Every five years"], 1, "Check and adjust during the year."]], "reflect": {"prompt": "What is the root cause behind your school’s top need, stated as something adults can change?", "plan": "What will you check after the next marking period?"}, "facil": {"mins": 40, "open": "Put the need on the board. Run the “5 whys” as a team.", "discuss": ["Which causes are in our control?", "Do we have evidence our strategy works?", "What would we see in a month if the plan is happening?"], "act": "Each pair writes an If/Then/So That; the team picks the strongest using the rubric.", "close": "Set the date for the next measure check."}, "res": [["ESSA Section 8101(21): evidence-based", "https://oese.ed.gov/offices/office-of-formula-grants/school-support-and-accountability/essa-legislation-table-contents/title-i-part-a/"]], "confirm": ["GRPS evidence-based strategy list or menu, if there is one"], "video": [["🧩", "A plan that works", "Plans fail when they jump from a need straight to a purchase."], ["❓", "Ask why", "Keep asking “why?” until you reach something adults can change."], ["🔬", "Choose a strategy with evidence", "Partnership School plans need evidence-based interventions."], ["➡️", "If / Then / So that", "If adults do X, then scholars will Y, so that we reach Z."], ["📈", "Measure along the way", "A leading measure every month; a lagging measure at the end."], ["✅", "Your turn", "Find the root cause, order the planning steps, and write your own If/Then/So That."]], "sub": "Root causes, If/Then/So That and measures", "roles": ["Principal"]}, {"id": 6, "s": "plan", "t": "Partnership Schools and the School Index", "mins": 30, "goal": "Explain CSI, ATS and TSI, find your identified groups, and make sure your plan addresses them.", "can": ["I can explain the difference between CSI, ATS and TSI.", "I can find my school’s identified groups.", "I can check that our plan addresses them."], "why": {"story": "<b>GRPS Sample School<\/b> is identified for ATS because two groups, Black scholars and scholars with disabilities, perform at the level of the state’s lowest schools. The team’s plan only talks about “all scholars.”", "p": ["Partnership Schools must show that their plan addresses the groups the state identified. A plan for “all scholars” can miss them completely."]}, "rule": {"p": ["Michigan uses the Michigan School Index System to identify schools for support under ESSA Section 1111(d). GRPS calls these schools Partnership Schools."], "points": [["CSI: Comprehensive Support and Improvement", "The lowest-performing schools overall, or high schools with low graduation rates. The plan must be based on a school-level needs assessment, include evidence-based interventions, and identify resource inequities."], ["ATS: Additional Targeted Support", "Schools where one or more scholar groups perform at the level of CSI schools. The plan must address those groups and identify resource inequities. Schools that don’t exit in time can become CSI."], ["TSI: Targeted Support and Improvement", "Schools with consistently underperforming scholar groups, identified each year. The plan addresses those groups."], ["School Index components", "Growth, proficiency, graduation, English learner progress, school quality (including chronic absence) and test participation."]], "cites": [["MDE: Resources for identified schools", "https://www.michigan.gov/mde-supports"], ["MDE: Michigan School Index", "https://www.michigan.gov/mde-schoolindex"], ["ESSA Section 1111(d)", "https://oese.ed.gov/offices/office-of-formula-grants/school-support-and-accountability/essa-legislation-table-contents/title-i-part-a/"]]}, "grps": {"intro": "At GRPS:", "steps": [["Partnership Schools", "Schools identified for CSI, ATS or TSI. This year: 4 CSI, 7 ATS and 1 TSI."], ["Identified groups", "Marked with a ★ in the Comprehensive Needs Assessment."], ["Two priorities", "Partnership Schools may choose up to two priorities."], ["CAIL review", "Your Chief Academic and Instructional Leader reviews the plan."]], "note": "See every Partnership School and its groups on Title I at a glance."}, "watch": [["A plan that never mentions the identified groups.", "Name the groups in your need statements and goals."], ["Confusing identification with Title I eligibility.", "Title I is based on poverty; identification is based on performance."], ["Waiting for the state to tell you what to do.", "Use the needs assessment to decide."]], "practice": [{"type": "sort", "q": "CSI, ATS or TSI?", "buckets": ["CSI", "ATS", "TSI"], "items": [["Lowest-performing schools overall", 0, "CSI."], ["One or more groups perform like CSI schools", 1, "ATS."], ["Groups consistently underperform; identified every year", 2, "TSI."], ["High school with a low graduation rate", 0, "CSI includes this."], ["If it doesn’t exit in time, it can become CSI", 1, "ATS can move to CSI."]]}, {"type": "order", "q": "Put the identification and support cycle in order.", "items": ["The state runs the Michigan School Index", "Schools are identified for CSI, ATS or TSI", "The school’s needs assessment looks closely at the identified groups", "The plan names evidence-based interventions for those groups", "The CAIL and district review the plan", "The school carries out and monitors the plan", "Progress is checked against the exit criteria"]}, {"type": "lab", "lab": "groups", "q": "Data lab: GRPS Sample School’s identified groups"}, {"type": "scenario", "q": "Which goal best fits GRPS Sample School as an ATS school?", "opts": [["Raise reading for all scholars by 5 points.", 0, "It doesn’t name the identified groups."], ["Cut chronic absence for scholars with disabilities from 41% to 30%, and raise M-STEP reading proficiency for Black scholars from 15% to 22%.", 1, "Right. Both identified groups are named, with numbers."], ["Buy a new attendance program.", 0, "That’s a purchase, not a goal."]]}, {"type": "respond", "q": "A staff member asks, “Does being ATS mean we’re a failing school?” Write your answer.", "respond": {"model": "“No. ATS means the state found that one or two of our scholar groups, at our school Black scholars and scholars with disabilities, are performing at the level of the lowest schools. It tells us exactly where to focus. Our plan names those groups, and we get extra support from the district to close the gap.”", "look": ["Corrects the misunderstanding calmly", "Explains ATS accurately", "Names the groups", "Frames it as focus and support"]}}], "doit": {"text": "Open the <b>Comprehensive Needs Assessment<\/b> for your school. Find any ★ groups, and check that your priority and goal name them.", "tool": ["Comprehensive Needs Assessment", "../cna/"], "tasks": ["Find ★ groups", "Check need statements", "Check goal"]}, "quiz": [["Which is identified because scholar groups perform at the level of CSI schools?", ["TSI", "ATS", "CSI"], 1, "ATS."], ["GRPS calls CSI, ATS and TSI schools:", ["Focus Schools", "Partnership Schools", "Priority Schools"], 1, "GRPS term."], ["A Partnership School’s plan should:", ["Name the identified groups", "Avoid naming groups", "Only focus on all scholars"], 0, "Address identified groups directly."], ["Which is part of the Michigan School Index?", ["Chronic absence (school quality)", "Teacher salaries", "Building age"], 0, "School quality includes chronic absence."], ["CSI and ATS plans must also identify:", ["Resource inequities", "New staff", "Field trips"], 0, "Section 1111(d)."]], "reflect": {"prompt": "Is your school a Partnership School? If yes, which groups? If no, which group would you watch?", "plan": "Where in your plan will that group show up?"}, "facil": {"mins": 30, "open": "Show Title I at a glance and find your school.", "discuss": ["Which groups are identified, and do we name them in our plan?", "What resource inequities do we see?", "What does our CAIL need from us?"], "act": "Do the data lab together.", "close": "Agree where the identified groups will appear in the plan."}, "res": [["MDE: Identified schools", "https://www.michigan.gov/mde-supports"], ["MDE: School Index", "https://www.michigan.gov/mde-schoolindex"]], "confirm": ["This year’s Partnership School counts (4 CSI, 7 ATS, 1 TSI)", "CAIL review steps and dates"], "video": [["🗺️", "Partnership Schools", "GRPS’s name for schools the state identified for support."], ["🔴", "CSI", "The lowest-performing schools overall, or high schools with low graduation rates."], ["🟠", "ATS", "One or more scholar groups perform like CSI schools."], ["🟡", "TSI", "Scholar groups that consistently underperform, identified every year."], ["⭐", "Name the groups", "Plans must speak directly to the identified groups."], ["✅", "Your turn", "Use GRPS Sample School’s data and order the support cycle."]], "sub": "CSI, ATS, TSI and identified groups", "roles": ["Principal"]}, {"id": 7, "s": "fam", "t": "Family engagement and the law", "mins": 30, "goal": "Name what Section 1116 asks of every Title I school, and match your school’s practices to each requirement.", "can": ["I can name the main family engagement requirements.", "I can explain how families help plan and review the program.", "I can make information accessible to every family."], "why": {"story": "<b>GRPS Sample School<\/b> holds every family event at 6 p.m. Attendance is always the same 15 families. A support staff member asks, “Who are we missing, and why?”", "p": ["Family engagement isn’t an extra in Title I. It’s written into the law, with its own funding. Done well, it changes attendance, achievement and trust."]}, "rule": {"p": ["Section 1116 sets the family engagement requirements for districts and schools."], "points": [["Annual meeting (1116(c)(1))", "Explain Title I and families’ rights to be involved."], ["Flexible meetings (1116(c)(2))", "Meetings at different times; Title I can pay for transportation, child care or home visits related to engagement."], ["Involvement in planning (1116(c)(3))", "Families help plan, review and improve the program, the parent policy and the schoolwide plan."], ["Timely information (1116(c)(4))", "About the program, the curriculum, assessments and expected levels, and chances to meet and take part in decisions."], ["Compact and policy (1116(b), (d))", "A parent policy and school-parent compact developed jointly with families."], ["Building capacity (1116(e))", "Help families understand standards and assessments, give materials and training, and train staff to work with families as equal partners."], ["Accessibility (1116(e)(5), (f))", "Information in a format and language families understand; full opportunities for families with limited English, with disabilities, and of migratory children."], ["Funding (1116(a)(3))", "Districts over $500,000 reserve at least 1% for family engagement, give at least 90% of it to schools, and involve families in deciding how it’s used."]], "cites": [["ESSA Section 1116", "https://oese.ed.gov/offices/office-of-formula-grants/school-support-and-accountability/essa-legislation-table-contents/title-i-part-a/"]]}, "grps": {"intro": "At GRPS:", "steps": [["Support staff lead", "Social workers, community school coordinators and others run outreach, invitations, the compact and the parent policy."], ["Family engagement funds", "Your school’s family engagement allocation is spent on family engagement, with family input."], ["Languages", "Translate materials and schedule interpreters for meetings and conferences."], ["Evidence", "Keep agendas, sign-ins and evaluations for every parent meeting."]], "note": ""}, "watch": [["Every event at the same time.", "Offer different times and ways to take part."], ["Information only in English, or full of jargon.", "Translate it and use plain language."], ["Families asked to attend but not to decide.", "Give families real decisions: priorities, the compact, how to use family engagement funds."]], "practice": [{"type": "sort", "q": "Match each practice to the requirement it meets.", "buckets": ["Flexible meetings", "Planning", "Accessibility", "Building capacity"], "items": [["A morning coffee and an evening session on the same topic", 0, "Different times."], ["Caregivers vote on next year’s priority", 1, "Involvement in planning."], ["Spanish and Swahili interpreters at conferences", 2, "Language access."], ["A family workshop on reading MAP reports", 3, "Helps families understand assessments."], ["Training staff on working with families as partners", 3, "Capacity building includes staff."], ["A meeting moved to a family’s home", 0, "Home visits count."], ["Large-print copies of the compact", 2, "Format access."], ["Caregivers review the parent policy", 1, "Planning and review."]]}, {"type": "order", "q": "Put a year of family engagement in order, starting in spring.", "items": ["Spring: survey families", "Use the results in the needs assessment", "Revise the compact and parent policy with caregivers", "Fall: hold the annual Title I meeting", "Go over the compact at fall conferences", "Hold workshops that build family capacity all year", "Evaluate each event and adjust"]}, {"type": "scenario", "q": "Back to the 6 p.m. events. What should the team do first?", "opts": [["Add a second time, ask families what times work, and offer child care.", 1, "Right. Ask families, offer options and remove barriers."], ["Send more reminders for 6 p.m.", 0, "Reminders help, but the time may be the barrier."], ["Accept that families are busy.", 0, "Title I asks you to offer a flexible number of meetings and remove barriers."]]}, {"type": "scenario", "q": "The school has $6,200 in family engagement funds. How should it decide how to spend them?", "opts": [["The principal decides.", 0, "Families must be involved in decisions about family engagement funds."], ["Ask caregivers (survey, meeting or parent group) and tie the spending to the plan.", 1, "Right. Family input, tied to the plan."], ["Spend it on staff snacks for conferences.", 0, "Family engagement funds are for engaging families."]]}, {"type": "respond", "q": "A caregiver tells you, “The school only calls me when something is wrong.” Write what you’d say.", "respond": {"model": "“Thank you for telling me. You deserve to hear good news too. Can I get your best number and the time that works for you? I’ll make sure your child’s teacher sends a positive note this month, and I’d love your ideas for our next family night. What would make it worth your time?”", "look": ["Thanks the caregiver and listens", "Commits to a specific next step", "Asks for the family’s ideas", "Warm, plain language"]}}], "doit": {"text": "Open the <b>Title I Parent Compact and Title I Parent Policy<\/b> tool. In the Parent Policy tab, check each requirement against what your school actually does.", "tool": ["Title I Parent Compact and Title I Parent Policy", "../compact/"], "tasks": ["Open the Parent Policy", "Check each requirement", "Mark one to strengthen"]}, "quiz": [["Which section of ESSA covers family engagement?", ["1114", "1116", "1118"], 1, "Section 1116."], ["What must the annual meeting explain?", ["Title I and families’ rights to be involved", "The school budget only", "Test results only"], 0, "Section 1116(c)(1)."], ["Can Title I pay for child care so families can attend a meeting?", ["Yes, related to family engagement", "Never", "Only in high schools"], 0, "Section 1116(c)(2)."], ["Building capacity includes training:", ["Families and staff", "Only families", "Only principals"], 0, "Section 1116(e) covers both."], ["Who decides how family engagement funds are used?", ["The district alone", "Families are involved in the decision", "The PTA"], 1, "Section 1116(a)(3)."]], "reflect": {"prompt": "Which families is your school not reaching, and what might be in the way?", "plan": "What will you try to reach them?"}, "facil": {"mins": 35, "open": "List every family event last year with its time and attendance.", "discuss": ["Who came? Who didn’t?", "What decisions did families actually make?", "What languages and formats do we need?"], "act": "Do the matching sort as a team.", "close": "Pick one barrier to
