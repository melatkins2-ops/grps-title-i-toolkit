<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comprehensive Needs Assessment · GRPS Title I</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --ink:#15293b;--ink2:#3e4a55;--muted:#5a6570;--faint:#8a939b;
  --blue:#005696;--blue-soft:#e7f0f8;--orange:#c85a0b;--orange-bright:#f57b20;--need:#e8730f;--need-soft:#fce3cf;--need-ink:#8e3f06;
  --gold:#f0b310;--good:#1d7a4c;--good-soft:#e3f1e9;--warm:#fbf8f4;--sand:#f3efe9;--line:#e6ded3;--line2:#d9d1c5;--paper:#fff;
  --fd:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--fb:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--warm);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--fd);line-height:1.12;margin:0;text-wrap:balance}
p{margin:0}a{color:var(--blue)}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange-bright);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
/* top bar */
.bar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.bar-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 24px;max-width:1240px;margin:0 auto}
.home{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--line2);border-radius:999px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
.home:hover{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.bar img{height:36px;display:block}
.ttl{font-family:var(--fd);font-weight:700;font-size:19px;line-height:1.15}.ttl small{display:block;font-family:var(--fb);font-weight:500;font-size:13px;color:var(--muted)}
.sp{flex:1}
.saved{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font-weight:700;text-decoration:none;font-size:16px}
.btn.main{background:var(--orange);color:#fff}.btn.main:hover{background:#a94a07}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn.small{padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.6;cursor:default}
/* steps */
.steps{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:29}@media(max-width:600px){.steps{top:0}}
.steps ol{list-style:none;display:flex;gap:4px;margin:0 auto;padding:8px 24px;max-width:1240px;overflow-x:auto}
.steps button{border:0;background:none;padding:9px 14px;border-radius:999px;font-weight:600;font-size:15px;color:var(--ink2);display:flex;align-items:center;gap:8px;white-space:nowrap}
.steps button[aria-current="step"]{background:var(--ink);color:#fff}
.steps .dot{width:20px;height:20px;border-radius:999px;border:2px solid var(--line2);display:inline-grid;place-items:center;font-size:11px;font-weight:800}
.steps .dot.done{background:var(--good);border-color:var(--good);color:#fff}
.steps .dot.part{border-color:var(--orange)}
.steps button[aria-current="step"] .dot{border-color:#fff}
main{padding:30px 0 70px}
.kick{font-size:14px;font-weight:700;color:var(--orange)}
h1.big{font-size:clamp(32px,4.4vw,46px);margin:8px 0 12px}
.lead{font-size:18px;color:var(--ink2);max-width:680px}
.card{background:#fff;border-radius:18px;padding:22px}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:900px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:1fr}}
@media(max-width:600px){.bar{position:static}.bar-in{gap:10px;padding:10px 16px}.ttl{font-size:17px}.bar .btn.small{padding:8px 12px;font-size:13px}.topic-h b{min-width:0;flex:1 1 60%}.grid4,.grid2{grid-template-columns:1fr}.bar .ttl small,.saved,.bar img{display:none}.home span{display:none}.home{padding:8px}.wrap{padding:0 16px}.card{padding:18px}}
/* start */
.schoolpick{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:22px}
.schoolpick select{font-size:17px;font-weight:700;padding:12px 14px;border:2px solid var(--ink);border-radius:12px;background:#fff;max-width:100%}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.chip.id{background:var(--ink);color:#fff}
.note{display:flex;gap:10px;background:#fff4d6;border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.45;margin-top:14px;max-width:760px}
.typecard{background:#fff;border-radius:20px;padding:22px;text-align:left;border:2px solid transparent;display:flex;flex-direction:column;gap:8px;color:var(--ink);text-decoration:none}
.typecard:hover{border-color:var(--ink)}
.typecard h2{font-size:24px}
.ring{width:30px;height:30px;border-radius:999px;border:2px solid var(--line2);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.ring.done{background:var(--good);border-color:var(--good);color:#fff}.ring.part{border:3px solid var(--orange)}
.meter{height:8px;background:var(--sand);border-radius:9px;overflow:hidden;display:flex;gap:2px}
.meter i{display:block;height:100%}
/* topics */
.topic{background:#fff;border-radius:18px;margin-bottom:10px;border:2px solid transparent}
.topic.open{border-color:var(--orange)}
.topic-h{scroll-margin-top:130px;width:100%;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:none;border:0;padding:16px 20px;text-align:left;color:var(--ink)}
.topic-h b{flex:1;min-width:200px;font-size:17px}
.tag{font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--sand);color:var(--ink2)}
.tag.s{background:var(--blue-soft);color:#00406f}.tag.n{background:var(--need-soft);color:var(--need-ink)}.tag.b{background:#fff4d6;color:#7a5a00}.tag.x{background:#fff;border:1px dashed var(--faint);color:var(--muted)}
.tag.opt{background:none;border:1px solid var(--line2);color:var(--muted);font-weight:600}
.topic-b{padding:0 20px 20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px}
@media(max-width:820px){.topic-b{grid-template-columns:1fr}}
.q{font-size:20px;line-height:1.35;font-weight:600}
.bring{background:var(--warm);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:15px}
.bring b{font-size:12px;letter-spacing:.06em;color:var(--muted)}
.bring ul{margin:6px 0 0;padding-left:18px}
.where{font-size:14px;color:var(--ink2);margin-top:10px}
.marks{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.mk{border:2px solid var(--line2);background:#fff;border-radius:999px;padding:9px 16px;font-weight:700;color:var(--ink)}
.mk[aria-pressed="true"].s{background:var(--blue);border-color:var(--blue);color:#fff}
.mk[aria-pressed="true"].n{background:var(--need);border-color:var(--need);color:var(--ink)}
.mk[aria-pressed="true"].b{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.mk.x{border:0;background:none;text-decoration:underline;color:var(--muted);font-weight:600}
.mk[aria-pressed="true"].x{color:var(--ink);font-weight:800}
label.blk{display:block;font-weight:700;margin-top:16px}
textarea,.inp{width:100%;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;background:#fff;font-size:16px;margin-top:6px}
textarea{min-height:84px;resize:vertical}
.sugg{margin-top:14px;background:var(--blue-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.sugg button{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:999px;padding:5px 11px;font-weight:600;font-size:14px;margin:6px 6px 0 0}
/* chart */
.chartbox{background:var(--warm);border-radius:14px;padding:16px}
.big-n{font-family:var(--fd);font-size:46px;font-weight:800;line-height:1}
.bars{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.br{display:grid;grid-template-columns:130px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:14px}
.br .nm{font-weight:600}
.br .trk{height:26px;background:#fff;border-radius:6px;position:relative}
.br .fill{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0}
.br .ref{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.br input{width:70px;border:1px solid var(--line2);border-radius:8px;padding:5px 6px;text-align:right;font-weight:700;font-size:15px;background:#fff}
.insight{margin-top:12px;background:#fff3e8;border-radius:12px;padding:10px 12px;font-weight:600;font-size:15px}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs button{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:5px 12px;font-weight:600;font-size:14px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.src{font-size:12px;color:var(--muted);margin-top:8px}
@media(max-width:600px){.br{grid-template-columns:96px minmax(0,1fr) 62px}.br input{width:62px}}
.optlist{margin-top:22px}
.optlist .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.optlist .chips button{border:1px dashed var(--faint);background:#fff;border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px;color:var(--ink2)}
.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:26px;flex-wrap:wrap}
/* summary */
.story{background:var(--ink);color:#fff;border-radius:20px;padding:24px 26px}
.story .k{font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.06em}
.story p{font-size:21px;line-height:1.5;margin-top:8px}
.story textarea{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.3);font-size:18px}
.needcard{background:#fff;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
.rank{width:34px;height:34px;flex:none;border-radius:999px;background:var(--need);display:grid;place-items:center;font-weight:800}
.strip{display:flex;gap:4px}
.strip span{flex:1;padding:5px 0;text-align:center;border-radius:5px;font-size:11px;font-weight:700;background:var(--sand);color:var(--faint)}
.strip span.on{background:var(--need-soft);color:var(--ink)}
.mini{display:flex;align-items:flex-end;gap:5px;height:96px;border-bottom:1px solid var(--line2)}
.mini i{flex:1;border-radius:4px 4px 0 0;display:block;min-height:2px}
.mini-l{display:flex;gap:5px;font-size:11px;color:var(--muted);text-align:center}.mini-l span{flex:1;overflow:hidden;white-space:nowrap}
.checks{display:grid;gap:8px;font-size:14px}
.checks label{display:flex;gap:8px;align-items:center}
.checks select{border:1px solid var(--line2);border-radius:8px;padding:4px 6px;background:#fff;font-size:14px}
.pick{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700}
.pick[aria-pressed="true"]{background:var(--ink);color:#fff}
.tpick{display:flex;flex-wrap:wrap;gap:6px}
.tpick button{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.tpick button[aria-pressed="true"]{background:var(--need-soft);border-color:var(--need);color:var(--ink)}
.countbar{display:flex;gap:2px;height:28px;border-radius:6px;overflow:hidden;font-size:12px;font-weight:700}
.countbar span{display:grid;place-items:center}
/* plan */
.plan{background:#fff;border-radius:22px;padding:26px}
.ift{border-left:6px solid;padding:2px 0 2px 16px;margin-top:14px}
.ift b{font-family:var(--fd);font-size:18px}
.goalbar{height:26px;background:var(--sand);border-radius:6px;position:relative;margin-top:10px}
.silayer{background:var(--ink);color:#fff;border-radius:18px;padding:20px;margin-top:18px}
.silayer .k{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.06em}
.silayer .tpick button{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.3)}
.silayer .tpick button[aria-pressed="true"]{background:var(--orange-bright);color:var(--ink);border-color:var(--orange-bright)}
.silayer select{border-radius:8px;padding:6px 8px;border:0;background:#fff;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:50;max-width:90vw}
.empty{border:2px dashed var(--line2);border-radius:18px;padding:22px;color:var(--ink2)}
@media print{.bar,.steps,.navrow,.btn,.marks,.sugg,.optlist{display:none!important}body{background:#fff}.topic{break-inside:avoid}}
.ytdv{font-weight:700;text-align:right;min-width:64px;padding-right:12px}.br.ytd .nm{font-style:italic}
.handoff{margin-top:28px;background:#fff;border-radius:20px;padding:22px}.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.hcard{border:2px solid;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}.hcard .h3{font-size:18px}.hcard p{margin:0;font-size:14px;color:#33414D;flex:1}.hcard .btn{align-self:flex-start}
.samplenote{background:#FFF4EA;border-left:5px solid #C85A0B;border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:14.5px}
</style>
</head>

function xe(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function para(t,o={}){const runs=Array.isArray(t)?t.map(r=>typeof r==='string'?run(r,o):run(r.t,Object.assign({},o,r))).join(''):run(t,o);return `<w:p><w:pPr>${o.pb?'<w:pageBreakBefore/>':''}<w:spacing w:before="${o.before||0}" w:after="${o.after??120}"/>${o.bullet?'<w:ind w:left="360" w:hanging="240"/>':''}</w:pPr>${o.bullet?run('• ',o):''}${runs}</w:p>`}
function h1(t,pb){return para(t,{b:true,sz:34,color:'005696',after:60,pb})}
function h2(t){return para(t,{b:true,sz:26,color:'15293B',before:200,after:80})}
function cell(t,o={}){const ps=(Array.isArray(t)?t:[t]).map(x=>para((x&&typeof x==='object')?[x]:x,{sz:o.sz||19,b:o.b,after:30})).join('');return `<w:tc><w:tcPr>${o.w?`<w:tcW w:w="${o.w}" w:type="dxa"/>`:''}${o.shade?`<w:shd w:val="clear" w:color="auto" w:fill="${o.shade}"/>`:''}</w:tcPr>${ps||'<w:p/>'}</w:tc>`}
function table(head,rows,widths){const tr=(cells,hd)=>`<w:tr>${cells.map((c,i)=>cell(c,{b:hd,shade:hd?'F1F4F6':(c&&c.shade),w:widths&&widths[i]})).join('')}</w:tr>`;
 return `<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>${['top','left','bottom','right','insideH','insideV'].map(s=>`<w:${s} w:val="single" w:sz="4" w:color="B9C0C6"/>`).join('')}</w:tblBorders><w:tblCellMar><w:left w:w="90" w:type="dxa"/><w:right w:w="90" w:type="dxa"/></w:tblCellMar></w:tblPr>${head?tr(head,true):''}${rows.map(r=>tr(r)).join('')}</w:tbl>`+para('',{after:80})}
function numbersText(t){const x=S.topics[t.id];if(!x||!t.ch)return '';if(t.ch==='one')return num(x.v.one)!=null?`${x.v.one}${t.u==='%'?'%':''} ${t.lab}`:'';
 const out=[];(t.views||[t.ch]).forEach(vw=>{const d=chartData(t,vw);if(!d)return;const parts=[];if(vw==='grade'&&t.pre==='ca'&&mp1())parts.push('2026–27 MP1 ('+MP1D+')');if(num(d.ref)!=null&&!(t.metric&&vw==='group'))parts.push((vw==='group'?'All scholars':'Whole school')+' '+d.ref+(t.u||''));
  if(t.metric&&vw==='grade'){t.metric.forEach((m,mi)=>{const r=gradeRows().map(r=>{const v=x.v[mi+':'+r.k];return num(v)!=null?r.n+' '+v+'%':null}).filter(Boolean);if(r.length)parts.push(m+': '+r.join(', '))})}
  else if(t.metric){t.metric.forEach((m,mi)=>{const dd=chartData(t,vw,mi);const r=[];if(vw==='group'&&num(dd.all)!=null)r.push('All scholars '+dd.all+'%');dd.rows.forEach(q=>{if(num(q.v)!=null)r.push(q.n+' '+q.v+'%')});if(r.length)parts.push(m+': '+r.join(', '))})}
  else d.rows.forEach(r=>{if(num(r.v)!=null)parts.push(r.n+' '+r.v+(t.u||''))});
  if(t.pre==='ca'&&mp1()){const M=mp1();if(vw==='trend'&&mpPct(M.all)!=null)parts.push('2026–27 MP1 ('+MP1D+') '+mpPct(M.all)+'%');if(vw==='group'){const g=GROUPS.map((n,i)=>{const v=i?mpPct(M.grp[i]):mpPct(M.all);return v!=null?n+' '+v+'%':''}).filter(Boolean);if(g.length)parts.push('2026–27 MP1: '+g.join(', '))}}if(parts.length)out.push((t.views?VNAME[vw]+': ':'')+parts.join('; '))});return out.join(' | ')}
