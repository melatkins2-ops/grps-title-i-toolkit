<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learn by role · Title I Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#15293b;--blue:#005696;--soft:#e7f0f8;--desk:#eef0ee;--orange:#f57b20;--odk:#c85a0b;--good:#1d7a4c;--muted:#5a6570;--line:#dde3e8;--bg:#fbf8f4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3,.h{font-family:'Bricolage Grotesque',Figtree,sans-serif;line-height:1.15;margin:0}
a{color:var(--blue)}button{font:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header img{height:38px}.home{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:28px 22px 60px}
.k{font-size:12px;font-weight:800;letter-spacing:.07em;color:var(--muted);text-transform:uppercase}
.lead{color:var(--muted);font-size:17px;margin:6px 0 22px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.rc{background:#fff;border-radius:20px;padding:20px;border-top:6px solid;display:flex;flex-direction:column;gap:8px;text-align:left;border-left:0;border-right:0;border-bottom:0;box-shadow:0 2px 10px rgba(21,41,59,.06)}
.rc .em{font-size:32px}.rc b{font-family:'Bricolage Grotesque';font-size:22px}.rc p{margin:0;color:#33414d;font-size:14.5px;flex:1}.rc .meta{font-size:13px;color:var(--muted)}
.bar{display:flex;gap:4px;margin-top:4px}.bar span{flex:1;height:8px;border-radius:4px;background:var(--line)}.bar .d{background:var(--good)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:10px 16px;font-weight:700;color:#fff;background:var(--blue);text-decoration:none}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid #c7d3dd}.btn.sm{padding:7px 12px;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;align-items:start}
.steps{display:flex;flex-direction:column;gap:0}
.st{display:flex;gap:14px}.st .rail{display:flex;flex-direction:column;align-items:center}.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:#c7d3dd;flex:none}.dot.d{background:var(--good)}.dot.n{background:var(--orange)}
.st .ln{width:3px;flex:1;min-height:14px;background:var(--line)}
.sc{flex:1;background:#fff;border-radius:14px;padding:12px 16px;margin-bottom:12px;border:2px solid transparent;text-align:left;color:inherit;display:block;width:100%}
.sc.on{border-color:var(--orange)}.sc .row{display:flex;justify-content:space-between;gap:10px}.sc b{font-size:16px}.sc small{display:block;color:#33414d;font-size:14px;margin-top:2px}
.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:16px}
.card ol{margin:6px 0 0;padding-left:20px}.card li{margin:4px 0}
.opt{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;margin:6px 0;color:inherit}
.opt.right{border-color:var(--good);background:#f2faf5}.opt.wrong{border-color:#c0392b;background:#fdf1ef}
.fb{font-size:14px;margin-top:8px}.fb.ok{color:var(--good)}.fb.no{color:#a5321f}
.cert{background:#fff;border:3px solid var(--blue);border-radius:24px;padding:40px 28px;text-align:center;max-width:820px;margin:0 auto}
.cert .t{font-family:'Bricolage Grotesque';font-size:38px;font-weight:800;margin:8px 0}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}.pill{background:var(--soft);color:var(--blue);font-weight:700;font-size:13px;padding:5px 11px;border-radius:999px}
input.name{font:inherit;font-size:20px;padding:10px 14px;border:1.5px solid #c7d3dd;border-radius:10px;text-align:center;width:min(420px,100%)}
.note{font-size:13px;color:var(--muted)}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
@media print{header,.noprint{display:none!important}body{background:#fff}.cert{border-width:2px;margin-top:40px}}
</style></head><body>

const ROLES=[{"id": "principal", "n": "Principal", "e": "🧭", "c": "#005696", "d": "Leads the needs assessment, the plan, the budget and the annual meeting.", "steps": [{"m": "Aug", "t": "Know your Title I program", "d": "Schoolwide or targeted assistance, what Title I pays for at your school, and who is served.", "tool": ["Title I Program Requirements Guide", "program/"], "k": ["Check your school on the 2026–27 Title I Sites List: schoolwide or targeted assistance.", "Know the top things Title I pays for this year, including the family engagement set-aside.", "Targeted assistance schools serve identified scholars, using clear entry and exit criteria."], "q": ["In a targeted assistance school, who does Title I serve?", ["Every scholar in the building", "Scholars identified as needing extra help, using clear criteria", "Only scholars in grades 3–5"], 1, "Targeted assistance programs serve the scholars identified as most at risk of not meeting standards (ESSA §1115). Schoolwide programs can serve everyone."]}, {"m": "Aug–Sep", "t": "Lead the Comprehensive Needs Assessment", "d": "Bring your team, look at all four types of data, and choose a priority with an If/Then plan.", "tool": ["Comprehensive Needs Assessment", "cna/"], "k": ["Use all four types of data: demographic, academic, process and perception.", "Include caregivers and staff on the team, not just administrators.", "End with one priority (two if you are a Partnership School) and an If/Then/So That plan."], "q": ["Which kind of data tells you what adults are doing, like how MTSS or PBIS is working?", ["Demographic", "Perception", "Process"], 2, "Process data describes school systems and practices: instruction, extra help, discipline, PBIS, professional learning and family engagement."]}, {"m": "Aug–Oct", "t": "Plan and hold the annual Title I meeting", "d": "Set a time families can come, invite them, and present your program and plan.", "tool": ["Title I Annual Meeting Builder", "meeting/"], "k": ["If it is part of Open House, the Title I meeting still needs its own time and agenda.", "Post the flyer at least 72 hours ahead with the location, date, time and agenda (GRPS).", "Offer another time or way to take part for families who can’t come."], "q": ["A family can’t come to the evening meeting. What does Title I expect?", ["Nothing, one meeting is enough", "Offer meetings at different times, or another way to take part", "Email them the slides only"], 1, "Schools offer a flexible number of meetings at convenient times, and may provide transportation, childcare or home visits (ESSA §1116(c)(2))."]}, {"m": "Oct–Nov", "t": "Make sure the compact is used at conferences", "d": "Teachers go over the School-Parent Compact with each family.", "tool": ["Title I Parent Compact and Title I Parent Policy", "compact/"], "k": ["Elementary schools discuss the compact at parent-teacher conferences at least once a year.", "The compact’s goals and promises match your needs assessment plan.", "Every family gets a copy in a language they understand."], "q": ["In an elementary school, when must the compact be discussed with families?", ["At parent-teacher conferences, at least once a year", "Only at the annual meeting", "Only if a family asks"], 0, "ESSA §1116(d)(2)(A) requires conferences in elementary schools, at least annually, where the compact is discussed as it relates to the scholar’s achievement."]}, {"m": "After each MAP window", "t": "Check progress on your plan", "d": "Look at your plan’s measure after each marking period and adjust.", "tool": ["Comprehensive Needs Assessment", "cna/"], "k": ["Compare your plan’s measure to where you started and your goal.", "Targeted assistance schools re-check who is identified after each MAP window.", "Share progress with staff and families, not just at the end of the year."], "q": ["Your attendance plan isn’t moving the number after MP1. What should you do first?", ["Wait until spring to look again", "Look at the data with your team and adjust what adults are doing", "Pick a new priority"], 1, "A plan is checked and adjusted during the year. Change the adult actions in the IF before giving up on the priority."]}, {"m": "Mar–Jun", "t": "Revise with families and review the program", "d": "Update the compact, parent policy and needs assessment for next year, with caregiver input.", "tool": ["Title I Parent Compact and Title I Parent Policy", "compact/?tab=plan"], "k": ["Caregivers help review and revise the compact and the parent policy every year.", "Start next year’s needs assessment with this year’s results.", "Keep agendas, sign-ins and evaluations from every parent meeting as evidence."], "q": ["Who must help develop and revise the parent and family engagement policy?", ["Only the principal", "District office staff", "Caregivers, jointly with the school"], 2, "The policy is developed jointly with, agreed on with, and distributed to caregivers (ESSA §1116(b)(1))."]}]}, {"id": "liaison", "n": "Support staff", "e": "🤝", "c": "#C85A0B", "d": "Family liaisons, social workers, community school coordinators and others who run family outreach, meeting invitations, the compact and the parent policy.", "steps": [{"m": "Aug–Sep", "t": "Invite families to the annual meeting", "d": "Flyer, calls and texts in home languages, with supports that help families come.", "tool": ["Title I Annual Meeting Builder", "meeting/"], "k": ["Send invitations about 2 weeks ahead, plus a reminder the day before.", "Use families’ home languages and offer interpreters.", "Plan childcare, food or transportation help so more families can come."], "q": ["What does the GRPS meeting flyer need?", ["Only the date", "Location, date, time and agenda items, posted 72 hours ahead", "The principal’s signature"], 1, "GRPS requires the flyer to show location, date, time and agenda items, posted at least 72 hours in advance."]}, {"m": "Sep–Oct", "t": "Build the School-Parent Compact with families", "d": "Promises from the school, caregivers and scholars, written with caregivers.", "tool": ["Title I Parent Compact and Title I Parent Policy", "compact/"], "k": ["Caregivers help choose the promises; keep them realistic.", "Use the plan suggestions so the compact matches the school’s goal.", "Translate it into the languages families need."], "q": ["What is the compact?", ["A shared set of promises from the school, caregivers and scholars", "A contract families must sign to enroll", "A list of school rules"], 0, "The compact describes how the school, caregivers and scholars share responsibility for learning (ESSA §1116(d))."]}, {"m": "Sep–Nov", "t": "Update the Title I Parent Policy", "d": "How your school carries out each family engagement requirement.", "tool": ["Title I Parent Compact and Title I Parent Policy", "compact/?tab=plan"], "k": ["Use the examples, then change the details to fit your school.", "Show how caregivers help plan, review and improve the program.", "Share the policy with every family and post it."], "q": ["A family says they disagree with the schoolwide plan. What happens?", ["Nothing", "Their comments are submitted with the plan to the district", "They must attend a hearing"], 1, "If the plan isn’t satisfactory to caregivers, their comments are submitted with it (ESSA §1116(c)(5))."]}, {"m": "All year", "t": "Keep two-way communication going", "d": "Messages families understand, and ways for them to answer back.", "tool": ["Title I Parent Compact and Title I Parent Policy", "compact/"], "k": ["Share information in a format and language families understand.", "Give families ways to make suggestions and respond to them.", "Track who you are reaching and who you are missing."], "q": ["Which is two-way communication?", ["A newsletter", "A robocall", "A suggestion form the school answers in the newsletter"], 2, "Two-way means families can respond and the school answers back. ESSA §1116(c)(4)(C) asks schools to respond to suggestions."]}, {"m": "Mar–May", "t": "Bring family voice into next year", "d": "Survey families and bring their ideas to the needs assessment and the revisions.", "tool": ["Comprehensive Needs Assessment", "cna/"], "k": ["Run the spring caregiver survey and share results.", "Family voice is required perception data in the needs assessment.", "Invite caregivers to revise the compact and policy."], "q": ["Where does the caregiver survey go in the needs assessment?", ["Perception data", "Demographic data", "It isn’t part of it"], 0, "Family voice is perception data, one of the four types of data, and a required topic in the GRPS needs assessment."]}]}, {"id": "teacher", "n": "Teacher", "e": "📚", "c": "#1D7A4C", "d": "Uses the compact at conferences, shares progress, and gives extra help.", "steps": [{"m": "Aug", "t": "Know what Title I does at your school", "d": "Your program type and what Title I pays for in your building.", "tool": ["Title I Program Requirements Guide", "program/"], "k": ["Know if your school is schoolwide or targeted assistance.", "Know what Title I funds you might see: staff, tutoring, materials, family events.", "Title I adds to, not replaces, what scholars get."], "q": ["In a schoolwide program, who can Title I support?", ["Only scholars with IEPs", "All scholars in the building", "Only English learners"], 1, "Schoolwide programs can use Title I to improve the whole school for every scholar (ESSA §1114)."]}, {"m": "Oct–Nov", "t": "Go over the compact at conferences", "d": "Talk through the promises and your scholar’s progress with each family.", "tool": ["Title I Parent Compact and Title I Parent Policy", "compact/"], "k": ["Connect the compact to that scholar’s progress and goals.", "Ask families what would help them keep their promises.", "Note families you couldn’t reach and tell support staff."], "q": ["What should the compact conversation connect to?", ["The scholar’s own achievement", "School fundraising", "Bus routes"], 0, "At conferences the compact is discussed as it relates to the individual scholar’s achievement (ESSA §1116(d)(2)(A))."]}, {"m": "All year", "t": "Share progress and be easy to reach", "d": "Frequent reports to families and reasonable access to you.", "tool": ["Title I Parent Compact and Title I Parent Policy", "compact/"], "k": ["Send progress reports between report cards.", "Answer family messages within the time your compact promises.", "Use interpreters and plain language."], "q": ["What does Title I say about family access to teachers?", ["Families get reasonable access to staff", "Only at conferences", "Only through the office"], 0, "The compact describes reasonable access to staff, frequent progress reports and chances to volunteer and observe (ESSA §1116(d)(2)(B)–(C))."]}, {"m": "After each MAP window", "t": "Give extra help to the right scholars", "d": "Use the entry and exit criteria, and track progress.", "tool": ["Title I Program Requirements Guide", "program/"], "k": ["Use the district’s entry criteria to decide who gets Title I help.", "Check progress after each MAP window.", "Use the exit criteria; don’t keep scholars in by habit."], "q": ["How are scholars chosen for Title I extra help in a targeted school?", ["Teacher choice only", "Clear entry criteria, like NWEA results", "First come, first served"], 1, "Targeted assistance uses multiple, educationally related, objective criteria to identify scholars (ESSA §1115(c))."]}]}, {"id": "office", "n": "Office staff", "e": "🗂️", "c": "#9A7A00", "d": "Posts flyers and notices, runs sign-in, and keeps the evidence folder.", "steps": [{"m": "Aug–Sep", "t": "Post the meeting flyer and notices", "d": "On time, in the right places, in families’ languages.", "tool": ["Title I Annual Meeting Builder", "meeting/"], "k": ["Post the flyer at least 72 hours before the meeting.", "Make sure it lists the location, date, time and agenda items.", "Keep a copy and a photo of where it was posted."], "q": ["How far ahead must the GRPS meeting flyer be posted?", ["The morning of the meeting", "At least 72 hours ahead", "One month ahead"], 1, "GRPS requires parent meeting flyers to be posted at least 72 hours in advance."]}, {"m": "Meeting night", "t": "Run sign-in and evaluations", "d": "A dated, labeled sign-in sheet and a family evaluation.", "tool": ["Title I Annual Meeting Builder", "meeting/"], "k": ["Use the Title I sign-in sheet, dated and labeled with the meeting.", "Families sign in in person.", "Hand out and collect evaluations at the end."], "q": ["The meeting is part of Open House. Which sign-in sheet do you use?", ["The Open House sheet", "A separate Title I sheet for the Title I part", "No sheet needed"], 1, "The Title I segment needs its own sign-in sheet, separate from the other event."]}, {"m": "All year", "t": "Help families get information they understand", "d": "Translated letters, interpreters, and help requesting formats.", "tool": ["Title I Parent Compact and Title I Parent Policy", "compact/?tab=plan"], "k": ["Know which languages families need and where translations are.", "Schedule interpreters for meetings and conferences.", "Help families who ask for large print or other formats."], "q": ["A caregiver asks for the compact in Swahili. What should happen?", ["Tell them only English is available", "Provide it in a language they understand, to the extent practicable", "Ask a scholar to translate"], 1, "Information goes to families in a format and language they understand, to the extent practicable (ESSA §1116(e)(5), (f))."]}, {"m": "Within a week of each meeting", "t": "Keep the evidence folder", "d": "Agenda, sign-ins, evaluations and minutes, together and uploaded.", "tool": ["Title I Annual Meeting Builder", "meeting/"], "k": ["Every parent meeting: agenda, sign-in sheet and evaluations kept together.", "Add minutes and the flyer.", "Upload to the school’s Title I folder by the date your team set."], "q": ["Which set belongs in the evidence folder for every parent meeting?", ["Agenda, sign-in sheet and evaluations", "Just the flyer", "Just photos"], 0, "GRPS keeps the agenda, sign-in sheet and evaluations together for every parent meeting."]}]}];const BASE='../';const KEY='grps-title1-learn-v1';
let P={};try{P=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const st=r=>P[r.id]||(P[r.id]={done:[],ans:{},name:'',sel:0,cert:''});
const nDone=r=>r.steps.filter((s,i)=>st(r).done.includes(i)).length;
const nRight=r=>r.steps.filter((s,i)=>st(r).ans[i]===s.q[2]).length;
const complete=r=>nDone(r)===r.steps.length&&nRight(r)===r.steps.length;

 <div class="roles">${ROLES.map(r=>`<button class="rc" style="border-top-color:${r.c}" data-role="${r.id}"><span class="em" aria-hidden="true">${r.e}</span><b>${esc(r.n)}</b><p>${esc(r.d)}</p><span class="meta">${r.steps.length} steps · about ${r.steps.length*6} minutes${nDone(r)?` · ${nDone(r)} done`:''}</span>${bar(r)}<span class="btn sm" style="background:${r.c};align-self:flex-start;margin-top:4px">${complete(r)?'See certificate':nDone(r)?'Keep going':'Start'} →</span></button>`).join('')}</div>
 <p class="note" style="margin-top:18px">Progress saves in this browser. Steps, timing and quick checks reflect GRPS practice and ESSA Section 1116; check with the Title I office for your school’s dates.</p>`}

 <div class="grid"><div class="steps">${steps}</div><div>
 <div class="card"><div class="k">Step ${i+1} · ${esc(s.m)}</div><h2 style="font-size:22px;margin:6px 0 8px">${esc(s.t)}</h2><b style="font-size:15px">The 3 things that matter</b><ol>${s.k.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
  <div style="margin-top:14px"><a class="btn" href="${BASE+tu}" target="_blank" rel="noopener">Open ${esc(tn)} →</a></div></div>
 <div class="card"><div class="k">Quick check</div><b style="display:block;font-size:16px;margin:6px 0 4px">${esc(q[0])}</b>${qa}${fb}</div>
 <div class="card" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn ${done?'ghost':''}" data-done="1" style="${done?'':'background:var(--good)'}">${done?'✓ Step done (undo)':'Mark this step done'}</button>${i<r.steps.length-1?`<button class="btn ghost" data-step="${i+1}">Next step →</button>`:''}${complete(r)?`<button class="btn" style="background:var(--odk)" data-go="cert">Get your certificate →</button>`:(nDone(r)===r.steps.length?'<span class="note">Answer every quick check correctly to unlock the certificate.</span>':'')}</div>
 </div></div>`}

/* ---- calendar (.ics) ---- */
const MON={Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
function syear(){const d=new Date();return d.getMonth()+1>=7?d.getFullYear():d.getFullYear()-1}
function yr(m,y0){return m>=7?y0:y0+1}
function lastDay(y,m){return new Date(y,m,0).getDate()}
function ymd(y,m,d){return String(y)+String(m).padStart(2,'0')+String(d).padStart(2,'0')}
function windows(lbl,y0){
 if(lbl==='After each MAP window')return [['after fall MAP',10,1,10,15],['after winter MAP',2,1,2,15],['after spring MAP',6,1,6,12]].map(([t,m1,d1,m2,d2])=>({t,a:ymd(yr(m1,y0),m1,d1),b:ymd(yr(m2,y0),m2,d2+1)}));
 const m=lbl.match(/^([A-Z][a-z]{2})(?:–([A-Z][a-z]{2}))?$/);if(!m)return [];
 const m1=MON[m[1]],m2=MON[m[2]||m[1]];const y1=yr(m1,y0),y2=yr(m2,y0);
 const e=new Date(y2,m2-1,lastDay(y2,m2)+1);return [{t:'',a:ymd(y1,m1,1),b:ymd(e.getFullYear(),e.getMonth()+1,e.getDate())}]}
function icsText(t){return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function fold(l){let o='';while(l.length>74){o+=l.slice(0,74)+'\r\n ';l=l.slice(74)}return o+l}
function makeIcs(r,alarm){const y0=syear();const now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//GRPS//Title I Toolkit//EN','CALSCALE:GREGORIAN','X-WR-CALNAME:Title I · '+r.n];
 const today=ymd(new Date().getFullYear(),new Date().getMonth()+1,new Date().getDate());[y0,y0+1].forEach(Y=>r.steps.forEach((s,i)=>windows(s.m,Y).filter(w=>w.b>today).forEach((w,j)=>{const url=new URL(BASE+s.tool[1],location.href).href;
  L.push('BEGIN:VEVENT','UID:grps-t1-'+r.id+'-'+i+'-'+j+'-'+Y+'@title1toolkit','DTSTAMP:'+now,'DTSTART;VALUE=DATE:'+w.a,'DTEND;VALUE=DATE:'+w.b,
  fold('SUMMARY:'+icsText('Title I: '+s.t+(w.t?' ('+w.t+')':''))),
  fold('DESCRIPTION:'+icsText(s.d+'\n\nWhat matters:\n- '+s.k.join('\n- ')+'\n\nOpen '+s.tool[0]+': '+url+'\n\nTiming is a general window. Check your school’s dates with the Title I office.')),
  'URL:'+url,'TRANSP:TRANSPARENT',...(alarm?['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsText('Title I: '+s.t),'TRIGGER:-P7D','END:VALARM']:[]),'END:VEVENT')})));
 L.push('END:VCALENDAR');return L.join('\r\n')}
function dlIcs(r,alarm){const blob=new Blob([makeIcs(r,alarm)],{type:'text/calendar'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Title-I-'+r.id+'-calendar.ics';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function render(){const h=(location.hash||'').slice(1).split('/');const r=ROLES.find(x=>x.id===h[0]);const app=document.getElementById('app');
 app.innerHTML=!r?home():(h[1]==='certificate'&&complete(r)?cert(r):path(r));save()}
let cur=()=>ROLES.find(x=>x.id===(location.hash||'').slice(1).split('/')[0]);
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const r=cur();
 if(b.dataset.role){location.hash=b.dataset.role;return}
 if(b.dataset.go==='home'){location.hash='';return}
 if(b.dataset.go==='cert'){location.hash=r.id+'/certificate';return}
 if(b.dataset.print){window.print();return}
 if(b.dataset.ics){const r=cur();if(r){const al=document.getElementById('icsalarm');dlIcs(r,!!(al&&al.checked));st(r).icsOpen=false;render()}return}
 if(b.dataset.icsopen){const r=cur();if(r){st(r).icsOpen=!st(r).icsOpen;render()}return}
 if(!r)return;const S=st(r);
 if(b.dataset.step!=null){S.sel=+b.dataset.step;render();scrollTo({top:0,behavior:'smooth'});return}
 if(b.dataset.ans!=null){S.ans[S.sel||0]=+b.dataset.ans;render();return}
 if(b.dataset.done){const i=S.sel||0;S.done=S.done.includes(i)?S.done.filter(x=>x!==i):[...S.done,i];render();return}});
document.addEventListener('input',e=>{if(e.target.id==='nm'){const r=cur();st(r).name=e.target.value;document.getElementById('nmshow').textContent=e.target.value||'[Your name]';save()}});
window.addEventListener('hashchange',render);render();
</script></body></html>
